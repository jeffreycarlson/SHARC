name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish package with npm provenance
    runs-on: ubuntu-latest
    # Surface the secret presence as a string env var so step-level `if:`
    # expressions can gate on it. GitHub Actions does not allow direct
    # access to the `secrets` context inside step `if:` conditions.
    env:
      NPM_TOKEN_PRESENT: ${{ secrets.NPM_TOKEN != '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release prerequisites
        shell: bash
        run: |
          missing=0
          for path in package.json package-lock.json tsconfig.json; do
            if [ ! -f "$path" ]; then
              echo "Missing required release prerequisite: $path" >&2
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "Release publish is intentionally blocked until the package/build prerequisites land (package.json, package-lock.json, tsconfig.json, plus the remaining build scripts and protocol-contract diff tooling documented in docs/distribution-design.md)." >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build release artifacts
        run: npm run build

      - name: Enforce size budgets
        run: npm run size

      - name: Inspect publish tarball
        run: npm pack --dry-run

      - name: Publish to npm with provenance attestation
        if: env.NPM_TOKEN_PRESENT == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Skip npm publish (NPM_TOKEN not configured)
        if: env.NPM_TOKEN_PRESENT != 'true'
        run: |
          echo "::notice title=npm publish skipped::NPM_TOKEN secret is not set on this repository. The tag, build, and dist artifact are still produced; add NPM_TOKEN to enable publishing on the next tag push. See RELEASING.md."

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
