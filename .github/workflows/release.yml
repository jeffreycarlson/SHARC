name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish package with npm provenance
    runs-on: ubuntu-latest
    # Surface the secret presence as a string env var so step-level `if:`
    # expressions can gate on it. GitHub Actions does not allow direct
    # access to the `secrets` context inside step `if:` conditions.
    env:
      NPM_TOKEN_PRESENT: ${{ secrets.NPM_TOKEN != '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release prerequisites
        shell: bash
        run: |
          missing=0
          for path in package.json package-lock.json tsconfig.json; do
            if [ ! -f "$path" ]; then
              echo "Missing required release prerequisite: $path" >&2
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "Release publish is intentionally blocked until the package/build prerequisites land (package.json, package-lock.json, tsconfig.json, plus the remaining build scripts and protocol-contract diff tooling documented in docs/distribution-design.md)." >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate CHANGELOG release notes (#294)
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          NOTES_FILE=$(mktemp)

          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {flag=1; next}
            /^## \[/ {flag=0}
            flag
          ' CHANGELOG.md > "$NOTES_FILE"

          if [ ! -s "$NOTES_FILE" ]; then
            echo "::error title=Missing release notes::No CHANGELOG section found for version $VERSION. Did you rename [Unreleased] to [$VERSION] - YYYY-MM-DD before tagging? See RELEASING.md."
            exit 1
          fi

      - name: Run full release gate before publish (#275)
        run: npm run check:ci
        env:
          BFCACHE_INSTALL_MS: '750'

      - name: Validate publish tarball artifact (#276)
        run: npm run pack:verify -- --keep --metadata package-tarball.json

      - name: Publish to npm with provenance attestation
        if: env.NPM_TOKEN_PRESENT == 'true'
        run: |
          TARBALL="$(node -p "JSON.parse(require('fs').readFileSync('package-tarball.json', 'utf8')).path")"
          npm publish "$TARBALL" --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Skip npm publish (NPM_TOKEN not configured)
        if: env.NPM_TOKEN_PRESENT != 'true'
        run: |
          echo "::notice title=npm publish skipped::NPM_TOKEN secret is not set on this repository. The tag, build, and dist artifact are still produced; add NPM_TOKEN to enable publishing on the next tag push. See RELEASING.md."

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"

          # Skip if a release already exists for this tag (idempotent re-runs).
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice title=Release already exists::$TAG release exists; skipping creation."
            exit 0
          fi

          # Detect prerelease tags by the SemVer dash convention (e.g.
          # `v0.8.0-rc.1`, `v1.0.0-beta`). Stable tags get `--latest`;
          # prerelease tags get `--prerelease` and are NOT marked latest.
          if [[ "$VERSION" == *-* ]]; then
            RELEASE_FLAG=(--prerelease)
          else
            RELEASE_FLAG=(--latest)
          fi

          # Extract the matching CHANGELOG section. Pattern matches the version
          # header (`## [X.Y.Z]`) and stops at the next `## [` header.
          NOTES_FILE=$(mktemp)
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {flag=1; next}
            /^## \[/ {flag=0}
            flag
          ' CHANGELOG.md > "$NOTES_FILE"

          if [ ! -s "$NOTES_FILE" ]; then
            echo "::error title=Missing release notes::No CHANGELOG section found for version $VERSION. Did you rename [Unreleased] to [$VERSION] - YYYY-MM-DD before tagging? See RELEASING.md."
            exit 1
          fi

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "SHARC $VERSION" \
            --notes-file "$NOTES_FILE" \
            "${RELEASE_FLAG[@]}"
