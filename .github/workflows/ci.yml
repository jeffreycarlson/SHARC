name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Size, and Pack Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all modules
        run: npm run build

      - name: Test treeshaking
        run: npm run test:treeshake

      - name: Smoke test (built artifacts importable)
        run: npm run test:smoke

      - name: Type-check published consumer surface
        run: npm run test:types

      - name: Placement-change dedup regression (issue #6)
        run: npm run test:placement

      - name: Placement-stamping + cleanup invariant (issue #40)
        run: npm run test:placement-stamping

      - name: Creative Sources construction validation (issue #41)
        run: npm run test:creative-sources

      - name: Creative Sources load + renderer protocol (issue #41)
        run: npm run test:creative-sources-load

      - name: Navigation bridge unit coverage (issue #41)
        run: npm run test:navigation-bridge

      - name: Creative SDK auto-install runtime regression (issue #41 Phase E)
        run: npm run test:creative-sdk-autoinstall

      - name: Bridges detection unit coverage (issue #82)
        run: npm run test:bridges-detection

      - name: Renderer DOMParser + replaceChildren fallback (issue #41)
        run: npm run test:renderer-fallback

      - name: Creative Sources performance harness (issue #41, AC L1170)
        # CI runners are noisy neighbors; perf tests can flake on shared
        # hardware. Pass-if-any-of-3-runs balances false-failure rate against
        # actual regression detection — a true regression will fail all 3
        # runs reliably, while a single noisy iteration won't fail the build.
        run: |
          for attempt in 1 2 3; do
            echo "=== Perf attempt $attempt ==="
            if npm run test:perf; then
              echo "Perf harness passed on attempt $attempt"
              exit 0
            fi
            echo "Perf attempt $attempt failed, retrying..."
          done
          echo "Perf harness failed all 3 attempts"
          exit 1

      - name: Enforce size budgets
        run: npm run size

      - name: Inspect publish tarball
        run: |
          npm pack --dry-run
          npm pack

      - name: Verify tarball contents
        run: |
          tar -tzf *.tgz | sort > tarball-contents.txt
          echo "=== Tarball Contents ==="
          cat tarball-contents.txt

          # Verify expected files exist in tarball (npm pack prefixes with package/)
          echo "=== Validating tarball structure ==="
          if tar -tzf *.tgz | grep -q "dist/sharc-protocol.js$"; then
            echo "✓ Protocol module present"
          fi
          if tar -tzf *.tgz | grep -q "dist/sharc-container.js$"; then
            echo "✓ Container module present"
          fi
          if tar -tzf *.tgz | grep -q "dist/sharc-creative.js$"; then
            echo "✓ Creative module present"
          fi
          if tar -tzf *.tgz | grep -q "LICENSE$"; then
            echo "✓ LICENSE file present"
          fi
          if tar -tzf *.tgz | grep -q "README.md$"; then
            echo "✓ README.md present"
          fi

      - name: Extract and validate tarball
        run: |
          tar -xzf *.tgz
          echo "=== Extracted directory structure ==="
          find package -type f | sort

          # Verify package.json is valid
          echo "=== Validating package.json ==="
          if grep -q '"exports"' package/package.json; then
            echo "✓ Package has exports field"
          fi
          if grep -q '"files"' package/package.json; then
            echo "✓ Package has files field"
          fi
