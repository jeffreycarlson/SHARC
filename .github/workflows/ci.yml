name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Size, and Pack Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Version consistency guard — package.json ↔ lockfile ↔ source (#238)
        run: node scripts/sync-version.js --check

      - name: CI test-suite parity guard (#274)
        run: node scripts/check-ci-test-all-built-parity.js

      - name: Build all modules
        run: npm run build

      - name: Run full dist-based test suite (#274)
        run: npm run test:all:built

      - name: Type-check published consumer surface
        run: npm run test:types

      - name: HTML lifecycle adapter bfcache round-trip (issue #178)
        # bfcache is famously CI-flaky — Chrome's install heuristics vary
        # across versions and CI hardware. The test runner internally retries
        # behavioral assertions (bf-2, bf-3, bf-4) up to 3 times; structural
        # assertions (bf-1, bf-5) run once. A true regression fails all 3
        # behavioral attempts with the same diagnostic; a flake mixes pass/fail.
        run: npm run test:bfcache
        env:
          BFCACHE_INSTALL_MS: '750'

      - name: Creative Sources performance harness (issue #41, AC L1170)
        # CI runners are noisy neighbors; perf tests can flake on shared
        # hardware. Pass-if-any-of-3-runs balances false-failure rate against
        # actual regression detection — a true regression will fail all 3
        # runs reliably, while a single noisy iteration won't fail the build.
        run: |
          for attempt in 1 2 3; do
            echo "=== Perf attempt $attempt ==="
            if npm run test:perf; then
              echo "Perf harness passed on attempt $attempt"
              exit 0
            fi
            echo "Perf attempt $attempt failed, retrying..."
          done
          echo "Perf harness failed all 3 attempts"
          exit 1

      - name: Enforce size budgets
        run: npm run size

      - name: Check size-history delta (#310)
        run: npm run size-history:check

      - name: Verify publish tarball contents (#276)
        run: npm run pack:verify
