name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Size, and Pack Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all modules
        run: npm run build

      - name: Enforce size budgets
        run: npm run size

      - name: Test treeshaking
        run: npm run test:treeshake

      - name: Inspect publish tarball
        run: npm pack --dry-run

      - name: Verify tarball contents
        run: |
          tar -tzf sharc-*.tgz | sort > tarball-contents.txt
          echo "=== Tarball Contents ==="
          cat tarball-contents.txt
          
          # Verify expected files exist in tarball
          echo "=== Validating tarball structure ==="
          if tar -tzf sharc-*.tgz | grep -q "^dist/sharc-protocol.js$"; then
            echo "✓ Protocol module present"
          fi
          if tar -tzf sharc-*.tgz | grep -q "^dist/sharc-container.js$"; then
            echo "✓ Container module present"
          fi
          if tar -tzf sharc-*.tgz | grep -q "^dist/sharc-creative.js$"; then
            echo "✓ Creative module present"
          fi
          if tar -tzf sharc-*.tgz | grep -q "^LICENSE$"; then
            echo "✓ LICENSE file present"
          fi
          if tar -tzf sharc-*.tgz | grep -q "^README.md$"; then
            echo "✓ README.md present"
          fi

      - name: Extract and validate tarball
        run: |
          tar -xzf sharc-*.tgz
          echo "=== Extracted directory structure ==="
          find sharc-* -type f | sort
          
          # Verify package.json is valid
          echo "=== Validating package.json ==="
          if grep -q '"exports"' sharc-*/package.json; then
            echo "✓ Package has exports field"
          fi
          if grep -q '"files"' sharc-*/package.json; then
            echo "✓ Package has files field"
          fi
