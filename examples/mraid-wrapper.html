<!doctype html>
<!--
  mraid-wrapper.html — Same-origin MRAID creative wrapper page

  This page is loaded inside the SHARC container iframe instead of the MRAID
  creative directly. It establishes the SHARC SDK and MRAID bridge before
  loading the creative, satisfying the MRAID contract that window.mraid is
  available synchronously before the creative's first <script> runs.

  Load order (per mraid-bridge-design.md §4):
    1. sharc-protocol.js  → window.SHARC.Protocol
    2. sharc-creative.js  → window.SHARC (full SDK)
    3. sharc-mraid-bridge.js → window.mraid

  Then the creative is loaded via ?creative=<url>.

  Usage:
    /sharc/mraid-wrapper.html?creative=https%3A%2F%2Fexample.com%2Fad.html

  For same-origin test creatives, a relative path works:
    mraid-wrapper.html?creative=test/test-mraid-creative.html
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MRAID Wrapper</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }
    /* Visible error overlay shown when the creative fails to load */
    #sharc-load-error {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(220,38,38,0.92);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, monospace;
      font-size: 12px;
      padding: 16px;
      box-sizing: border-box;
      overflow-y: auto;
      z-index: 9999;
    }
    #sharc-load-error strong { display: block; font-size: 14px; margin-bottom: 8px; }
  </style>

  <!--
    Scripts MUST load synchronously in this order.
    Each script runs to completion before the next one starts,
    ensuring window.mraid is available before creative code executes.
  -->
  <!-- MRAID 3.0 §2.1 — must exist before creative loads -->
  <script>
    window.MRAID_ENV = {
      version: "3.0",
      sdk: "SHARC MRAID Bridge",
      sdkVersion: "0.2.0",
      appId: "",
      ifa: "",
      limitAdTracking: false,
      coppa: false
    };
  </script>
  <script src="sharc-protocol.js"></script>
  <script src="sharc-creative.js"></script>
  <script src="sharc-mraid-bridge.js"></script>
</head>
<body>
  <script>
    (function () {
      'use strict';

      var params = new URLSearchParams(location.search);
      var creativeUrl = params.get('creative');

      if (!creativeUrl) {
        showError('No ?creative= parameter provided.');
        return;
      }

      // Resolve the creative URL relative to the wrapper's own location.
      // This handles both absolute URLs and relative paths safely.
      var resolvedUrl;
      try {
        resolvedUrl = new URL(creativeUrl, location.href).href;
      } catch (e) {
        showError('Invalid creative URL: ' + creativeUrl + ' (' + e.message + ')');
        return;
      }

      // Security: only load http(s) and same-origin relative URLs.
      // Block javascript: and data: schemes.
      var allowedSchemes = ['http:', 'https:'];
      var parsed;
      try {
        parsed = new URL(resolvedUrl);
      } catch (e) {
        showError('Could not parse creative URL: ' + resolvedUrl);
        return;
      }

      if (allowedSchemes.indexOf(parsed.protocol) === -1) {
        showError('Blocked creative URL with disallowed scheme: ' + parsed.protocol);
        return;
      }

      // Detect whether the creative URL is an HTML page or a JS file.
      // HTML creatives are loaded in an iframe; JS-only creatives are script-injected.
      var pathname = parsed.pathname || '';
      var isHtml = !pathname.match(/\.js(\?|$)/i);

      if (isHtml) {
        // HTML creatives: load the HTML structure via XMLHttpRequest (sync, same-origin),
        // inject the body DOM, then load the companion .js file (same basename) via
        // <script src> — which works from null-origin sandboxed iframes.
        // fetch() is blocked in null-origin contexts; XHR sync is deprecated but works.
        //
        // Convention: test-mraid-creative.html pairs with test-mraid-creative.js.
        // The .js file contains all script logic; the .html contains only DOM structure.
        var xhr = new XMLHttpRequest();
        xhr.open('GET', resolvedUrl, false); // synchronous
        try {
          xhr.send();
        } catch (e) {
          showError('XHR failed to load creative HTML: ' + e.message + '\nURL: ' + resolvedUrl);
          return;
        }
        if (xhr.status !== 200) {
          showError('HTTP ' + xhr.status + ' loading creative HTML\nURL: ' + resolvedUrl);
          return;
        }
        var parser = new DOMParser();
        var doc = parser.parseFromString(xhr.responseText, 'text/html');

        // Inject <style> tags from creative <head>
        Array.from(doc.head.querySelectorAll('style')).forEach(function (el) {
          document.head.appendChild(document.adoptNode(el));
        });

        // Inject <body> content (without scripts — those are in the .js file).
        // Warn if the creative HTML contained inline <script> tags: they are
        // silently dropped by innerHTML assignment and won't execute.
        var strippedScripts = doc.body.querySelectorAll('script').length;
        if (strippedScripts > 0) {
          console.warn('[MRAID Wrapper] ' + strippedScripts + ' <script> tag(s) in creative HTML' +
            ' were not executed. Move all script logic to the companion .js file.');
        }
        document.body.innerHTML = doc.body.innerHTML;

        // Load companion .js file on next tick so injected DOM is fully parsed
        // before the creative script accesses getElementById etc.
        // After the script loads, call window.__SHARC_TEST_mraidCreativeInit() if the creative
        // exposed it — this replaces fragile requestAnimationFrame DOM polling.
        var jsUrl = resolvedUrl.replace(/\.html(\?.*)?$/, '.js$1');
        setTimeout(function () {
          var script = document.createElement('script');
          script.src = jsUrl;
          script.onload = function () {
            if (typeof window.__SHARC_TEST_mraidCreativeInit === 'function') {
              var initFn = window.__SHARC_TEST_mraidCreativeInit;
              // Delete before calling: prevents a malicious or buggy creative from
              // re-invoking init (re-injecting DOM, re-registering listeners) if the
              // callback reference leaks or if a future code path calls it again.
              delete window.__SHARC_TEST_mraidCreativeInit;
              initFn();
            } else {
              showError('Creative script loaded but window.__SHARC_TEST_mraidCreativeInit is not defined.\nEnsure ' + jsUrl + ' exposes window.__SHARC_TEST_mraidCreativeInit.');
            }
          };
          script.onerror = function () {
            showError('Failed to load creative script: ' + jsUrl);
          };
          document.body.appendChild(script);
        }, 0);

      } else {
        // JS-only creative: inject as a script tag.
        // window.mraid is already available (set by sharc-mraid-bridge.js above).
        var script = document.createElement('script');
        script.src = resolvedUrl;
        script.onerror = function () {
          showError('Failed to load creative script: ' + resolvedUrl);
        };
        document.body.appendChild(script);
      }
    }());

    function showError(msg) {
      console.error('[MRAID Wrapper]', msg);
      var el = document.getElementById('sharc-load-error');
      if (el) {
        el.innerHTML = '<strong>⚠ MRAID Wrapper — Load Error</strong>' +
          msg.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
        el.style.display = 'block';
      }
    }
  </script>
  <!-- Error overlay (hidden until a load failure occurs) -->
  <div id="sharc-load-error"></div>
</body>
</html>
