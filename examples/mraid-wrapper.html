<!doctype html>
<!--
  mraid-wrapper.html — Same-origin MRAID creative wrapper page

  This page is loaded inside the SHARC container iframe instead of the MRAID
  creative directly. It establishes the SHARC Creative API and MRAID bridge before
  loading the creative, satisfying the MRAID contract that window.mraid is
  available synchronously before the creative's first <script> runs.

  Load order (per mraid-bridge-design.md §4):
    1. sharc-protocol.js  → window.SHARC.Protocol
    2. sharc-creative.js  → window.SHARC.Creative
    3. sharc-mraid-bridge.js → window.mraid

  Then the creative is loaded via ?creative=<url>.

  Usage:
    /sharc/mraid-wrapper.html?creative=https%3A%2F%2Fexample.com%2Fad.html

  For same-origin test creatives, a relative path works:
    mraid-wrapper.html?creative=../test/browser/test-mraid-creative.html
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MRAID Wrapper</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }
    /* Visible error overlay shown when the creative fails to load */
    #sharc-load-error {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(220,38,38,0.92);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, monospace;
      font-size: 12px;
      padding: 16px;
      box-sizing: border-box;
      overflow-y: auto;
      z-index: 9999;
    }
    #sharc-load-error strong { display: block; font-size: 14px; margin-bottom: 8px; }
  </style>

  <!--
    Module scripts are deferred by the browser and execute in declaration order.
    The inline module script imports SHARC modules directly, eliminating the
    boot-order race that existed with classic <script src> + inline classic script.

    Load order:
      1. sharc-protocol.js       → window.SHARC.Protocol  (deferred module)
      2. sharc-creative.js       → window.SHARC.Creative      (deferred module)
      3. sharc-mraid-bridge.js   → window.mraid           (deferred module)
      4. Inline <body> module    → imports SHARC, loads creative
  -->
  <!--
    Test-harness console capture shim — MUST run before any SHARC or creative code.

    Forwards every console.log / console.error / console.warn call made inside this
    (null-origin, sandboxed) creative realm to the parent frame via postMessage. The
    parent's console is per-realm and cannot observe this realm's console directly
    (see docs/reviews/mraid-compliance-harness-2026-04-11.md §4), so the only viable
    capture path is in-realm interception + postMessage forwarding.

    Gated on a ?harness=1 query flag so production use of mraid-wrapper.html does not
    pay the forwarding cost. The MRAID 3.0 compliance runner sets this flag.
  -->
  <script>
    (function () {
      if (!/[?&]harness=1\b/.test(location.search)) return;
      var suite = (new URLSearchParams(location.search).get('suite')) || '';
      var levels = ['log', 'warn', 'error', 'info'];
      levels.forEach(function (level) {
        var orig = console[level];
        console[level] = function () {
          // Stringify args defensively — structured-clone can fail on DOM nodes,
          // window refs, or cyclic objects. Fall back to String() per-arg.
          var args = [];
          for (var i = 0; i < arguments.length; i++) {
            var a = arguments[i];
            try {
              if (typeof a === 'string') args.push(a);
              else args.push(String(a));
            } catch (e) { args.push('[unserializable]'); }
          }
          try {
            // postMessage IS legal cross-origin from null-origin iframes — only
            // direct window.parent.* property access throws SecurityError.
            window.parent.postMessage({
              source: 'sharc-test-harness',
              kind: 'console',
              level: level,
              suite: suite,
              text: args.join(' ')
            }, '*');
          } catch (e) { /* best-effort — never break the console */ }
          return orig.apply(console, arguments);
        };
      });

      // DOM text harvester — some compliance ads (notably viewability/) do NOT
      // use console.log for their self-reports; they call a local displayMessage()
      // helper that writes a <p> node into the ad body. Without this harvester
      // the viewability suite produces zero captured signal even when the ad
      // runs to completion. See review Finding 15 and
      // examples/compliance-ads/viewability/viewabilityCompliance.v1.js:14434.
      //
      // We install a MutationObserver on document.body after DOMContentLoaded
      // and forward the textContent of every added element as a synthetic
      // "console" message with level='dom'. The runner's parser already accepts
      // PASSED:/FAILED:/CHECK:/FAIL: prefixes regardless of level, so the
      // viewability ad's self-reports will land in the compliance matrix iff
      // it writes lines matching that convention. For free-text reports (e.g.
      // "Environment is not MRAIDV3 Compatible because ...") they at least show
      // up in the consoleStream so reviewers can see what the ad produced.
      document.addEventListener('DOMContentLoaded', function () {
        try {
          var seen = new WeakSet();
          var forward = function (txt) {
            var clean = String(txt || '').trim();
            if (!clean || clean.length > 1000) return;
            try {
              window.parent.postMessage({
                source: 'sharc-test-harness',
                kind: 'console',
                level: 'dom',
                suite: suite,
                text: clean,
              }, '*');
            } catch (e) { /* ignore */ }
          };
          var obs = new MutationObserver(function (mutations) {
            mutations.forEach(function (mut) {
              mut.addedNodes.forEach(function (node) {
                if (!node || seen.has(node)) return;
                seen.add(node);
                // Only harvest element text; skip script/style/style attribute noise.
                if (node.nodeType === 1) {
                  var tag = (node.tagName || '').toLowerCase();
                  if (tag === 'script' || tag === 'style') return;
                  var txt = node.textContent;
                  if (txt) forward(txt);
                }
              });
            });
          });
          obs.observe(document.body, { childList: true, subtree: true });
        } catch (e) { /* never break the wrapper */ }
      });
    }());
  </script>
  <!-- MRAID 3.0 §2.1 — must exist before creative loads -->
  <script>
    window.MRAID_ENV = {
      version: "3.0",
      // Obvious test placeholders — production hosts override with real SDK metadata
      // (e.g., sdk: "Google Mobile Ads", sdkVersion: "11.2.0").
      sdk: "TestAdSDK",
      sdkVersion: "0.0.0",
      appId: "",
      ifa: "",
      limitAdTracking: false,
      coppa: false
    };
  </script>
  <script type="module">
    // Import SHARC modules to ensure they're loaded (side-effect imports)
    import '../src/sharc-creative.js';
    import '../src/sharc-mraid-bridge.js';

    (function () {
      'use strict';

      var params = new URLSearchParams(location.search);
      var creativeUrl = params.get('creative');

      if (!creativeUrl) {
        showError('No ?creative= parameter provided.');
        return;
      }

      // Resolve the creative URL relative to the wrapper's own location.
      // This handles both absolute URLs and relative paths safely.
      var resolvedUrl;
      try {
        resolvedUrl = new URL(creativeUrl, location.href).href;
      } catch (e) {
        showError('Invalid creative URL: ' + creativeUrl + ' (' + e.message + ')');
        return;
      }

      // Security: only load http(s) and same-origin relative URLs.
      // Block javascript: and data: schemes.
      var allowedSchemes = ['http:', 'https:'];
      var parsed;
      try {
        parsed = new URL(resolvedUrl);
      } catch (e) {
        showError('Could not parse creative URL: ' + resolvedUrl);
        return;
      }

      if (allowedSchemes.indexOf(parsed.protocol) === -1) {
        showError('Blocked creative URL with disallowed scheme: ' + parsed.protocol);
        return;
      }

      // Detect whether the creative URL is an HTML page or a JS file.
      // HTML creatives are loaded in an iframe; JS-only creatives are script-injected.
      var pathname = parsed.pathname || '';
      var isHtml = !pathname.match(/\.js(\?|$)/i);

      if (isHtml) {
        // HTML creatives: load the HTML structure via XMLHttpRequest (sync, same-origin),
        // inject the body DOM, then load the companion .js file (same basename) via
        // <script src> — which works from null-origin sandboxed iframes.
        // fetch() is blocked in null-origin contexts; XHR sync is deprecated but works.
        //
        // Convention: test-mraid-creative.html pairs with test-mraid-creative.js.
        // The .js file contains all script logic; the .html contains only DOM structure.
        var xhr = new XMLHttpRequest();
        xhr.open('GET', resolvedUrl, false); // synchronous
        try {
          xhr.send();
        } catch (e) {
          showError('XHR failed to load creative HTML: ' + e.message + '\nURL: ' + resolvedUrl);
          return;
        }
        if (xhr.status !== 200) {
          showError('HTTP ' + xhr.status + ' loading creative HTML\nURL: ' + resolvedUrl);
          return;
        }
        var parser = new DOMParser();
        var doc = parser.parseFromString(xhr.responseText, 'text/html');

        // Inject <style> tags from creative <head>
        Array.from(doc.head.querySelectorAll('style')).forEach(function (el) {
          document.head.appendChild(document.adoptNode(el));
        });

        // Inject <body> content (without scripts — those are in the .js file).
        // Warn if the creative HTML contained inline <script> tags: they are
        // silently dropped by innerHTML assignment and won't execute.
        var strippedScripts = doc.body.querySelectorAll('script').length;
        if (strippedScripts > 0) {
          console.warn('[MRAID Wrapper] ' + strippedScripts + ' <script> tag(s) in creative HTML' +
            ' were not executed. Move all script logic to the companion .js file.');
        }
        document.body.innerHTML = doc.body.innerHTML;

        // Load companion .js file after two rAFs so injected DOM is fully parsed
        // AND laid out before the creative script accesses getElementById /
        // getBoundingClientRect. Double-rAF replaces the old `setTimeout(..., 0)`
        // which could race ahead of layout on slower machines and produce zero
        // rects. See docs/reviews/mraid-compliance-harness-2026-04-11.md §9.
        //
        // After the script loads, call window.__SHARC_TEST_mraidCreativeInit()
        // if the creative exposed it. If not, assume the creative self-initializes
        // at script parse time (the pattern used by the IAB compliance ads) and
        // proceed silently. Test harness creatives that DO expose the callback
        // (e.g. test-mraid-creative.js) still get the synchronous init guarantee.
        var jsUrl = resolvedUrl.replace(/\.html(\?.*)?$/, '.js$1');
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            var script = document.createElement('script');
            script.src = jsUrl;
            script.onload = function () {
              if (typeof window.__SHARC_TEST_mraidCreativeInit === 'function') {
                var initFn = window.__SHARC_TEST_mraidCreativeInit;
                // Delete before calling: prevents a malicious or buggy creative from
                // re-invoking init (re-injecting DOM, re-registering listeners) if the
                // callback reference leaks or if a future code path calls it again.
                delete window.__SHARC_TEST_mraidCreativeInit;
                initFn();
              }
              // else: creative self-initializes at parse time (IAB compliance ads).
              // No showError — the missing callback is tolerated as a valid authoring mode.
            };
            script.onerror = function () {
              showError('Failed to load creative script: ' + jsUrl);
            };
            document.body.appendChild(script);
          });
        });

      } else {
        // JS-only creative: inject as a script tag.
        // window.mraid is already available (set by sharc-mraid-bridge.js above).
        var script = document.createElement('script');
        script.src = resolvedUrl;
        script.onerror = function () {
          showError('Failed to load creative script: ' + resolvedUrl);
        };
        document.body.appendChild(script);
      }
    }());

    function showError(msg) {
      console.error('[MRAID Wrapper]', msg);
      var el = document.getElementById('sharc-load-error');
      if (el) {
        el.innerHTML = '<strong>⚠ MRAID Wrapper — Load Error</strong>' +
          msg.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
        el.style.display = 'block';
      }
    }
  </script>
  <!-- Error overlay (hidden until a load failure occurs) -->
  <div id="sharc-load-error"></div>
</body>
</html>
