<!doctype html>
<!--
  mraid-wrapper.html — Same-origin MRAID creative wrapper page

  This page is loaded inside the SHARC container iframe instead of the MRAID
  creative directly. It establishes the SHARC SDK and MRAID bridge before
  loading the creative, satisfying the MRAID contract that window.mraid is
  available synchronously before the creative's first <script> runs.

  Load order (per mraid-bridge-design.md §4):
    1. sharc-protocol.js  → window.SHARC.Protocol
    2. sharc-creative.js  → window.SHARC (full SDK)
    3. sharc-mraid-bridge.js → window.mraid

  Then the creative is loaded via ?creative=<url>.

  Usage:
    /sharc/mraid-wrapper.html?creative=https%3A%2F%2Fexample.com%2Fad.html

  For same-origin test creatives, a relative path works:
    mraid-wrapper.html?creative=test/test-mraid-creative.html
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MRAID Wrapper</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }
  </style>

  <!--
    Scripts MUST load synchronously in this order.
    Each script runs to completion before the next one starts,
    ensuring window.mraid is available before creative code executes.
  -->
  <!-- MRAID 3.0 §2.1 — must exist before creative loads -->
  <script>
    window.MRAID_ENV = {
      version: "3.0",
      sdk: "SHARC MRAID Bridge",
      sdkVersion: "0.2.0",
      appId: "",
      ifa: "",
      limitAdTracking: false,
      coppa: false
    };
  </script>
  <script src="sharc-protocol.js"></script>
  <script src="sharc-creative.js"></script>
  <script src="sharc-mraid-bridge.js"></script>
</head>
<body>
  <script>
    (function () {
      'use strict';

      var params = new URLSearchParams(location.search);
      var creativeUrl = params.get('creative');

      if (!creativeUrl) {
        console.error('[MRAID Wrapper] No ?creative= parameter provided.');
        return;
      }

      // Resolve the creative URL relative to the wrapper's own location.
      // This handles both absolute URLs and relative paths safely.
      var resolvedUrl;
      try {
        resolvedUrl = new URL(creativeUrl, location.href).href;
      } catch (e) {
        console.error('[MRAID Wrapper] Invalid creative URL:', creativeUrl);
        return;
      }

      // Security: only load http(s) and same-origin relative URLs.
      // Block javascript: and data: schemes.
      var allowedSchemes = ['http:', 'https:'];
      var parsed;
      try {
        parsed = new URL(resolvedUrl);
      } catch (e) {
        console.error('[MRAID Wrapper] Could not parse creative URL:', resolvedUrl);
        return;
      }

      if (allowedSchemes.indexOf(parsed.protocol) === -1) {
        console.error('[MRAID Wrapper] Blocked creative URL with disallowed scheme:', parsed.protocol);
        return;
      }

      // Detect whether the creative URL is an HTML page or a JS file.
      // HTML creatives are loaded in an iframe; JS-only creatives are script-injected.
      var pathname = parsed.pathname || '';
      var isHtml = !pathname.match(/\.js(\?|$)/i);

      if (isHtml) {
        // HTML creative: fetch and inject inline into this document.
        //
        // We do NOT use a nested iframe here. mraid-wrapper.html is itself already
        // loaded inside the SHARC container's sandboxed iframe (allow-scripts only,
        // no allow-same-origin). A nested iframe would be doubly-sandboxed, and
        // window.parent.mraid access would throw a SecurityError.
        //
        // By fetching the creative HTML and injecting its <body> content inline,
        // the creative runs in the same window context as this wrapper, where
        // window.mraid is already available. This is the correct pattern for
        // same-origin test creatives.
        //
        // For cross-origin production creatives, the MRAIDCompatBridge container
        // plugin handles injection via a separate mechanism.
        fetch(resolvedUrl)
          .then(function (res) {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.text();
          })
          .then(function (html) {
            // Parse the fetched HTML and inject the <body> content + <head> styles/scripts
            var parser = new DOMParser();
            var doc = parser.parseFromString(html, 'text/html');

            // Inject <style> and <link> tags from creative <head>
            Array.from(doc.head.querySelectorAll('style, link[rel="stylesheet"]')).forEach(function (el) {
              document.head.appendChild(document.adoptNode(el));
            });

            // Inject <body> content
            var container = document.createElement('div');
            container.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;overflow:hidden;';
            container.innerHTML = doc.body.innerHTML;
            document.body.appendChild(container);

            // Re-execute <script> tags (innerHTML doesn't execute scripts)
            Array.from(container.querySelectorAll('script')).forEach(function (oldScript) {
              var newScript = document.createElement('script');
              if (oldScript.src) {
                newScript.src = new URL(oldScript.src, resolvedUrl).href;
              } else {
                newScript.textContent = oldScript.textContent;
              }
              oldScript.parentNode.replaceChild(newScript, oldScript);
            });
          })
          .catch(function (err) {
            console.error('[MRAID Wrapper] Failed to load HTML creative:', err);
          });

      } else {
        // JS-only creative: inject as a script tag.
        // window.mraid is already available (set by sharc-mraid-bridge.js above).
        var script = document.createElement('script');
        script.src = resolvedUrl;
        script.onerror = function () {
          console.error('[MRAID Wrapper] Failed to load creative script:', resolvedUrl);
        };
        document.body.appendChild(script);
      }
    }());
  </script>
</body>
</html>
