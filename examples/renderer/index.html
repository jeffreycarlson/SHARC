    var allowedBridges = [];
    for (var bi = 0; bi < bridgesToLoad.length; bi++) {
      var ident = bridgesToLoad[bi];
      if (KNOWN_BRIDGES.indexOf(ident) !== -1) {
        allowedBridges.push(ident);
      } else {
        // SE guardrail #1: silent skip for unknown identifiers via
        // customSecurityLog (operator-routable warning), NOT an error.
        // Forward-compat lever: a future container's `'omid'` etc.
        // doesn't break this render.
        window.__sharcRenderer.customSecurityLog(
          'Unknown bridge identifier in :render — skipping. '
            + 'identifier=' + JSON.stringify(ident) + '. '
            + 'Known: ' + JSON.stringify(KNOWN_BRIDGES) + '. '
            + 'This is expected if you\'re running an older renderer with '
            + 'a newer container. Update the renderer fork to pick up newer '
            + 'bridge identifiers.',
          { severity: 'warn', reason: 'unknown_bridge_skipped',
            bridge: typeof ident === 'string' ? ident : '<non-string>' });
      }
    }

    var shouldInstallMraidCompatibilityWrapper = allowedBridges.indexOf('mraid') !== -1;
    var shouldInstallSafeFrameCompatibilityWrapper = allowedBridges.indexOf('safeframe') !== -1;
    var dynamicBridgesToLoad = allowedBridges.filter(function (bridgeName) {
      return bridgeName !== 'mraid' && bridgeName !== 'safeframe';
    });

    if (dynamicBridgesToLoad.length > 0) {
      // Thread :render session context to compatibility bridges before
      // dynamic import so auto-install timeout diagnostics identify the
      // placement that failed to load SHARC SDK.
      window.__sharcPlacementSessionId__ = placementSessionId;
      try {
        // Promise.all: concurrent load. Each rejection bubbles up to the
        // catch below and we surface the FIRST failure via :failed
        // (subsequent failures are logged via customSecurityLog inside
        // loadBridgeModule).
        var loadPromises = [];
        for (var li = 0; li < dynamicBridgesToLoad.length; li++) {
          (function (b) {
            loadPromises.push(
              loadBridgeModule(b).then(
                function () { /* success — bridge auto-installs once SHARC SDK loads */ },
                function (loadErr) {
                  // Re-throw with the bridge identifier + URL so the outer
                  // catch can post :failed with the right `bridge` and `url`
                  // fields. `url` is the resolved absolute URL (success/import
                  // path) OR the substituted-but-unparseable string (rare).
                  var wrapped = new Error(
                    'bridge_load_failed: ' + b + ' — '
                      + (loadErr && loadErr.message ? String(loadErr.message) : 'unknown'));
                  /** @type {any} */ (wrapped).bridge = b;
                  /** @type {any} */ (wrapped).url =
                    (loadErr && /** @type {any} */ (loadErr).url)
                      ? /** @type {any} */ (loadErr).url
                      : '';
                  throw wrapped;
                }
              )
            );
          }(dynamicBridgesToLoad[li]));
        }
        await Promise.all(loadPromises);
      } catch (bridgeLoadErr) {
        // Bridge load failed. Surface to the container via :failed with
        // a structured `bridge` field; the container routes this to the
        // `bridge_load_failed` discriminated-union variant on
        // onSecurityEvent. We MUST stop here — proceeding to
        // document.write without the bridge would silently drop MRAID/
        // SafeFrame APIs the creative depends on, which is precisely
        // the bug 0.7.1 was created to prevent.
        var failedBridge = (bridgeLoadErr && /** @type {any} */ (bridgeLoadErr).bridge)
          ? /** @type {any} */ (bridgeLoadErr).bridge
          : 'unknown';
        var failedBridgeUrl = (bridgeLoadErr && /** @type {any} */ (bridgeLoadErr).url)
          ? /** @type {any} */ (bridgeLoadErr).url
          : '';
        window.__sharcRenderer.customSecurityLog(
          'Bridge load failed — refusing to render. bridge=' + failedBridge
            + (failedBridgeUrl ? ' url=' + failedBridgeUrl : '')
            + ' cause=' + (bridgeLoadErr && bridgeLoadErr.message
              ? String(bridgeLoadErr.message) : 'unknown')
            + '. Possible causes: (1) module 404 — verify the bridge path '
            + 'resolves from the renderer page; (2) MIME mismatch — modules '
            + 'must be served as application/javascript; (3) cross-origin '
            + 'BRIDGE_URL_TEMPLATE — check the renderer config.',
          { severity: 'error', reason: 'bridge_load_failed',
            bridge: failedBridge });
        // Post :failed to the container with the bridge identifier + url so
        // the container's onSecurityEvent gets `bridge_load_failed` with the
        // full failure context. `url` is bounded to 500 chars (matches the
        // renderer-side cap on the same value); `bridge` to 200.
        if (window.parent && window.parent !== window) {
          try {
            window.parent.postMessage({
              type: 'SHARC:Renderer:failed',
              placementSessionId: placementSessionId,
              // 0.7.7: echo the fragment nonce for the container's
              // protocol-router gate (step 7).
              sharcNonce: nonce,
              reason: 'bridge_load_failed',
              bridge: String(failedBridge).slice(0, 200),
              url: String(failedBridgeUrl).slice(0, 500),
            }, containerOrigin);
          } catch (_) { /* swallow — postMessage in torn-down frame */ }
        }
        return;
      }
    }

    // ─── Meta-refresh strip ────────────────────────────────────────────
    // Renderer-side only — meta refresh redirects the iframe outside any
    // JS interception path. We strip BEFORE document.write so the browser
    // never sees the refresh element.
    //
    // DOMParser-based strip (Phase D pass-1 review fix). A naive regex on
    // the literal token `refresh` is bypassable via HTML entity encoding —
    // `<meta http-equiv="&#114;efresh" ...>` survives the regex but the
    // HTML parser decodes the entity before it pragma-matches, so the
    // browser still triggers the refresh. DOMParser invokes the actual
    // HTML parser; `getAttribute('http-equiv')` then returns the decoded
    // value, which normalizes to `refresh` after `.toLowerCase()`.
    //
    // Parsing into a DOMParser document is a parse-only operation: no
    // <script> executes, no resources load, no Service Worker is invoked.
    // Safe to materialize the creative HTML this way before document.write.
    //
    // Adversarial creative HTML can still defeat this (e.g. by setting
    // meta refresh dynamically post-load), but the container-side
    // load-event backstop catches that too.
    html = stripMetaRefresh(html);

    // ─── Operator hook: onBeforeRender ────────────────────────────────
    // Fires AFTER stripMetaRefresh + history.replaceState, BEFORE
    // document.open() / document.write() / document.close(). Operators
    // may inspect the html or the validated payload. Must be synchronous
    // — see hook JSDoc above.
    try {
      window.__sharcRenderer.onBeforeRender(html, data);
    } catch (hookErr) {
      window.__sharcRenderer.customSecurityLog(
        'onBeforeRender hook threw — proceeding with render: '
          + (hookErr && hookErr.message ? String(hookErr.message) : 'unknown'),
        { severity: 'warn', reason: 'on_before_render_hook_threw' });
    }
    // document.open shim (C5): install BEFORE the renderer's own
    // document.open()/write()/close() below so the native refs are captured
    // and the shim is in place. It stays in PASS-THROUGH mode (__shimArmed
    // false) for the renderer's own initial write, and is armed only after
    // that write completes (end of this function) — so it triggers
    // re-injection on a SUBSEQUENT creative reopen, never on the renderer's
    // own write (ADR §1).
    __shimPlacementSessionId = placementSessionId;
    __shimContainerOrigin = containerOrigin;
    installDocumentRewriteShim();

    // Begin capturing composed prelude `code` bodies (C1: same source + baked
    // nonce as first render, replayed on every reopen) for the re-injection
    // shim. Capture spans the full prelude composition chain below.
    __recordPreludes = true;
    html = installLoadProbePrelude(html, placementSessionId, containerOrigin, nonce);

    // ─── OMID shim source-rewrite (0.7.8, § 4.3 mechanism i) ───────────
    // When the container flagged `omid: true` on the validated :render
    // envelope, source-rewrite the OMID shim into the markup with the OMID
    // protocolNonce baked as a closure constant — BEFORE document.write so
    // window.omid3p is live for the verification client's first synchronous
    // probe (§ 4.1). OMID-off path: `data.omid` is falsy, this block is
    // skipped, and the render is byte-identical to pre-0.7.8.
    //
    // A shim-injection failure is FATAL for the render (parity with bridge
    // load failure): proceeding to document.write without the shim would
    // silently drop the OMID measurement the container asked for. We post
    // :failed with reason='omid_shim_inject_failed' and stop.
    if (data.omid === true) {
      // C1: `data.omidProtocolNonce` is the OMID chain SEED (the container's
      // onReady-delivered anchor). Build the reverse OMID chain and bake the TIP
      // (gen-0 gate value) so the shim's Register validates at router gate step 7
      // and the reopen shim can walk the chain in lockstep with the container's
      // SHARC:Omid: rotation.
      try { await buildOmidChain(data.omidProtocolNonce); }
      catch (_) { __shimOmidNonce = data.omidProtocolNonce; }
      try {
        html = await installOmidShimPrelude(
          html, __shimOmidNonce, placementSessionId, containerOrigin,
          nonce);
      } catch (omidErr) {
        var omidErrUrl = (omidErr && /** @type {any} */ (omidErr).url)
          ? /** @type {any} */ (omidErr).url
          : '';
        window.__sharcRenderer.customSecurityLog(
          'OMID shim injection failed — refusing to render. '
            + (omidErrUrl ? 'url=' + omidErrUrl + ' ' : '')
            + 'cause=' + (omidErr && omidErr.message
              ? String(omidErr.message) : 'unknown')
            + '. Possible causes: (1) shim 404 — verify OMID_SHIM_URL resolves '
            + 'from the renderer page; (2) MIME/CSP block on the fetch; '
            + '(3) cross-origin OMID_SHIM_URL — must be same-origin.',
          { severity: 'error', reason: 'omid_shim_inject_failed' });
        postFailed('omid_shim_inject_failed',
          placementSessionId, containerOrigin);
        return;
      }
    }

    // ─── MRAID compatibility wrapper source-rewrite (#321 Decision 3) ──
    // A raw legacy MRAID creative ships no SHARC SDK. When `data.bridges`
    // includes `mraid`, compose the existing protocol + creative SDK +
    // MRAID bridge IIFE builds into a renderer-owned prelude before the
    // creative's first script. This preserves the strict SHARC handshake:
    // the wrapper-provisioned creative SDK calls createSession normally, then
    // the existing bridge maps Container:init/active to MRAID ready/default
    // and viewableChange(true). Native SHARC and plain HTML paths are skipped.
    if (shouldInstallMraidCompatibilityWrapper) {
      try {
        html = await installMraidCompatibilityWrapperPrelude(html);
      } catch (mraidErr) {
        var mraidErrUrl = (mraidErr && /** @type {any} */ (mraidErr).url)
          ? /** @type {any} */ (mraidErr).url
          : '';
        window.__sharcRenderer.customSecurityLog(
          'MRAID wrapper injection failed — refusing to render. '
            + (mraidErrUrl ? 'url=' + mraidErrUrl + ' ' : '')
            + 'cause=' + (mraidErr && mraidErr.message
              ? String(mraidErr.message) : 'unknown')
            + '. Possible causes: (1) wrapper component 404 — verify '
            + 'MRAID_WRAPPER_*_URL values resolve from the renderer page; '
            + '(2) MIME/CSP block on the fetch; (3) cross-origin wrapper URL '
            + '— all components must be same-origin.',
          { severity: 'error', reason: 'bridge_load_failed', bridge: 'mraid' });
        if (window.parent && window.parent !== window) {
          try {
            window.parent.postMessage({
              type: 'SHARC:Renderer:failed',
              placementSessionId: placementSessionId,
              sharcNonce: nonce,
              reason: 'bridge_load_failed',
              bridge: 'mraid',
              url: String(mraidErrUrl).slice(0, 500),
            }, containerOrigin);
          } catch (_) { /* swallow — postMessage in torn-down frame */ }
        }
        return;
      }
    }

    // ─── SafeFrame compatibility wrapper source-rewrite (#339) ─────────
    // The SafeFrame analogue of the MRAID wrapper above. A raw legacy
    // SafeFrame creative ships no SHARC SDK. When `data.bridges` includes
    // `safeframe`, compose the existing protocol + creative SDK + SafeFrame
    // bridge IIFE builds into a renderer-owned prelude before the creative's
    // first script. This preserves the strict SHARC handshake: the wrapper-
    // provisioned creative SDK calls createSession normally, then the existing
    // bridge maps Container:init/active to $sf.ext geometry callbacks — so
    // R1's container->creative state push reaches the bridge. Native SHARC
    // and plain HTML paths are skipped.
    if (shouldInstallSafeFrameCompatibilityWrapper) {
      try {
        html = await installSafeFrameCompatibilityWrapperPrelude(html);
      } catch (safeframeErr) {
        var safeframeErrUrl = (safeframeErr && /** @type {any} */ (safeframeErr).url)
          ? /** @type {any} */ (safeframeErr).url
          : '';
        window.__sharcRenderer.customSecurityLog(
          'SafeFrame wrapper injection failed — refusing to render. '
            + (safeframeErrUrl ? 'url=' + safeframeErrUrl + ' ' : '')
            + 'cause=' + (safeframeErr && safeframeErr.message
              ? String(safeframeErr.message) : 'unknown')
            + '. Possible causes: (1) wrapper component 404 — verify '
            + 'SAFEFRAME_WRAPPER_*_URL values resolve from the renderer page; '
            + '(2) MIME/CSP block on the fetch; (3) cross-origin wrapper URL '
            + '— all components must be same-origin.',
          { severity: 'error', reason: 'bridge_load_failed', bridge: 'safeframe' });
        if (window.parent && window.parent !== window) {
          try {
            window.parent.postMessage({
              type: 'SHARC:Renderer:failed',
              placementSessionId: placementSessionId,
              sharcNonce: nonce,
              reason: 'bridge_load_failed',
              bridge: 'safeframe',
              url: String(safeframeErrUrl).slice(0, 500),
            }, containerOrigin);
          } catch (_) { /* swallow — postMessage in torn-down frame */ }
        }
        return;
      }
    }

    // Prelude composition complete — stop capturing for the re-injection
    // shim. __harnessPreludes now holds the exact ordered set of harness
    // preludes (loadProbe → OMID → mraid/safeframe as applicable) to
    // re-prepend on every creative reopen.
    __recordPreludes = false;

    // ─── Render anchor = inner `window 'load'` ─────────────────────────
    // Per ADR 2026-06-13 §5.2 (R-2) the :rendered post is anchored to the
    // inner document's `window 'load'` (full subresource load), NOT
    // DOMContentLoaded — so `creative-rendered` uniformly means "fully
    // loaded" across both render paths, and the container's load-anchored
    // handshake never precedes a fully-rendered creative.
    //
    // The load listener is registered AFTER `document.close()` (§5.4): a
    // listener registered before document.open()/write() does not survive
    // the reopen (the HTML spec wipes document/window listeners on
    // document.open()). Registering post-close, plus the readyState backup,
    // makes the anchor document.open-safe for the NORMAL (non-reopening)
    // creative. (The full document.open re-injection shim — for creatives
    // that reopen themselves — is separate, deferred.)
    //
    // Per proposal § Renderer implementation contract item 7, the :rendered
    // reply MUST wait for the creative SDK (loaded as a <script> inside
    // creativeHtml) to register its own message listener before the
    // container sends the bootstrap port handshake. `window 'load'` is
    // strictly later than DOMContentLoaded, so this guarantee is preserved.
    var renderedPosted = false;
    function onCreativeRendered() {
      if (renderedPosted) return;
      renderedPosted = true;
      // ─── Operator hook: onAfterRender ──────────────────────────────
      // Fires AFTER the inner document's `window 'load'` (the render anchor),
      // BEFORE the :rendered postMessage to parent. Operators may run
      // post-render initialization here. Must be synchronous — async work
      // would race the container's :rendered timeout (RENDERER_TIMEOUT 2114).
      // For async work, defer it via Promise.resolve().then(...) so it runs
      // after :rendered is acknowledged.
      try {
        window.__sharcRenderer.onAfterRender(data);
      } catch (hookErr) {
        window.__sharcRenderer.customSecurityLog(
          'onAfterRender hook threw — proceeding with :rendered reply: '
            + (hookErr && hookErr.message ? String(hookErr.message) : 'unknown'),
          { severity: 'warn', reason: 'on_after_render_hook_threw' });
      }
      postRendered(placementSessionId, containerOrigin);
    }

    // §5.4 backup for the "load already fired" case. The render anchor is the
    // inner `window 'load'`, caught by the listener registered after
    // document.close(). But document.write/close on an already-loaded renderer
    // document can fire (and finish) the rewritten document's `load` BEFORE that
    // post-close registration runs — so the listener misses it (the document is
    // already readyState 'complete' with no future load coming). We detect that
    // case and fire onCreativeRendered ourselves on a macrotask.
    //
    // The discriminator vs a still-loading heavy creative (whose real `load`
    // is genuinely pending — e.g. slow subresources appended during parse) is
    // SUBRESOURCE COMPLETENESS, not readyState (close() can flip readyState to
    // 'complete' while subresources are still in flight). If every subresource
    // is complete on the macrotask, `load` has already fired and will not fire
    // again ⇒ fire the backup. If any is still pending, the registered listener
    // will catch the real `load` ⇒ do NOT fire here.
    function allSubresourcesComplete() {
      var imgs = document.images;
      for (var i = 0; i < imgs.length; i++) {
        if (!imgs[i].complete) return false;
      }
      return true;
    }
    function scheduleLoadBackupIfAlreadyLoaded() {
      if (document.readyState !== 'complete') return;
      setTimeout(function () {
        if (renderedPosted) return;
        if (document.readyState === 'complete' && allSubresourcesComplete()) {
          onCreativeRendered();
        }
      }, 0);
    }

    // ─── Document replacement ──────────────────────────────────────────
    // document.open() / document.write(html) / document.close() replaces
    // the document while keeping iframe.contentWindow intact. The
    // creative SDK loaded as a <script> inside `html` will run with
    // `window` === this iframe's contentWindow — same window the
    // container uses for the post-:rendered MessageChannel handshake.
    //
    // Two paths:
    //   - Default (document.write): try/catch around the synchronous
    //     write. On success, the `window 'load'` listener registered after
    //     document.close() (below) fires onCreativeRendered, posting
    //     :rendered.
    //   - Fallback (DOMParser + replaceChildren, L1201): triggered by
    //     RENDERER_CONFIG.FORCE_DOMPARSER_FALLBACK=true (operator opt-in
    //     for testing) OR by document.write throwing at runtime (L1202).
    //     replaceChildren does NOT trigger a fresh document load, so
    //     after the fallback completes successfully we schedule
    //     onCreativeRendered via Promise.resolve().then(...) so the existing
    //     post-render flow runs.
    var usedFallback = false;

    if (RENDERER_CONFIG.FORCE_DOMPARSER_FALLBACK) {
      // Operator-forced fallback path. Used by forks to verify the
      // fallback works in their browser fleet without simulating a
      // document.write failure. Per L1201 contract, this code path is
      // tested and verified to preserve script execution semantics.
      try {
        tryDomParserReplaceChildren(html);
        usedFallback = true;
      } catch (forcedErr) {
        // Forced path failed — surface the failure rather than silently
        // falling back to document.write (the operator opted-in to test
        // this path; mask-and-recover would defeat the test).
        //
        // Defense-in-depth: the postMessage carries a fixed reason code
        // only. Error details (which can leak file paths, stack traces,
        // framework internals) are routed through `customSecurityLog` for
        // operator-side telemetry, NOT into the cross-frame payload.
        window.__sharcRenderer.customSecurityLog(
          'DOMParser forced fallback failed (FORCE_DOMPARSER_FALLBACK=true)',
          {
            severity: 'error',
            reason: 'dom_parser_fallback_forced_failed',
            cause: forcedErr && forcedErr.message ? String(forcedErr.message) : 'unknown'
          });
        postFailed('dom_parser_fallback_forced_failed',
          placementSessionId, containerOrigin);
        return;
      }
    } else {
      // Default path: document.write inside try/catch. Attempt the
      // DOMParser fallback (L1201) on failure BEFORE giving up — L1202
      // runtime detection.
      try {
        document.open();
        document.write(html);
        document.close();
        // Register the render anchor AFTER document.close() (§5.4): a
        // `window 'load'` listener registered before document.open() would be
        // wiped by the reopen. Post-close registration survives for the
        // normal (non-reopening) creative and catches a still-pending `load`
        // (e.g. the heavy-subresource creative). `scheduleLoadBackupIfAlready
        // Loaded()` then covers the complementary case where the rewritten
        // document's `load` already fired before this registration ran — see
        // its definition for the subresource-completeness discriminator that
        // keeps it from firing prematurely on a still-loading creative.
        window.addEventListener('load', onCreativeRendered, false);
        scheduleLoadBackupIfAlreadyLoaded();
      } catch (writeErr) {
        // document.write can throw under strict CSP (require-trusted-types-for
        // 'script') or in some sandboxed environments. Operators must NOT
        // enable trusted types on the renderer's response CSP — proposal
        // § WebView Compatibility line 567 documents this constraint.
        //
        // L1202 runtime fallback: try the DOMParser + replaceChildren
        // path before failing. Insurance against future browser
        // restrictions on document.write for cross-origin iframes.
        window.__sharcRenderer.customSecurityLog(
          'document.write failed; attempting DOMParser fallback path (L1202)',
          {
            severity: 'warn',
            reason: 'document_write_failed_attempting_fallback',
            cause: writeErr && writeErr.message ? String(writeErr.message) : 'unknown'
          });
        try {
          tryDomParserReplaceChildren(html);
          usedFallback = true;
        } catch (fallbackErr) {
          // Both paths failed; surface to container.
          //
          // Defense-in-depth: the postMessage carries a fixed reason code
          // only. Error details (which can leak file paths, stack traces,
          // framework internals) are routed through `customSecurityLog`
          // for operator-side telemetry, NOT into the cross-frame payload.
          window.__sharcRenderer.customSecurityLog(
            'document.write AND DOMParser fallback both failed',
            {
              severity: 'error',
              reason: 'document_write_and_fallback_failed',
              writeErrCause: writeErr && writeErr.message ? String(writeErr.message) : 'unknown',
              fallbackErrCause: fallbackErr && fallbackErr.message ? String(fallbackErr.message) : 'unknown'
            });
          postFailed('document_write_and_fallback_failed',
            placementSessionId, containerOrigin);
          return;
        }
      }
    }

    // ─── Post-fallback render-anchor scheduling ────────────────────────
    // The default document.write+close path registers the `window 'load'`
    // anchor inline (above). The DOMParser+replaceChildren fallback does
    // NOT trigger a fresh document load — replaceChildren is a structural
    // mutation on the same live document, not a parse of a new document, so
    // no `load` event fires. Schedule onCreativeRendered on the next
    // microtask so the post-render flow (onAfterRender hook + :rendered
    // postMessage) still runs.
    if (usedFallback) {
      Promise.resolve().then(onCreativeRendered);
    }

    // ─── Arm the document.open re-injection shim (ADR §1) ──────────────
    // The renderer's own initial document.open()/write()/close() above ran
    // through the shim in PASS-THROUGH mode (__shimArmed false) — the harness
    // was already in the markup the renderer composed, so re-injecting there
    // would be wrong. Arm NOW: every SUBSEQUENT creative-initiated reopen runs
    // through the armed shim and re-injects the captured harness preludes
    // before the creative's buffered markup. The DOMParser fallback path does
    // not call document.write, but arming is harmless there — the shim only
    // ever fires on a real creative document.open()/write()/close().
    __shimArmed = true;

    // ADR 2026-06-15: the renderer's OWN initial document.open()/write()/close()
    // above WIPED every window 'message' listener — including the IIFE's
    // gen-0 bootstrap capture (registered at IIFE eval, before this write). The
    // container's port handshake is sent AFTER this :rendered, so without
    // re-registering, the IIFE would never CAPTURE `port2` and the load-probe
    // answerer would be dead for a non-reopening creative (false 2118 on any
    // post-render iframe load, e.g. an embedded subframe completing). Re-register
    // here so the surviving IIFE closure catches the handshake. (The reopen path
    // re-registers in flushReinjectedRewrite for the same reason.)
    __sharcRegisterBootstrapCapture();
  }

  window.addEventListener('message', onRenderMessage, false);

  // Dev-mode banner so an operator who navigates to the renderer URL
  // directly (no parent frame, no :render message) sees something other
  // than a blank page. Fires only when there's no parent (top-level
  // navigation) — embedded in an iframe, the banner is harmless but
  // about to be replaced by the creative.
  //
  // Built via createElement + textContent rather than innerHTML. The
  // string is currently static so safe today, but innerHTML invites
  // future XSS if a contributor interpolates location.hash / .search /
  // .origin into it. Defense-in-depth: never reach for innerHTML on a
  // page that runs creative code.
  if (RENDERER_CONFIG.TEST_ONLY && window.parent === window) {
    document.body.innerHTML = ''; // clear any existing content
    var div = document.createElement('div');
    div.className = 'sharc-renderer-fallback';
    var strong = document.createElement('strong');
    strong.textContent = 'SHARC Reference Renderer';
    div.appendChild(strong);
    div.appendChild(document.createTextNode(
      ' — this page is the Creative Markup variant renderer. '
      + 'It is meant to be loaded as a cross-origin iframe by '
      + 'SHARCContainer, not navigated to directly. Test/dev only.'
    ));
    document.body.appendChild(div);
  }
}());
</script>
</body>
</html>
