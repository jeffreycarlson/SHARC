<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHARC Reference Renderer (test/dev only)</title>
<!--
  SHARC Reference Renderer — IAB Tech Lab Creative Sources (issue #41)

  Canonical implementation operators fork to host the Creative Markup
  renderer protocol. Loaded as a cross-origin iframe by SHARCContainer
  when the operator passes `creativeRendererUrl: <this URL>` and
  `creativeHtml: <markup>` to the constructor.

  Trust model — what this page is responsible for:

    1. Reading the CSPRNG nonce from `location.hash` (key=`sharcNonce`).
       The container appends the nonce as a fragment when it constructs
       `iframe.src`. Defeats neighbor-frame forgery: any frame on the
       page can postMessage to this window, but only the container that
       sourced the iframe knows the nonce.

    2. Validating the inbound `SHARC:Renderer:render` envelope:
         - event.source === window.parent
         - event.origin === event.data.containerOrigin
         - event.data.sharcNonce === <fragment nonce>
         - version compatibility

    3. Service Worker detection at startup. A SW on the renderer origin
       can intercept iframe loads and substitute the renderer HTML
       transparently — defeating the fragment-nonce defense entirely.
       Per spec § Renderer implementation contract operational
       constraints, a SW on `navigator.serviceWorker.controller` is a
       hard fail (post `:failed` with `reason: 'service_worker_detected'`
       and refuse to render).

    4. Stripping `<meta http-equiv="refresh">` from the creativeHtml
       before `document.write` — meta refresh would redirect the
       renderer iframe outside any JS interception path. The strip is
       DOMParser-based (entity-encoding-safe — a regex on the literal
       token `refresh` would let `&#114;efresh` slip through, since
       the HTML parser decodes entities before pragma-matching). The
       container-side load-event backstop is still the load-bearing
       defense for post-load DOM-injected refreshes the strip cannot
       see at parse time. (Renderer-side only; the SDK in Creative
       URL cannot strip post-load — relies on the same backstop.)

    4a. Clearing the nonce from `location.hash` (`history.replaceState`)
        AFTER envelope validation accepts and BEFORE `document.write`.
        The nonce is single-use per iframe load, so this is defense-in-
        depth — the creative HTML cannot read the consumed nonce out of
        the URL fragment.

    4b. Installing `sharc-navigation-bridge` (Phase D round-4) BEFORE
        `document.write(creativeHtml)` so its capture-phase click /
        submit / window.open interceptors apply to all creative code, with
        best-effort location.* interception where the browser permits it.
        Chromium exposes Location as non-configurable, so location.* is
        enforced by the container load-event backstop there. The bridge
        module is imported as ES module from
        `../../dist/sharc-navigation-bridge.mjs`; the `__sharcNavBridge
        AutoInstall` flag is set true so the module's auto-install fires
        if the SHARC SDK happens to be loaded by the time it evaluates
        (it usually isn't — the SDK is inside creativeHtml). We ALSO
        call `installNavigationBridge(window)` explicitly from the
        accept-render path, which works regardless of SDK availability:
        the interceptors are installed on `window`/`document` (capture-
        phase listeners persist across `document.open() / write()` because
        the document object identity is preserved), and `requestNavigation`
        is looked up at click time — by then the SDK is loaded inside the
        creative document. Operators forking this renderer get the bridge
        wired by default — the bridge module itself stays opt-in (auto-
        install flag default-off) for non-renderer hosts.

    4c. Loading compatibility bridge modules from `data.bridges` (0.7.1,
        issue #82) BEFORE `document.write(creativeHtml)` so the creative
        HTML's first synchronous script sees `window.mraid` / `window.$sf`
        already installed. The container tells the renderer which bridges
        to load via the new `bridges` field on `:render` (string array
        of identifiers). The renderer filters against its own
        `KNOWN_BRIDGES` allowlist — unknown identifiers are silently
        skipped (forward-compat for future containers shipping new
        identifiers to older renderers). Each known identifier is
        resolved through `RENDERER_CONFIG.BRIDGE_URL_TEMPLATE`,
        same-origin-asserted, and dynamic-imported via `import()`. Per
        Security Engineer guardrails, container does NOT supply URLs
        (security boundary — collapsed by a cross-origin URL); the
        same-origin check inside `loadBridgeModule` is the load-bearing
        JS-level defense and `script-src 'self'` on the renderer's
        response CSP is the browser-level defense.

    5. Writing the creative HTML into the document via
       `document.open() / document.write(html) / document.close()`.
       Replaces the renderer document while preserving
       `iframe.contentWindow` so the subsequent SHARC port handshake
       reaches the creative SDK running in the renderer's window.

       Document installation:
         - Default: `document.write(html)` inside try/catch.
         - Fallback (L1201): on `document.write` failure OR
           `RENDERER_CONFIG.FORCE_DOMPARSER_FALLBACK = true`, re-installs
           via `DOMParser` + `replaceChildren` (preserves script execution
           by re-creating `<script>` elements in the live document so the
           browser runs them on insertion). Insurance against future
           browser restrictions on `document.write` for cross-origin
           iframes — operators flip the FORCE flag in their fork to
           verify the fallback works in their browser fleet without
           needing to simulate a `document.write` failure (L1202).

    6. Posting `SHARC:Renderer:rendered` to `window.parent` after the inner
       document's `window 'load'` fires (full subresource load), including the
       renderer's actual `window.location.origin` (post-redirect
       canonical) so the container can detect the cross-origin sandbox
       collapse threat.

  Trust model — what operators forking this page MUST also do:

    A. Serve this page with `Content-Security-Policy: object-src 'none';
       base-uri 'none'` — the iframe `csp` attribute is Chromium-only
       and unlikely to become portable. HTTP-response CSP is the
       portable enforcement layer.

    B. Serve this page with `Cross-Origin-Resource-Policy: same-origin`.

    C. Choose a storage-isolation strategy (Strategy A / B / C per
       proposal § Renderer implementation contract). Strategy A
       (`Clear-Site-Data: "storage"`) is the recommended baseline.

    D. NOT register a Service Worker on this origin. The runtime check
       below catches accidents but is not a substitute for not
       registering one.

  See: docs/proposals/creative-sources.md § Renderer implementation
       contract (lines 391–465 of the proposal at time of writing).

  TEST_ONLY: this reference page is for development and evaluation. Per
  proposal-related ticket #55 (GitHub Pages reference renderer), the
  hosted instance at <owner>.github.io/<repo>/renderer/ adds a
  production-block guard. Operators MUST fork this file and serve from
  their own origin (any path, any hostname) for any non-development
  deployment.

  NOTE: This file MUST be served via HTTP(S) — the navigation-bridge
  `<script type="module">` import below does not resolve from `file://`
  origins (browsers refuse module imports outside http/https schemes).
  Use the included dev server (`node server.cjs` serves at
  http://localhost:8766/examples/renderer/index.html) for local
  development. Operators forking the renderer must serve their fork
  from an HTTP(S) origin too.

  Operator extension surface (0.7.0):
    - RENDERER_CONFIG: named-constants block at top of inline script;
      fork-friendly operator config without source-code archaeology.
    - window.__sharcRenderer.{onBeforeRender, onAfterRender,
      customSecurityLog, beforeStorageClear}: lifecycle hooks operators
      override to inject custom behavior. See per-hook JSDoc.
-->
<style>
  /*
   * Pre-render placeholder. Becomes irrelevant the moment document.open()
   * runs — the inner creative HTML's <style> takes over. Kept minimal so
   * the unfilled fallback (when validation fails before document.write)
   * shows the operator-facing dev banner instead of a blank frame.
   */
  :root { color-scheme: light dark; }
  html, body { margin: 0; padding: 0; background: transparent; }
  .sharc-renderer-fallback {
    font: 12px/1.4 system-ui, -apple-system, Segoe UI, sans-serif;
    color: #444;
    padding: 12px;
    background: #fffbe6;
    border: 1px solid #f6e6a8;
  }
  .sharc-renderer-fallback strong { color: #b95000; }
</style>
</head>
<body>
<noscript>
  <div class="sharc-renderer-fallback">
    <strong>SHARC Reference Renderer</strong> — JavaScript is required.
    The renderer protocol depends on postMessage and document.write.
  </div>
</noscript>
<!--
  Navigation bridge wiring (Phase D round-4 — OpenClaw HIGH-1).

  The reference renderer is the canonical example operators fork to host
  the Creative Markup variant. To match the proposal AC at
  `docs/proposals/creative-sources.md` lines 1105–1106 ("Reference
  renderer imports `sharc-navigation-bridge` and installs it before
  `document.write(creativeHtml)`"), the bridge is loaded here as an ES
  module and stashed on `window.__sharcRenderer.installNavigationBridge`
  for the inline render-protocol script to call from `acceptAndRender`.

  We ALSO set `window.__sharcNavBridgeAutoInstall = true` BEFORE the
  module loads — this enables the bridge's built-in auto-install path
  when the SHARC SDK happens to be on `window` at module-evaluation time.
  In the typical Creative Markup flow the SDK is INSIDE creativeHtml, so
  the auto-install will not fire from this site — the inline script's
  explicit `installNavigationBridge(window)` call from `acceptAndRender`
  is what actually installs the interceptors. Both paths are safe because
  the bridge's own `__sharcNavBridgeInstalled` flag enforces idempotency.

  The bridge module itself stays opt-in by default at the module level
  (so non-renderer hosts that import the module don't get surprise
  installs); the reference renderer is the canonical example that turns
  it ON. Operator forks SHOULD preserve this wiring.

  Module-resolution: relative path `../../dist/sharc-navigation-bridge.mjs`
  resolves from `examples/renderer/index.html`. `server.cjs` was updated
  in the same Phase D round-4 patch to serve `.mjs` with
  `Content-Type: application/javascript` (was previously falling through
  to `application/octet-stream`, which browsers refuse for module imports).
-->
<script>window.__sharcNavBridgeAutoInstall = true;</script>
<script type="module">
  import { installNavigationBridge, SHARCNavigationError }
    from '../../dist/sharc-navigation-bridge.mjs';
  window.__sharcRenderer = window.__sharcRenderer || {};
  window.__sharcRenderer.installNavigationBridge = installNavigationBridge;
  window.__sharcRenderer.SHARCNavigationError = SHARCNavigationError;
  // Race-tolerance design (no polling, no flag).
  //
  // The inline script's `acceptAndRender` checks for the function presence
  // (`typeof renderer.installNavigationBridge === 'function'`) before
  // calling it — that check is functionally equivalent to a "module ready"
  // poll, with no waiting required. If the module hasn't loaded by the time
  // the container posts `:render` (rare; module fetch + evaluate is
  // microtask-fast even on slow CDNs), the inline script logs a warning
  // and proceeds without the bridge. The container-side load-event backstop
  // (`RENDERER_UNAUTHORIZED_NAVIGATION` 2118) is the load-bearing fallback
  // — adversarial creatives that bypass the bridge are caught at the next
  // iframe `load` event regardless. (Round-5 Reality Checker D2 fix —
  // a prior `bridgeReady = true` flag claimed to be polled but never was.)
</script>
<script>
(function () {
  'use strict';

  // ═════════════════════════════════════════════════════════════════════
  // ADR 2026-06-15 — port-possession load-probe authenticator (the crux).
  //
  // Captured NATIVES, at gen-0 IIFE evaluation, BEFORE any creative code can
  // run (the creative SDK + creative markup are document.write-injected later).
  // The load-probe answerer MUST use these `.call(port, …)` forms so a hostile
  // creative that clobbers `MessagePort.prototype.postMessage` / installs an
  // `onmessage` setter-trap / traps `addEventListener` CANNOT suppress the
  // legit answer (probe (d): a naive `port.postMessage` answer is DoS-able →
  // false 2118). § Ratified SE conditions, condition 2.
  // ═════════════════════════════════════════════════════════════════════
  var __NATIVE_PORT_POST = (typeof MessagePort !== 'undefined')
    ? MessagePort.prototype.postMessage : null;
  var __NATIVE_PORT_START = (typeof MessagePort !== 'undefined')
    ? MessagePort.prototype.start : null;
  var __NATIVE_AEL = (typeof EventTarget !== 'undefined')
    ? EventTarget.prototype.addEventListener : null;

  // The single `port2` the container transfers at gen-0. Held in THIS closure
  // so it SURVIVES every `document.open` self-rewrite (verified: a MessagePort
  // captured in a closure survives the realm-preserving reopen). It is the
  // load-probe answerer's port AND the port the reopened SDK acquires in-realm
  // (no re-transfer). Never placed on an enumerable global — opaque to hostile
  // creative code sharing the realm (probe (c)).
  var __sharcRendererPort = null;
  // Guards against binding the answerer twice on the same port.
  var __sharcProbeAnswererBound = false;

  // The captured-native load-probe answerer. Echoes the container's per-cycle
  // `probeId` back over `port2` as `:loadAck`. The container authenticates by
  // ARRIVAL on `port1` (possession) + the strict probeId/temporal gate; this
  // side carries no secret. Wrapped so a hostile setter/AEL trap that somehow
  // fires cannot abort the answer.
  function __sharcAnswerProbe(event) {
    var data = event && event.data;
    if (!data || typeof data !== 'object') return;
    if (data.type !== 'SHARC:Container:loadProbe') return;
    if (!__sharcRendererPort || !__NATIVE_PORT_POST) return;
    try {
      __NATIVE_PORT_POST.call(__sharcRendererPort, {
        type: 'SHARC:Creative:loadAck',
        probeId: data.probeId,
      });
    } catch (_) { /* answer must never throw */ }
  }

  // Bind (or re-bind after a reopen) the probe answerer on the surviving port
  // using captured natives, inside try/catch so a hostile `addEventListener` /
  // `MessagePort.prototype.start` trap cannot abort the (re)anchor or suppress
  // the :rendered re-fire (§ condition 2). Idempotent within a generation.
  function __sharcBindProbeAnswerer() {
    if (!__sharcRendererPort) return;
    try {
      if (__NATIVE_AEL) {
        __NATIVE_AEL.call(__sharcRendererPort, 'message', __sharcAnswerProbe, false);
      } else {
        __sharcRendererPort.addEventListener('message', __sharcAnswerProbe, false);
      }
      if (__NATIVE_PORT_START) {
        __NATIVE_PORT_START.call(__sharcRendererPort);
      } else if (typeof __sharcRendererPort.start === 'function') {
        __sharcRendererPort.start();
      }
      __sharcProbeAnswererBound = true;
    } catch (_) { /* a trap must not abort the reanchor */ }
  }

  // Push the SURVIVING port to the (re-armed) creative SDK IN-REALM — no
  // re-transfer (which would neuter THIS closure's copy and kill the answerer).
  // Called at gen-0 once the SDK has booted, and after every reopen once the
  // re-injected SDK re-arms. The SDK's `window.SHARC.__attachRendererPort` is
  // the genuine in-realm seam (the SDK booted from renderer-provisioned dist).
  function __sharcShareePortWithSDK() {
    if (!__sharcRendererPort) return;
    try {
      var S = window.SHARC;
      if (S && typeof S.__attachRendererPort === 'function') {
        S.__attachRendererPort(__sharcRendererPort);
      }
    } catch (_) { /* SDK may not be present yet; retried after reopen */ }
  }

  // gen-0 bootstrap capture: the container transfers `port2` to this window via
  // `SHARC:Container:handshake`. The renderer IIFE catches the SAME event the
  // SDK's bootstrap listener catches (both read the same live `event.ports[0]`
  // reference — structured-clone transfer delivers ONE port object; both
  // listeners share it). We capture it for the answerer and, after the SDK
  // boots, also push it via the in-realm seam so reopens re-acquire it without
  // a re-transfer.
  function __sharcOnBootstrap(event) {
    if (!event || event.source !== window.parent) return;
    var data = event.data;
    if (!data || typeof data !== 'object'
      || data.type !== 'SHARC:Container:handshake') return;
    if (!event.ports || !event.ports[0]) return;
    if (__sharcRendererPort) return; // first transfer wins; reopens reuse it
    __sharcRendererPort = event.ports[0];
    __sharcBindProbeAnswerer();
    __sharcShareePortWithSDK();
  }

  // Register (or RE-register after a document.open reopen wipes window
  // listeners) the IIFE's bootstrap capture. A passive creative can self-
  // rewrite BEFORE the container ever sends the handshake (the first :rendered
  // the container sees is the reopened generation's), so the handshake arrives
  // in a generation whose gen-0 listener was already wiped. The reopen path
  // (`flushReinjectedRewrite`) re-calls this so the surviving IIFE closure can
  // still CAPTURE `port2` in the post-reopen generation. Once captured, the
  // handler early-returns — the port survives subsequent reopens in closure.
  function __sharcRegisterBootstrapCapture() {
    try {
      if (__NATIVE_AEL) {
        __NATIVE_AEL.call(window, 'message', __sharcOnBootstrap, true);
      } else {
        window.addEventListener('message', __sharcOnBootstrap, true);
      }
    } catch (_) { /* defensive */ }
  }
  __sharcRegisterBootstrapCapture();

  // ─────────────────────────────────────────────────────────────────────
  // 0. RENDERER_CONFIG — operator-tunable values.
  //
  //    Edit values here to customize behavior; do NOT edit usage sites
  //    elsewhere in the script — those are designed to consume
  //    RENDERER_CONFIG.
  //
  //    Operator-fork checklist:
  //      - TEST_ONLY: set to false in production deployments to suppress
  //        the dev-banner fallback when the page is loaded outside an
  //        iframe. The hosted instance at <owner>.github.io/<repo>/
  //        renderer/ keeps it true and the container-side guard refuses
  //        to load it from non-dev origins (issue #55).
  //      - RENDERER_PROTOCOL_VERSION: the version this renderer reports
  //        it speaks. Must match the version your container pins.
  //        SHARC 0.7.0 ships protocol version '1'.
  //      - ALLOWED_PROTOCOL_VERSIONS: array of accepted inbound versions.
  //        Forks may widen this during a deployment cutover (renderer-
  //        first migration). Default = [RENDERER_PROTOCOL_VERSION].
  //      - FORCE_DOMPARSER_FALLBACK: force the DOMParser + replaceChildren
  //        fallback path even when document.write would succeed. Useful
  //        for testing the fallback in real browsers without needing to
  //        simulate document.write failures. Default: false (use
  //        document.write; fall back on error per L1202).
  //      - BRIDGE_URL_TEMPLATE (0.7.1, issue #82): URL template the
  //        renderer uses to resolve the bridge module file for each
  //        identifier in `data.bridges`. The literal `{name}` token is
  //        replaced with the bridge identifier (e.g. 'mraid' →
  //        '../../dist/sharc-mraid-bridge.mjs'). Default convention:
  //        renderer-relative path under `dist/`, matching the existing
  //        navigation-bridge wiring above. Forks that bundle differently
  //        override this. SECURITY: the resolved URL MUST be same-origin
  //        with the renderer; the loader rejects cross-origin URLs after
  //        substitution. The container does NOT supply URLs — that
  //        attack surface stays closed (a compromised publisher script
  //        cannot point bridge loads at attacker-controlled code).
  //
  //    Operator-fork SECURITY checklist (NEW for 0.7.1):
  //      - Serve this page with `Content-Security-Policy: script-src 'self'`
  //        as belt-and-suspenders against cross-origin BRIDGE_URL_TEMPLATE
  //        misconfiguration. The same-origin assertion below is the
  //        load-bearing JS-level defense; CSP is the browser-level one.
  //      - DO NOT embed the bridge URL template into the published
  //        creative payload. The bridge URL set is renderer-controlled and
  //        operator-supplied at fork time, not a per-render value.
  // ─────────────────────────────────────────────────────────────────────
  var RENDERER_CONFIG = {
    TEST_ONLY: true,
    RENDERER_PROTOCOL_VERSION: '1',
    ALLOWED_PROTOCOL_VERSIONS: ['1'],
    FORCE_DOMPARSER_FALLBACK: false,
    // 0.7.1 (issue #82): renderer-relative bridge URL convention.
    // {name} is substituted with the bridge identifier; result is the
    // ES module URL imported via dynamic `import()`.
    BRIDGE_URL_TEMPLATE: '../../dist/sharc-{name}-bridge.mjs',
    // 0.7.8 (§ 4.3 mechanism i): renderer-relative OMID shim URL. Unlike
    // compatibility bridges (dynamically `import()`ed), the OMID shim is
    // FETCHED as source text so the renderer can source-rewrite the OMID
    // `protocolNonce` into it as a closure constant before `document.write`.
    // The IIFE build (.js, not .mjs) self-attaches `window.SHARC.installOmidShim`.
    // SECURITY: same-origin enforced before fetch (same model as
    // BRIDGE_URL_TEMPLATE). The nonce is captured into the prelude's closure
    // and the prelude <script> then self-removes (#254), so the nonce is not
    // persistently DOM-readable by creative code (closure-variable
    // unreachability AND source-text unreachability — the two are distinct).
    OMID_SHIM_URL: '../../dist/sharc-omid-shim.js',
    // 0.7.10 (#321 Decision 3): renderer-provisioned MRAID compatibility
    // wrapper. These are IIFE builds fetched same-origin and prepended before
    // creative markup so a raw MRAID ad that ships no SHARC SDK still gets:
    // sharc-protocol -> sharc-creative -> sharc-mraid-bridge before its first
    // script executes. No new bundle artifact; this composes existing dist.
    MRAID_WRAPPER_PROTOCOL_URL: '../../dist/sharc-protocol.js',
    MRAID_WRAPPER_CREATIVE_URL: '../../dist/sharc-creative.js',
    MRAID_WRAPPER_BRIDGE_URL: '../../dist/sharc-mraid-bridge.js',
    // 0.7.10 (#339): renderer-provisioned SafeFrame compatibility wrapper —
    // the SafeFrame analogue of the MRAID wrapper above. Same composition,
    // same security model: IIFE builds fetched same-origin and prepended
    // before creative markup so a raw SafeFrame ad that ships no SHARC SDK
    // still gets sharc-protocol -> sharc-creative -> sharc-safeframe-bridge
    // before its first script executes, establishing a SHARC session so the
    // bridge's lifecycle subscriptions (and R1's container->creative state
    // push) reach window.$sf.ext. No new bundle artifact; composes existing dist.
    SAFEFRAME_WRAPPER_PROTOCOL_URL: '../../dist/sharc-protocol.js',
    SAFEFRAME_WRAPPER_CREATIVE_URL: '../../dist/sharc-creative.js',
    SAFEFRAME_WRAPPER_BRIDGE_URL: '../../dist/sharc-safeframe-bridge.js'
  };
  // TEST_ONLY harness knob: lets Puppeteer exercise fork-time renderer config
  // mistakes without carrying a second renderer fixture. Production forks
  // should leave this absent; it is ignored unless the query param is present.
  try {
    var testBridgeTemplate = new URLSearchParams(window.location.search)
      .get('sharcTestBridgeUrlTemplate');
    if (RENDERER_CONFIG.TEST_ONLY && testBridgeTemplate != null) {
      RENDERER_CONFIG.BRIDGE_URL_TEMPLATE = testBridgeTemplate;
    }
    // 0.7.8: matching TEST_ONLY knob for the OMID shim URL so the test harness
    // can point at the built dist without a second renderer fixture.
    var testOmidShimUrl = new URLSearchParams(window.location.search)
      .get('sharcTestOmidShimUrl');
    if (RENDERER_CONFIG.TEST_ONLY && testOmidShimUrl != null) {
      RENDERER_CONFIG.OMID_SHIM_URL = testOmidShimUrl;
    }
    // 0.7.10 (#339): matching TEST_ONLY knob for the SafeFrame wrapper's first
    // component URL so the harness can exercise the wrapper provisioning
    // failure path (the SafeFrame analogue of sharcTestBridgeUrlTemplate, now
    // that SafeFrame is wrapper-provisioned rather than dynamic-imported).
    var testSafeFrameWrapperProtocolUrl = new URLSearchParams(window.location.search)
      .get('sharcTestSafeFrameWrapperProtocolUrl');
    if (RENDERER_CONFIG.TEST_ONLY && testSafeFrameWrapperProtocolUrl != null) {
      RENDERER_CONFIG.SAFEFRAME_WRAPPER_PROTOCOL_URL = testSafeFrameWrapperProtocolUrl;
    }
    // #328: matching TEST_ONLY knob for the MRAID wrapper's first
    // component URL so the harness can exercise the wrapper provisioning
    // failure path (the MRAID analogue of sharcTestSafeFrameWrapperProtocolUrl).
    var testMraidWrapperProtocolUrl = new URLSearchParams(window.location.search)
      .get('sharcTestMraidWrapperProtocolUrl');
    if (RENDERER_CONFIG.TEST_ONLY && testMraidWrapperProtocolUrl != null) {
      RENDERER_CONFIG.MRAID_WRAPPER_PROTOCOL_URL = testMraidWrapperProtocolUrl;
    }
  } catch (_) { /* keep default config */ }
  // SECURITY: freeze the config post-construction. Closes the
  // post-load-mutation surface — once set at fork time, the bridge URL
  // template (and the protocol-version allowlist, etc.) cannot be
  // mutated by code that runs later in the page lifecycle. Same-origin
  // assertion in `loadBridgeModule` is the load-bearing defense; this
  // is defense-in-depth (SE guardrail #3 per design doc § 4).
  Object.freeze(RENDERER_CONFIG);
  Object.freeze(RENDERER_CONFIG.ALLOWED_PROTOCOL_VERSIONS);

  // ─────────────────────────────────────────────────────────────────────
  // 0b. Bridge identifier allowlist — 0.7.1 (issue #82).
  //
  //    The renderer holds the truth on which bridge modules it knows how
  //    to load. Container-side detection may evolve faster than renderer
  //    deployments (e.g. a future container ships `bridges: ['omid']` to
  //    a 0.7.1 renderer that doesn't yet know about OMID). Unknown
  //    identifiers are silently skipped via `customSecurityLog` rather
  //    than failing the render — the protocol's forward-compat guarantee
  //    is "tolerate unknown bridges" (see design doc § 2 validation
  //    rule).
  //
  //    Allowlist enforcement is the ONLY path to dynamic `import()`. A
  //    container that hands the renderer an unrecognized identifier
  //    cannot bypass this filter — there is no other call site for
  //    bridge import (SE guardrail #1 per design doc § 4).
  //
  //    0.7.1: 'mraid', 'safeframe' only. 'omid' lands in 0.7.2 as a
  //    separate scope; the renderer in that release will widen this
  //    array. Operator forks generally do NOT customize this — adding
  //    an unknown identifier here without also adding the bridge module
  //    will fail the import path.
  // ─────────────────────────────────────────────────────────────────────
  var KNOWN_BRIDGES = Object.freeze(['mraid', 'safeframe']);

      var metas = doc.querySelectorAll('meta[http-equiv]');

        var meta = metas[i];
        var httpEquiv = (meta.getAttribute('http-equiv') || '').trim().toLowerCase();
        if (httpEquiv === 'refresh' && meta.parentNode) {
          meta.parentNode.removeChild(meta);
        }
      }
      return doc.documentElement.outerHTML;
    } catch (_) {
      // DOMParser unavailable (very old environments) — return input as-is.
      // Container-side load-event backstop still catches a fired refresh.
      return html;
    }
  }

  function jsonForInlineScript(value) {
    return JSON.stringify(String(value)).replace(/</g, '\\u003c');
  }

  function installLoadProbePrelude(html, placementSessionId, containerOrigin, ackNonce) {
    // 0.7.7 SEC-H1: the inbound `:loadProbe` carries no sharcNonce on the wire.
    // The closure variable `nonce` below holds the derived renderer-protocol
    // nonce (read from location.hash at script start, before document.write).
    // A hostile creative that installs its own message listener and observes
    // the inbound envelope finds no nonce field there — derived-nonce
    // confidentiality (§ 6 / RTR-D3) is preserved.
    var code = ''
      + '(function(){'
      + 'var placementSessionId=' + jsonForInlineScript(placementSessionId) + ';'
      + 'var containerOrigin=' + jsonForInlineScript(containerOrigin) + ';'
      + 'var ackNonce=' + jsonForInlineScript(ackNonce) + ';'
      + 'window.addEventListener("message",function(event){'
      + 'if(!event||event.source!==window.parent)return;'
      + 'if(event.origin!==containerOrigin)return;'
      + 'var probe=event.data;'
      + 'if(!probe||typeof probe!=="object")return;'
      + 'if(probe.type!=="SHARC:Renderer:loadProbe")return;'
      + 'if(probe.placementSessionId!==placementSessionId)return;'
      + 'try{window.parent.postMessage({'
      + 'type:"SHARC:Renderer:loadAck",'
      + 'placementSessionId:placementSessionId,'
      + 'sharcNonce:ackNonce,'
      + 'rendererOrigin:window.location.origin'
      + '},containerOrigin);}catch(_){}'
      + '},false);'
      // SECURITY (#254): after the nonce is captured into closure above, the
      // prelude self-removes its own <script> element as its FINAL synchronous
      // statement. The closure holding `ackNonce` survives the element's
      // removal, so the loadAck handshake keeps working — but the source TEXT
      // (which contains the nonce literal) is no longer in document.scripts for
      // creative code to harvest via .textContent/.outerHTML. document.write-
      // injected scripts have a null document.currentScript in many engines, so
      // we tag the element with a stable data attribute and remove by selector.
      // This runs synchronously during the document.write parse, before any
      // later same-document creative markup is parsed/executed.
      + 'try{var __s=document.querySelector('
      + '\'script[data-sharc-prelude="load-probe"]\');'
      + 'if(__s&&__s.parentNode)__s.parentNode.removeChild(__s);}catch(_){}'
      + '}());';
    return injectPreludeScript(html, 'load-probe', code);
  }

  // ─────────────────────────────────────────────────────────────────────
  // 0.7.8 OMID shim source-rewrite (§ 4.3 mechanism i).
  //
  // When the inbound `:render` envelope carries `omid: true`, the renderer
  // installs the SHARC OMID shim (`window.omid3p`) into the creative iframe
  // BEFORE `document.write(creativeHtml)` — the same install point as the
  // MRAID / SafeFrame bridges and the load-probe prelude (§ 4.1).
  //
  // Trusted nonce injection (§ 4.3 mechanism i — the "renderer source-rewrite"
  // mechanism, mirroring `installLoadProbePrelude`'s SEC-H1 pattern):
  //
  //   1. Fetch the shim's IIFE source text same-origin (`OMID_SHIM_URL`). The
  //      same-origin assertion mirrors `loadBridgeModule`'s guardrail #2 — the
  //      shim source is renderer-controlled, never attacker-controlled.
  //   2. Build one inline `<script>` that runs the shim IIFE (which self-
  //      attaches `window.SHARC.installOmidShim`) and then calls
  //      `installOmidShim({ protocolNonce: <BAKED LITERAL>, ... })`.
  //
  // The OMID `protocolNonce` is baked into the inline script as a JSON literal
  // assigned to a `var` inside the wrapping IIFE — i.e. a CLOSURE CONSTANT. The
  // shim captures it as private closure state and never reads it back out
  // (§ 4.3, § 5.2). Because this `<script>` is the first child of the written
  // document's head, it runs synchronously before any creative markup executes
  // — `window.omid3p`'s two-method surface is live for the verification
  // client's first synchronous probe (§ 4.1, § 5.1).
  //
  // SECURITY (#254): closure-variable unreachability is NOT source-text
  // unreachability — the nonce literal still lives in the inline <script>'s
  // source, readable via document.scripts[i].textContent/.outerHTML. So as its
  // final synchronous statement the prelude self-removes its own <script>
  // element (matching installLoadProbePrelude). After removal the closure-held
  // nonce keeps the shim working, but the source text is no longer in the DOM
  // for creative code to harvest.
  //
  // @param {string} html               Creative HTML (already prelude-rewritten).
  // @param {string} omidProtocolNonce  OMID protocol nonce (router-derived).
  // @param {string} placementSessionId
  // @param {string} containerOrigin
  // @param {string} rendererNonce      Renderer-protocol nonce (router gate 7).
  //                                    Baked so the inline shim-install catch can
  //                                    echo it on the #249 :failed envelope. NOT
  //                                    the OMID protocolNonce. Mirrors
  //                                    installLoadProbePrelude's `ackNonce` param.
  // @returns {Promise<string>}         The HTML with the shim prelude prepended.
  // @throws if the shim URL is cross-origin/unparseable or the fetch fails —
  //         the caller routes this to `:failed` so OMID never silently no-ops.
  // ─────────────────────────────────────────────────────────────────────
  async function installOmidShimPrelude(html, omidProtocolNonce,
                                        placementSessionId, containerOrigin,
                                        rendererNonce) {
    var resolved;
    try {
      resolved = new URL(RENDERER_CONFIG.OMID_SHIM_URL, window.location.href);
    } catch (urlErr) {
      var unparseable = new Error('omid_shim_url_unparseable');
      /** @type {any} */ (unparseable).url = String(RENDERER_CONFIG.OMID_SHIM_URL);
      throw unparseable;
    }
    // SECURITY: same-origin assertion (mirrors loadBridgeModule guardrail #2).
    if (resolved.origin !== window.location.origin) {
      var crossOrigin = new Error('omid_shim_url_cross_origin');
      /** @type {any} */ (crossOrigin).url = resolved.href;
      throw crossOrigin;
    }

    var resp = await fetch(resolved.href, { credentials: 'same-origin' });
    if (!resp.ok) {
      var fetchErr = new Error('omid_shim_fetch_failed: HTTP ' + resp.status);
      /** @type {any} */ (fetchErr).url = resolved.href;
      throw fetchErr;
    }
    var shimSource = await resp.text();

    // The wrapping IIFE establishes the closure scope; `protocolNonce` is a
    // baked JSON literal — a closure constant, not a global, not a DOM read.
    // The shim IIFE runs first (self-attaching window.SHARC.installOmidShim),
    // then we invoke it with the baked nonce + session context.
    var code = ''
      + '(function(){'
      + 'var protocolNonce=' + jsonForInlineScript(omidProtocolNonce) + ';'
      + 'var placementSessionId=' + jsonForInlineScript(placementSessionId) + ';'
      + 'var containerOrigin=' + jsonForInlineScript(containerOrigin) + ';'
      // 0.7.7 renderer-protocol nonce (NOT the OMID protocolNonce). Baked so the
      // shim-install catch below can echo it on a :failed envelope the
      // container's protocol router will accept (gate step 7).
      + 'var rendererNonce=' + jsonForInlineScript(rendererNonce) + ';'
      + shimSource + ';'
      // C1 reopen: window.omid3p survives document.open() (the window object
      // persists; only the document + the prior shim's script context are
      // wiped). On a REOPEN (generation > 0) the lingering gen-(N-1) omid3p is a
      // DEAD reference whose closure is gone — installOmidShim's loud-fail
      // (§11.3 "already installed") would otherwise abort the re-injected shim.
      // Clear it ONLY on a reopen so the first-render duplicate-install guard is
      // preserved; the freshly re-injected shim re-installs with this
      // generation's rotated protocolNonce.
      + 'try{if((window.__sharcDocGeneration||0)>0&&window.omid3p){'
      + 'try{delete window.omid3p;}catch(_e){window.omid3p=undefined;}}}catch(_e2){}'
      + 'try{(window.SHARC&&window.SHARC.installOmidShim||installOmidShim)({'
      + 'protocolNonce:protocolNonce,'
      + 'placementSessionId:placementSessionId,'
      + 'containerOrigin:containerOrigin'
      + '});}catch(e){'
      + 'if(window.console&&console.error)console.error('
      + '"[SHARC Renderer] OMID shim install failed:",e&&e.message?e.message:e);'
      // #249: SURFACE the half-install to the container instead of swallowing it.
      // The shim install runs synchronously DURING `document.write`, i.e. BEFORE
      // the inner `window 'load'` posts :rendered — so the container is still in
      // the `attaching-renderer` phase and a :failed envelope is in-phase (router
      // table: `failed` → phases ['attaching-renderer']). We post the SAME wire
      // shape the MRAID/SafeFrame wrapper-failure paths use (SHARC:Renderer:failed
      // + a `reason`), reusing the existing renderer→container :failed channel —
      // NO new wire type, NO new envelope field. `reason` is opaque-string
      // passthrough: the container routes `omid_shim_install_failed` to the
      // `renderer_failed` onSecurityEvent variant (details.reason), so a
      // half-installed shim (window.omid3p present, listener unattached — the B1
      // silent failure) is now DETECTABLE rather than a console.error buried in
      // the untrusted creative iframe. A throw here means the shim cannot deliver
      // the OMID measurement the container asked for, so it is fatal — parity with
      // the bridge/wrapper load-failure paths.
      + 'try{if(window.parent&&window.parent!==window){'
      + 'window.parent.postMessage({'
      + 'type:"SHARC:Renderer:failed",'
      + 'placementSessionId:placementSessionId,'
      + 'sharcNonce:rendererNonce,'
      + 'reason:"omid_shim_install_failed"'
      + '},containerOrigin);}}catch(_){}}'
      // SECURITY (#254): self-remove the prelude <script> as the FINAL
      // synchronous statement. `protocolNonce` is already captured into the
      // shim's private closure state by the installOmidShim call above, so the
      // shim keeps working after the element is gone — but the source TEXT
      // (carrying the nonce literal) is no longer readable from document.scripts
      // by creative code. document.currentScript is null for document.write-
      // injected scripts in many engines, so we remove by the stable data
      // attribute. Runs synchronously during the document.write parse, before
      // any later same-document creative markup is parsed/executed.
      + 'try{var __s=document.querySelector('
      + '\'script[data-sharc-prelude="omid-shim"]\');'
      + 'if(__s&&__s.parentNode)__s.parentNode.removeChild(__s);}catch(_){}'
      + '}());';
    return injectPreludeScript(html, 'omid-shim', code);
  }

  // ─────────────────────────────────────────────────────────────────────
  // 0.7.10 MRAID compatibility wrapper (#321 Decision 3).
  //
  // A legacy MRAID creative ships no SHARC SDK, so the old bridge-only import
  // path could expose no usable `window.mraid` readiness chain: no SDK means
  // no createSession, no Container:init, and therefore no MRAID ready/default.
  //
  // The renderer now composes the existing IIFE dist modules into a prelude:
  //   sharc-protocol.js -> sharc-creative.js -> sharc-mraid-bridge.js
  // and prepends that prelude before creative markup when `data.bridges`
  // includes `mraid`. The wrapped ad remains unmodified and SHARC stays the
  // single internal protocol: the renderer-provisioned sharc-creative SDK
  // drives the normal createSession handshake on the ad's behalf.
  //
  // Security model mirrors OMID source-rewrite:
  //   - URLs are renderer-configured, not container-supplied.
  //   - Each URL is resolved against the renderer page and must be same-origin.
  //   - Fetch failures are fatal; silently rendering without the wrapper would
  //     recreate the raw-MRAID stall this ADR fixes.
  // ─────────────────────────────────────────────────────────────────────
  // ─────────────────────────────────────────────────────────────────────
  // Shared prelude injector (#329).
  //
  // ONE escaping code path for every prelude the renderer inlines into the
  // creative document (load-probe, OMID shim, MRAID/SafeFrame compat). Each
  // builder composes its `code` string, then hands (html, preludeName, code)
  // here; this helper owns the inject-and-serialize mechanics AND the
  // mandatory closing-script-token escape.
  //
  // Why the escape is mandatory, not best-effort (#326): the prelude <script>
  // is serialized via `outerHTML` during `document.write`. If `code` contains
  // a literal closing-script token (e.g. inside a JSDoc comment in a composed
  // dist module — sharc-creative.js ships 5 such tokens), the serializer would
  // emit a REAL closing-script tag that prematurely closes the injected
  // prelude, truncating it and dumping the remainder as page text. Breaking the
  // token up (`</scr` + `ipt` → `<\/scr` + `ipt`) keeps the serialized form
  // inert; the HTML parser reconstitutes it as harmless literal text inside the
  // script body. This was load-bearing for the compat preludes and latent
  // fragility for the OMID/load-probe preludes (whose sources happened to carry
  // zero such tokens). Routing all of them through this one helper makes the
  // property hold regardless of any future prelude-source edit.
  //
  // @param {string} html         Creative HTML (already prelude-rewritten by
  //                              any earlier prelude in the chain).
  // @param {string} preludeName  Stable data-sharc-prelude tag value (the
  //                              self-removal selectors key off this).
  // @param {string} code         The fully-composed inline prelude body.
  // @returns {string}            `html` with the escaped prelude <script>
  //                              prepended as the first head child.
  // ─────────────────────────────────────────────────────────────────────
  function escapeClosingScriptTokens(source) {
    return String(source).replace(/<\/script/gi, '<\\/script');
  }

  function injectPreludeScript(html, preludeName, code, record) {
    // Capture the composed prelude `code` for the document.open re-injection
    // shim. `record` defaults to the first-render capture flag so the existing
    // callers (which omit the arg) record automatically; the shim's own
    // re-injection passes `record: false` so it does not re-capture. The
    // `typeof` guards keep this function self-contained when extracted and
    // eval'd in isolation by the prelude unit tests (which provide neither
    // the capture flag nor the prelude store).
    var __shouldRecord = (record === undefined)
      ? (typeof __recordPreludes !== 'undefined' && __recordPreludes)
      : record;
    if (__shouldRecord && typeof __harnessPreludes !== 'undefined') {
      __harnessPreludes.push({ name: preludeName, code: code });
    }
    var escaped = escapeClosingScriptTokens(code);
    try {
      var doc = new DOMParser().parseFromString(html, 'text/html');
      var script = doc.createElement('script');
      script.setAttribute('data-sharc-prelude', preludeName);
      script.text = escaped;
      var parent = doc.head || doc.body || doc.documentElement;
      parent.insertBefore(script, parent.firstChild);
      return doc.documentElement.outerHTML;
    } catch (_) {
      return '<script data-sharc-prelude="' + preludeName + '">'
        + escaped + '<\\/script>' + html;
    }
  }

  async function fetchSameOriginRendererSource(configKey, failurePrefix) {
    var rawUrl = RENDERER_CONFIG[configKey];
    var resolved;
    try {
      resolved = new URL(rawUrl, window.location.href);
    } catch (urlErr) {
      var unparseable = new Error(failurePrefix + '_url_unparseable');
      /** @type {any} */ (unparseable).url = String(rawUrl);
      throw unparseable;
    }
    if (resolved.origin !== window.location.origin) {
      var crossOrigin = new Error(failurePrefix + '_url_cross_origin');
      /** @type {any} */ (crossOrigin).url = resolved.href;
      throw crossOrigin;
    }
    var resp = await fetch(resolved.href, { credentials: 'same-origin' });
    if (!resp.ok) {
      var fetchErr = new Error(failurePrefix + '_fetch_failed: HTTP ' + resp.status);
      /** @type {any} */ (fetchErr).url = resolved.href;
      throw fetchErr;
    }
    return await resp.text();
  }

  async function installMraidCompatibilityWrapperPrelude(html) {
    var protocolSource = await fetchSameOriginRendererSource(
      'MRAID_WRAPPER_PROTOCOL_URL', 'mraid_wrapper_protocol');
    var creativeSource = await fetchSameOriginRendererSource(
      'MRAID_WRAPPER_CREATIVE_URL', 'mraid_wrapper_creative');
    var bridgeSource = await fetchSameOriginRendererSource(
      'MRAID_WRAPPER_BRIDGE_URL', 'mraid_wrapper_bridge');

    var code = ''
      + '(function(){'
      + 'window.__sharcMraidBridgeAutoInstall=true;'
      + protocolSource + ';\n'
      + creativeSource + ';\n'
      + bridgeSource + ';\n'
      + 'try{var __s=document.querySelector('
      + '\'script[data-sharc-prelude="mraid-wrapper"]\');'
      + 'if(__s&&__s.parentNode)__s.parentNode.removeChild(__s);}catch(_){}'
      + '}());';
    return injectPreludeScript(html, 'mraid-wrapper', code);
  }

  // ─────────────────────────────────────────────────────────────────────
  // 0.7.10 SafeFrame compatibility wrapper (#339).
  //
  // The SafeFrame analogue of installMraidCompatibilityWrapperPrelude above.
  // A raw legacy SafeFrame creative ships no SHARC SDK, so the bridge-only
  // dynamic-import path had no window.SHARC to install on: no createSession,
  // no sessionId, so the SafeFrame bridge's SHARC.onReady / stateChange
  // subscriptions never fire and window.$sf.ext is never wired. R1's
  // container->creative current-state push only reaches the bridge once a
  // SHARC session exists — exactly the late-subscriber gap #339 closes.
  //
  // The renderer composes the existing IIFE dist modules into a prelude:
  //   sharc-protocol.js -> sharc-creative.js -> sharc-safeframe-bridge.js
  // and prepends that prelude before creative markup when `data.bridges`
  // includes `safeframe`. The wrapped ad remains unmodified and SHARC stays
  // the single internal protocol: the renderer-provisioned sharc-creative SDK
  // drives the normal createSession handshake on the ad's behalf, then the
  // bridge maps Container:init/active to $sf.ext geometry callbacks.
  //
  // Security model is identical to the MRAID wrapper / OMID source-rewrite:
  //   - URLs are renderer-configured (frozen RENDERER_CONFIG), not container-
  //     supplied. No creative-controlled value enters the injected script/URL.
  //   - Each URL is resolved against the renderer page and must be same-origin
  //     (enforced by fetchSameOriginRendererSource).
  //   - The composed source has its closing-script tokens escaped by the
  //     shared injectPreludeScript (same single path as every other prelude).
  //   - Fetch/inject failure is fatal; silently rendering without the wrapper
  //     would recreate the raw-SafeFrame stall this closes.
  // ─────────────────────────────────────────────────────────────────────
  async function installSafeFrameCompatibilityWrapperPrelude(html) {
    var protocolSource = await fetchSameOriginRendererSource(
      'SAFEFRAME_WRAPPER_PROTOCOL_URL', 'safeframe_wrapper_protocol');
    var creativeSource = await fetchSameOriginRendererSource(
      'SAFEFRAME_WRAPPER_CREATIVE_URL', 'safeframe_wrapper_creative');
    var bridgeSource = await fetchSameOriginRendererSource(
      'SAFEFRAME_WRAPPER_BRIDGE_URL', 'safeframe_wrapper_bridge');

    var code = ''
      + '(function(){'
      + 'window.__sharcSafeFrameBridgeAutoInstall=true;'
      + protocolSource + ';\n'
      + creativeSource + ';\n'
      + bridgeSource + ';\n'
      + 'try{var __s=document.querySelector('
      + '\'script[data-sharc-prelude="safeframe-wrapper"]\');'
      + 'if(__s&&__s.parentNode)__s.parentNode.removeChild(__s);}catch(_){}'
      + '}());';
    return injectPreludeScript(html, 'safeframe-wrapper', code);
  }

  // ─────────────────────────────────────────────────────────────────────
  // DOMParser + replaceChildren fallback (proposal AC L1201).
  //
  // Insurance path against future browser restrictions on document.write
  // for cross-origin iframes. NOT the default code path; the runtime
  // fallback at acceptAndRender invokes this when document.write throws
  // OR when RENDERER_CONFIG.FORCE_DOMPARSER_FALLBACK is set true.
  //
  // Two-pass installation:
  //
  //   Pass 1 — Structural replacement.
  //     If `document.documentElement` exists (force-fallback path; no
  //     document.open() has run yet), swap its head + body children
  //     for the parsed structure via `replaceChildren`. The AC text
  //     names this API explicitly — preserve the call so the canonical
  //     proof-of-concept matches the proposal spec.
  //
  //     If `document.documentElement` is null (runtime-fallback path
  //     reached because `document.write` threw AFTER `document.open`,
  //     and `document.open` removes all document nodes per HTML spec),
  //     adopt and append `parsed.documentElement` directly to the
  //     document. This is the spec-equivalent recovery — replaceChildren
  //     can't run on a null element.
  //
  //   Pass 2 — Script execution preservation.
  //     DOMParser-parsed `<script>` elements are INERT — they will not
  //     execute when inserted into the live document via replaceChildren
  //     (the spec marks them "already started"). To get script execution
  //     semantics, we walk the live document AFTER pass 1 and replace
  //     each `<script>` with a fresh element created via
  //     `document.createElement('script')` (live document, not parsed).
  //     Freshly-created scripts are "parser-inserted=false" and run on
  //     insertion. Attributes and text content are copied across.
  //
  // jsdom limitation: jsdom's `replaceChildren` does not trigger script
  // execution at all (even via the recreation pass when the script is
  // moved by replaceChildren), but the per-script `replaceChild` call in
  // pass 2 with a freshly-created live-document script DOES execute.
  // Tested in test-renderer-domparser-fallback.js. Real browsers honor
  // the spec insertion steps from `replaceChildren`, so the recreation
  // pass is what actually runs the script.
  //
  // @param {string} html  Creative HTML (already meta-refresh-stripped
  //                        and onBeforeRender-hook'd).
  // @returns {void}
  // @throws if DOMParser fails or the DOM cannot be installed.
  // ─────────────────────────────────────────────────────────────────────
  function tryDomParserReplaceChildren(html) {
    var parsed = new DOMParser().parseFromString(html, 'text/html');

    // Pass 1: structural replacement. Two sub-paths depending on whether
    // document.open() already wiped the document.
    if (document.documentElement) {
      // Force-fallback path (FORCE_DOMPARSER_FALLBACK=true). The live
      // document still has a documentElement; swap its head + body
      // children for the parsed structure via the AC-named API.
      document.documentElement.replaceChildren(parsed.head, parsed.body);
    } else {
      // Runtime-fallback path: document.open() ran inside the
      // document.write try-block, then document.write threw. open()
      // removes all child nodes of the document, leaving documentElement
      // null. Recover by appending the parsed documentElement directly.
      // This adopts parsed.documentElement into the live document via
      // standard insertion steps.
      document.appendChild(parsed.documentElement);
    }

    // Pass 2: re-create scripts in the live document so they execute.
    // Walk the live document AFTER the structural replacement — at this
    // point inert <script> elements from the parsed document are sitting
    // in the live tree but flagged "already started", which means a fresh
    // append/insertion would not re-run them. Replace each with a freshly
    // created script element (via document.createElement on the LIVE
    // document) so the browser's insertion steps run the script body.
    var inertScripts = document.querySelectorAll('script');
    for (var i = 0; i < inertScripts.length; i++) {
      var inert = inertScripts[i];
      if (!inert.parentNode) continue;
      var live = document.createElement('script');
      // Copy attributes (src, type, async, defer, integrity, etc.).
      for (var j = 0; j < inert.attributes.length; j++) {
        var attr = inert.attributes[j];
        live.setAttribute(attr.name, attr.value);
      }
      // Copy inline text content.
      if (inert.textContent) {
        live.textContent = inert.textContent;
      }
      inert.parentNode.replaceChild(live, inert);
    }
  }

  // ─────────────────────────────────────────────────────────────────────
  // 2. Reply helpers. All replies post to window.parent at targetOrigin
  //    `*` — the container validates the envelope on its side
  //    (`event.source === iframe.contentWindow`, `event.origin ===
  //    rendererOrigin`, `placementSessionId` match) and silently ignores
  //    mismatches. The renderer cannot know the container's origin
  //    a-priori for `:failed` replies that fire BEFORE we receive the
  //    `:render` envelope (e.g. the SW-detection failure path), so
  //    `*` is the only viable targetOrigin for those cases.
  //
  //    For replies AFTER receipt of `:render`, the validated
  //    `event.data.containerOrigin` is used (tighter trust anchor).
  // ─────────────────────────────────────────────────────────────────────
  function postFailed(reason, placementSessionId, targetOrigin) {
    if (!window.parent || window.parent === window) return;
    try {
      window.parent.postMessage({
        type: 'SHARC:Renderer:failed',
        // Echo only when known. Pre-:render failures (SW detection)
        // don't have a placementSessionId — the container will silently
        // ignore the message via its envelope check, but the operator
        // still sees the console output for debugging.
        placementSessionId: placementSessionId || '',
        // 0.7.7: echo the fragment nonce for the container's protocol-router
        // gate (step 7). Renderer-side contract is opaque-string passthrough.
        sharcNonce: nonce,
        reason: String(reason).slice(0, 200),
      }, targetOrigin || '*');
    } catch (_) { /* swallow — postMessage in a torn-down frame */ }
  }

  function postRendered(placementSessionId, containerOrigin) {
    if (!window.parent || window.parent === window) return;
    try {
      window.parent.postMessage({
        type: 'SHARC:Renderer:rendered',
        placementSessionId: placementSessionId,
        // 0.7.7: echo the fragment nonce back so the container's protocol
        // router can validate the envelope at gate step 7. Renderer-side
        // contract is opaque-string passthrough — whatever was in the
        // location.hash on script start is sent back verbatim.
        sharcNonce: nonce,
        // RENDERER-SUPPLIED post-load origin echo. The container compares
        // this against its construction-time `_rendererOrigin` and
        // terminates with `RENDERER_ORIGIN_MISMATCH (2116)` on a
        // mismatch — defeats the 30x-redirect-collapses-sandbox attack.
        rendererOrigin: window.location.origin,
      }, containerOrigin);
    } catch (_) { /* swallow */ }

  // ─────────────────────────────────────────────────────────────────────
  // 3. Service Worker detection — HARD FAIL.
  //
  //    A Service Worker on this origin sees every iframe load including
  //    the URL fragment (via `FetchEvent.request.url`) and can substitute
  //    the renderer HTML transparently. This defeats the fragment-nonce
  //    defense entirely.
  //

  //      a. `navigator.serviceWorker.controller` non-null — a SW is
  //         actively controlling the page.
  //      b. `navigator.serviceWorker.getRegistrations()` returns any —
  //         SW is registered but not yet controlling (e.g. registered
  //         this load, takes effect on next).
  //
  //    Either case → post `:failed` with `reason:
  //    'service_worker_detected'` and DO NOT proceed with rendering.
  //    Operator forks SHOULD preserve this check.
  // ─────────────────────────────────────────────────────────────────────
  function detectServiceWorker() {

      // know the container's origin. Per the protocol, the container
      // silently ignores envelope-mismatched messages; the message
      // serves the dev-channel feedback path.
      postFailed('service_worker_detected', '', '*');

          + window.location.origin + ') — refusing to render. '
          + 'A Service Worker on the renderer origin can intercept iframe '
          + 'loads and substitute the renderer HTML transparently, defeating '
          + 'the fragment-nonce defense. Unregister all SWs from this origin.',
        { severity: 'error', reason: 'service_worker_detected' });

  // ─────────────────────────────────────────────────────────────────────
  // 3b. Bridge module loader (0.7.1, issue #82).
  //
  //    Per `data.bridges` from the validated `:render` envelope, dynamically
  //    imports the requested bridge modules so they install
  //    `window.mraid` / `window.$sf` BEFORE `document.write(creativeHtml)`
  //    runs the creative's first synchronous script.
  //
  //    Five Security Engineer guardrails applied here:
  //
  //      1. Allowlist enforcement is the ONLY `import()` call site.
  //         Identifiers not in `KNOWN_BRIDGES` are silently skipped via
  //         `customSecurityLog` — no fallback path can reach `import()`.
  //
  //      2. Same-origin URL assertion. After substituting `{name}` into
  //         `BRIDGE_URL_TEMPLATE`, the resolved URL is parsed via
  //         `new URL(resolved, location.href)` and its origin compared
  //         to `location.origin`. Mismatch → `:failed` with reason
  //         `'bridge_load_failed'` (the renderer never imports cross-
  //         origin module code, even if a fork misconfigured the
  //         template). This is the load-bearing defense against an
  //         attacker-controlled bridge URL.
  //
  //      3. `RENDERER_CONFIG` is `Object.freeze`-d at construction (see
  //         RENDERER_CONFIG block above). Closes the post-load-mutation
  //         surface — the URL template cannot be retroactively pointed
  //         at attacker-controlled code by later JS in the page.
  //
  //      4. CSP `script-src 'self'` operator guidance (see RENDERER_CONFIG
  //         security checklist comment). Browser-level enforcement of
  //         the same-origin invariant defended at the JS layer by #2.
  //
  //      5. Failure surface: `:failed` with `reason: 'bridge_load_failed'`
  //         and a `bridge` field carrying the failed identifier. Container
  //         routes this to the `bridge_load_failed` discriminated-union
  //         variant on `onSecurityEvent` so operators see bridge-load
  //         failures distinct from generic `RENDERER_FAILED (2115)`.
  //
  //    Each bridge load is wrapped in try/catch around the module-level
  //    flag set + dynamic import. Returns a promise that resolves
  //    regardless of success/failure — the caller awaits on
  //    `Promise.all` and posts `:failed` via the first promise that
  //    rejected.
  // ─────────────────────────────────────────────────────────────────────
  function loadBridgeModule(bridgeName) {
    // Substitute and resolve to absolute URL.
    var template = RENDERER_CONFIG.BRIDGE_URL_TEMPLATE;
    var substituted = String(template).replace(/\{name\}/g, bridgeName);
    var resolved;
    try {
      resolved = new URL(substituted, window.location.href);
    } catch (urlErr) {
      // BRIDGE_URL_TEMPLATE produced an unparseable URL (rare — likely a
      // fork-time misconfiguration). Treat as a load failure. Log via
      // customSecurityLog for parity with the cross-origin path so dev
      // operators see the failure on the dev-channel (the :failed reply
      // routes it to the structured channel too).
      window.__sharcRenderer.customSecurityLog(
        'Bridge URL unparseable — refusing to import. '
          + 'bridge=' + bridgeName + ' template=' + JSON.stringify(template)
          + ' substituted=' + JSON.stringify(substituted)
          + '. Check RENDERER_CONFIG.BRIDGE_URL_TEMPLATE — the substituted '
          + 'string must parse via `new URL(substituted, window.location.href)`.',
        { severity: 'error', reason: 'bridge_url_unparseable', bridge: bridgeName });
      var unparseableErr = new Error('bridge_url_unparseable: ' + bridgeName);
      // Attach the substituted (unresolved) string as the URL surface — the
      // resolved absolute URL doesn't exist on this path, but the substituted
      // string is the operator's most actionable signal.
      /** @type {any} */ (unparseableErr).url = substituted;
      return Promise.reject(unparseableErr);
    }

    // SE guardrail #2: SAME-ORIGIN ASSERTION. The bridge module must be
    // hosted on the same origin as this renderer page. Cross-origin
    // template misconfiguration (e.g. operator typo, accidental CDN
    // copy-paste) MUST NOT result in importing attacker-controlled code.
    if (resolved.origin !== window.location.origin) {
      window.__sharcRenderer.customSecurityLog(
        'Bridge URL not same-origin with renderer — refusing to import. '
          + 'bridge=' + bridgeName + ' resolved.origin=' + resolved.origin
          + ' renderer.origin=' + window.location.origin
          + '. Check RENDERER_CONFIG.BRIDGE_URL_TEMPLATE — bridge modules '
          + 'MUST be hosted on the renderer origin (same-origin), not on '
          + 'a CDN or a different operator domain.',
        { severity: 'error', reason: 'bridge_url_cross_origin', bridge: bridgeName });
      var crossOriginErr = new Error('bridge_url_cross_origin: ' + bridgeName);
      /** @type {any} */ (crossOriginErr).url = resolved.href;
      return Promise.reject(crossOriginErr);
    }

    // Set the bridge-specific auto-install flag BEFORE the import. The
    // bridge module's evaluation will check the flag and install once
    // window.SHARC becomes available (after document.write runs the
    // creative SDK script). Mirrors the existing __sharcNavBridgeAutoInstall
    // pattern.
    /** @type {any} */
    var anyWin = window;
    if (bridgeName === 'mraid') {
      anyWin.__sharcMraidBridgeAutoInstall = true;
    } else if (bridgeName === 'safeframe') {
      anyWin.__sharcSafeFrameBridgeAutoInstall = true;
    }
    // Future identifiers added in 0.7.2+ extend this set.

    // Dynamic import. Module-level evaluation triggers the bridge's
    // auto-install path; the returned promise resolves once the module
    // graph is fetched and evaluated. import() rejects on 404, MIME
    // mismatch (browsers refuse modules served as application/octet-
    // stream), network failure, and module-evaluation throws. On rejection,
    // attach the resolved URL to the error so the outer catch can include
    // it in the `:failed` payload (`url` field on BridgeLoadFailedEvent.details).
    return import(resolved.href).catch(function (importErr) {
      /** @type {any} */ (importErr).url = resolved.href;
      throw importErr;
    });
  }

  // ─────────────────────────────────────────────────────────────────────
  // 4. Inbound :render listener. Registered synchronously at script start
  //    so messages arriving before swCheckPromise resolves are queued
  //    (we re-process inside the handler — the SW check is awaited below).
  //
  //    Validation rules (proposal § Renderer implementation contract,
  //    item 3):
  //      - event.source === window.parent
  //      - event.origin === event.data.containerOrigin
  //      - event.data.sharcNonce === nonce
  //      - sharcVersion / rendererProtocolVersion are supported
  //
  //    On any failure → post :failed with the appropriate reason. Do
  //    NOT proceed with rendering.
  // ─────────────────────────────────────────────────────────────────────
  var rendered = false;

  function onRenderMessage(event) {
    if (rendered) return; // idempotency — only render once

    // Envelope checks first; on any failure we silent-ignore (per spec
    // line 397–401, the container does the same — neighbor-frame forgery
    // is not an error condition, just noise).
    if (!event || event.source !== window.parent) return;
    var data = event.data;
    if (!data || typeof data !== 'object') return;
    if (data.type !== 'SHARC:Renderer:render') return;

    // C1: generation-0's gate nonce is the fragment value itself (`nonce`,
    // synchronously available) — UNCHANGED from pre-rotation. The reverse chain
    // (built async at IIFE start) only governs reopen generations ≥ 1, which
    // happen well after this first render, so no await is needed here.

    // Container-origin echo: event.origin must match data.containerOrigin
    // (defeats container-spoofing — a sibling frame at a different origin
    // could otherwise post a forged :render claiming to be the container).
    if (typeof data.containerOrigin !== 'string'
        || event.origin !== data.containerOrigin) {
      postFailed('container_origin_mismatch', data.placementSessionId, '*');
      return;
    }

    // Fragment-nonce check: defeats neighbor-frame forgery — only the
    // container that sourced the iframe knows the nonce we read from
    // location.hash at script start.
    if (typeof data.sharcNonce !== 'string'
        || data.sharcNonce.length === 0
        || data.sharcNonce !== nonce) {
      postFailed('nonce_mismatch', data.placementSessionId, data.containerOrigin);
      return;
    }

    // Version check. The renderer is operator-deployed; if the container
    // bumps the renderer protocol version without the operator upgrading
    // the renderer, we want a loud immediate failure (operators see it
    // in monitoring, not as a slowly-degrading impression rate weeks
    // later — proposal § Container and renderer must upgrade together,
    // line 154–166).
    //
    // Inbound versions are matched against RENDERER_CONFIG.ALLOWED_PROTOCOL_VERSIONS
    // (a list, not a single value), so operator forks can widen the
    // accept-list during a renderer-first deployment cutover — accept
    // both the old and new versions until the container fleet is fully
    // upgraded, then drop the old one.
    if (typeof data.rendererProtocolVersion !== 'string'
        || RENDERER_CONFIG.ALLOWED_PROTOCOL_VERSIONS.indexOf(data.rendererProtocolVersion) === -1) {
      postFailed('unsupported_renderer_protocol_version',
        data.placementSessionId, data.containerOrigin);
      return;
    }

    // Required-shape check: placementSessionId, creativeHtml.
    if (typeof data.placementSessionId !== 'string'
        || data.placementSessionId.length === 0) {
      postFailed('missing_placement_session_id',
        data.placementSessionId || '', data.containerOrigin);
      return;
    }
    if (typeof data.creativeHtml !== 'string') {
      postFailed('missing_creative_html',
        data.placementSessionId, data.containerOrigin);
      return;
    }

    // 0.7.1 (issue #82): bridges field shape check. Field is OPTIONAL —
    // an old container talking to a 0.7.1 renderer omits it; that's
    // identical to `bridges: []`. Old renderer ignoring `bridges` from
    // a new container is also fine (old renderer's load path predates
    // the field). When present, MUST be an array of strings; anything
    // else is a malformed payload and we reject loudly.
    if (data.bridges !== undefined && data.bridges !== null) {

          data.placementSessionId, data.containerOrigin);

      }

          postFailed('invalid_bridges_field',
            data.placementSessionId, data.containerOrigin);
          return;
        }
      }
    }

    // 0.7.8 (§ 4.3 mechanism i): OMID fields shape check. Both OPTIONAL —
    // an OMID-off container (or an old container) omits them and the render
    // proceeds exactly as pre-0.7.8 (no shim install). When `omid` is present
    // it MUST be a boolean; when `omid === true` an `omidProtocolNonce`
    // non-empty string MUST accompany it (the renderer bakes it into the shim
    // as a closure constant). A malformed OMID payload is rejected loudly
    // rather than silently dropping measurement.
    if (data.omid !== undefined && data.omid !== null) {
      if (typeof data.omid !== 'boolean') {
        postFailed('invalid_omid_field',
          data.placementSessionId, data.containerOrigin);
        return;
      }
      if (data.omid === true
          && (typeof data.omidProtocolNonce !== 'string'
              || data.omidProtocolNonce.length === 0)) {

          data.placementSessionId, data.containerOrigin);

      }
    }

    // SW gate. The check fired at script start; if it hadn't resolved
    // yet, we defer. (Realistically the SW check is microtask-fast and
    // will already have resolved by the time the container sends
    // :render — but the await is a correctness-belt.)
    //
    // acceptAndRender is async (0.7.1, issue #82) — it awaits the
    // dynamic import() of bridge modules before document.write. The
    // existing 2s :rendered reply timeout absorbs the import latency
    // (typical same-origin module fetch+evaluate is <100ms; the budget
    // is comfortable). Operator hook contract stays synchronous-required.
    // We capture rejections and surface them via console — the hook
    // already routes failures to :failed inside acceptAndRender.
    swCheckPromise.then(function () {

          data.placementSessionId, data.containerOrigin);
        return;
      }
      acceptAndRender(data).catch(function (acceptErr) {
        // Defense-in-depth: acceptAndRender should never throw — it
        // catches its own failures and posts :failed. If a future change
        // adds a throw path, log it via the structured channel rather
        // than silently dropping.
        window.__sharcRenderer.customSecurityLog(
          'acceptAndRender threw — render aborted: '
            + (acceptErr && acceptErr.message ? String(acceptErr.message) : 'unknown'),
          { severity: 'error', reason: 'accept_and_render_threw' });
      });
    });
  }

  async function acceptAndRender(data) {
    rendered = true;
    var html = String(data.creativeHtml);
    var placementSessionId = data.placementSessionId;
    var containerOrigin = data.containerOrigin;

    // ─── Operator hook: beforeStorageClear ────────────────────────────
    // Fires AFTER envelope+nonce validation but BEFORE the storage clear
    // sequence (the nonce-from-fragment clear immediately below today;
    // Strategy B JS-side storage clearing when that AC lands). Operators
    // may use this to capture telemetry or clear additional state. Must
    // be synchronous — see hook JSDoc above.
    try {
      window.__sharcRenderer.beforeStorageClear();
    } catch (hookErr) {
      window.__sharcRenderer.customSecurityLog(
        'beforeStorageClear hook threw — proceeding with render: '
          + (hookErr && hookErr.message ? String(hookErr.message) : 'unknown'),
        { severity: 'warn', reason: 'before_storage_clear_hook_threw' });
    }

    // ─── Defense-in-depth: clear nonce from location.hash ─────────────
    // The nonce was consumed for trust establishment (envelope validation
    // accepted). The creative HTML is about to execute in this same window
    // and could read `window.location.hash` to extract the nonce. Nonce is
    // single-use per iframe load (no replay value), but minimizing exposure
    // is cheap. Must run BEFORE document.open / document.write so the
    // creative never sees the hash.
    try {
      history.replaceState(null, '',
        window.location.pathname + window.location.search);
    } catch (_) { /* environments without history.replaceState — best-effort */ }

    // ─── Navigation bridge install ────────────────────────────────────
    // Phase D round-4 (OpenClaw HIGH-1): install the navigation bridge
    // BEFORE document.write so its capture-phase click / submit /
    // location.* / window.open interceptors apply to all creative code.
    //
    // Module-load timing: the bridge module is imported above as a
    // `type=module` script which evaluates asynchronously. We probe for
    // function-presence (`typeof renderer.installNavigationBridge ===
    // 'function'`) instead of a "ready" flag — that probe is equivalent
    // to a poll with no waiting cost. In practice the import resolves
    // before any :render envelope arrives (publisher origin reaches us
    // via postMessage AFTER iframe load AFTER module fetch+evaluate),

            + 'proceeding without bridge. Container load-event backstop '
            + '(RENDERER_UNAUTHORIZED_NAVIGATION 2118) remains in place. '
            + 'Possible causes (in operator-likelihood order): (1) module 404 '
            + '— verify the bridge path resolves from the renderer page; '
            + '(2) MIME mismatch — browsers reject ES modules served as '
            + '`application/octet-stream` and require `application/javascript` '
            + '(or `text/javascript`); (3) slow CDN latency on the module fetch.',

      }

      // Defense: a throw from the bridge install must not abort the render.
      // The backstop catches anything the bridge would have caught.

        'navigation bridge install threw — proceeding without bridge: '
          + (bridgeErr && bridgeErr.message ? String(bridgeErr.message) : 'unknown'),
        { severity: 'warn', reason: 'navigation_bridge_install_threw' });
    }

    // ─── Compatibility bridge loading (0.7.1, issue #82) ───────────────
    // The container's `data.bridges` field tells us which compatibility
    // bridge modules ('mraid', 'safeframe', ...) to prepare BEFORE
    // document.write so the creative's first synchronous script sees
    // window.mraid / window.$sf already in place. As of #321 (MRAID) and
    // #339 (SafeFrame), BOTH take the source-rewrite wrapper path later in
    // this function because a raw legacy MRAID/SafeFrame creative does not
    // ship the SHARC SDK needed by the old bridge-only dynamic import path.
    // `dynamicBridgesToLoad` therefore holds only future identifiers (none
    // in 0.7.x); both known bridges are wrapper-provisioned.
    //
    // Five SE guardrails apply (see `loadBridgeModule` JSDoc above):
    //   1. Allowlist filter — unknown identifiers silently skipped (this
    //      is what makes the protocol forward-compatible: a future
    //      container shipping `'omid'` to a 0.7.1 renderer doesn't break
    //      the render, just skips OMID).
    //   2. Same-origin URL assertion (inside loadBridgeModule).
    //   3. Object.freeze(RENDERER_CONFIG) (above, at config block).
    //   4. CSP `script-src 'self'` operator guidance (RENDERER_CONFIG
    //      security checklist comment).
    //   5. :failed reason='bridge_load_failed' surfaces as the new
    //      `bridge_load_failed` discriminated-union variant on the
    //      container's `onSecurityEvent`.
    //
    // Loads run in parallel via Promise.all — multiple bridges resolve
    // concurrently and the await is short-circuited if any rejects. On
    // first rejection, we post :failed with reason='bridge_load_failed'
    // and the bridge identifier; the container terminates with
    // RENDERER_FAILED (2115) routed to bridge_load_failed.
