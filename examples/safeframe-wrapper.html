<!doctype html>
<!--
  safeframe-wrapper.html — Same-origin SafeFrame creative wrapper page

  This page is loaded inside the SHARC container iframe instead of the SafeFrame
  creative directly. It establishes the SHARC SDK and SafeFrame bridge before
  loading the creative, satisfying the SafeFrame contract that window.$sf.ext is
  available synchronously before the creative's first <script> runs.

  Load order (per safeframe-bridge-design.md §4):
    1. sharc-protocol.js          → window.SHARC.Protocol
    2. sharc-creative.js          → window.SHARC (full SDK)
    3. sharc-safeframe-bridge.js  → window.$sf.ext

  Then the creative is loaded via ?creative=<url>.

  Usage:
    /sharc/safeframe-wrapper.html?creative=https%3A%2F%2Fexample.com%2Fad.html

  For same-origin test creatives, a relative path works:
    safeframe-wrapper.html?creative=test/test-safeframe-creative.html

  Null-origin sandbox note (matches mraid-wrapper.html pattern):
    The SHARC container sandboxes this iframe with allow-scripts only (no
    allow-same-origin). This gives us origin: null.
    - fetch() is blocked for null-origin → use XHR sync instead.
    - window.parent.* access throws SecurityError → never access parent.
    - Creating a nested iframe (double-sandbox) loses allow-scripts.
    - Solution: XHR-load the HTML creative body, inject DOM directly into
      this document, then load the companion .js via <script src> + onload
      callback to window.__SHARC_TEST_sfCreativeInit().
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SafeFrame Wrapper</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }
    /* Visible error overlay shown when the creative fails to load */
    #sharc-load-error {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(220,38,38,0.92);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, monospace;
      font-size: 12px;
      padding: 16px;
      box-sizing: border-box;
      overflow-y: auto;
      z-index: 9999;
    }
    #sharc-load-error strong { display: block; font-size: 14px; margin-bottom: 8px; }
  </style>

  <!--
    Scripts MUST load synchronously in this order.
    Each script runs to completion before the next one starts,
    ensuring window.$sf.ext is available before creative code executes.
  -->
  <script src="sharc-protocol.js"></script>
  <script src="sharc-creative.js"></script>
  <script src="sharc-safeframe-bridge.js"></script>
</head>
<body>
  <script>
    (function () {
      'use strict';

      var params = new URLSearchParams(location.search);
      var creativeUrl = params.get('creative');

      if (!creativeUrl) {
        showError('No ?creative= parameter provided.');
        return;
      }

      // Resolve the creative URL relative to the wrapper's own location.
      var resolvedUrl;
      try {
        resolvedUrl = new URL(creativeUrl, location.href).href;
      } catch (e) {
        showError('Invalid creative URL: ' + creativeUrl + ' (' + e.message + ')');
        return;
      }

      // Security: only load http(s) URLs. Block javascript: and data: schemes.
      var parsed;
      try {
        parsed = new URL(resolvedUrl);
      } catch (e) {
        showError('Could not parse creative URL: ' + resolvedUrl);
        return;
      }

      var allowedSchemes = ['http:', 'https:'];
      if (allowedSchemes.indexOf(parsed.protocol) === -1) {
        showError('Blocked creative URL with disallowed scheme: ' + parsed.protocol);
        return;
      }

      // Detect whether the creative is an HTML page or a JS file.
      var pathname = parsed.pathname || '';
      var isHtml   = !pathname.match(/\.js(\?|$)/i);

      if (isHtml) {
        // HTML creative: load the HTML structure via XMLHttpRequest (sync, same-origin),
        // inject the body DOM into this document, then load the companion .js file
        // (same basename) via <script src> + onload callback to window.__SHARC_TEST_sfCreativeInit().
        //
        // WHY NOT A NESTED IFRAME:
        //   This wrapper is already inside a sandboxed iframe (allow-scripts only,
        //   no allow-same-origin). A nested iframe would inherit the sandbox without
        //   allow-scripts, leaving the creative with no JS at all.
        //
        // WHY NOT fetch():
        //   fetch() is blocked when the document's origin is null (sandboxed without
        //   allow-same-origin). XHR sync is deprecated but works in null-origin contexts.
        //
        // Convention: test-safeframe-creative.html pairs with test-safeframe-creative.js.
        // The .html file contains only DOM structure and styles (no <script> tags).
        // All script logic lives in the .js file, which exposes window.__SHARC_TEST_sfCreativeInit().
        var xhr = new XMLHttpRequest();
        xhr.open('GET', resolvedUrl, false); // synchronous
        try {
          xhr.send();
        } catch (e) {
          showError('XHR failed to load creative HTML: ' + e.message + '\nURL: ' + resolvedUrl);
          return;
        }
        if (xhr.status !== 200) {
          showError('HTTP ' + xhr.status + ' loading creative HTML\nURL: ' + resolvedUrl);
          return;
        }
        var parser = new DOMParser();
        var doc = parser.parseFromString(xhr.responseText, 'text/html');

        // Inject <style> tags from creative <head>
        Array.from(doc.head.querySelectorAll('style')).forEach(function (el) {
          document.head.appendChild(document.adoptNode(el));
        });

        // Inject <body> content (without scripts — those are in the .js file).
        // Warn if the creative HTML contained inline <script> tags: they are
        // silently dropped by innerHTML assignment and won't execute.
        var strippedScripts = doc.body.querySelectorAll('script').length;
        if (strippedScripts > 0) {
          console.warn('[SafeFrame Wrapper] ' + strippedScripts + ' <script> tag(s) in creative HTML' +
            ' were not executed. Move all script logic to the companion .js file.');
        }
        document.body.innerHTML = doc.body.innerHTML;

        // Load companion .js file on next tick so injected DOM is fully parsed
        // before the creative script accesses getElementById etc.
        // After the script loads, call window.__SHARC_TEST_sfCreativeInit() if the creative
        // exposed it — this replaces fragile inline script execution.
        var jsUrl = resolvedUrl.replace(/\.html(\?.*)?$/, '.js$1');
        setTimeout(function () {
          var script = document.createElement('script');
          script.src = jsUrl;
          script.onload = function () {
            if (typeof window.__SHARC_TEST_sfCreativeInit === 'function') {
              var initFn = window.__SHARC_TEST_sfCreativeInit;
              // Delete before calling: prevents a malicious or buggy creative from
              // re-invoking init (re-injecting DOM, re-registering listeners) if the
              // callback reference leaks or if a future code path calls it again.
              delete window.__SHARC_TEST_sfCreativeInit;
              initFn();
            } else {
              showError('Creative script loaded but window.__SHARC_TEST_sfCreativeInit is not defined.\nEnsure ' + jsUrl + ' exposes window.__SHARC_TEST_sfCreativeInit.');
            }
          };
          script.onerror = function () {
            showError('Failed to load creative script: ' + jsUrl);
          };
          document.body.appendChild(script);
        }, 0);

      } else {
        // JS-only creative: inject as a script tag.
        // window.$sf is already available (set by sharc-safeframe-bridge.js above).
        var script = document.createElement('script');
        script.src = resolvedUrl;
        script.onerror = function () {
          showError('Failed to load creative script: ' + resolvedUrl);
        };
        document.body.appendChild(script);
      }
    }());

    function showError(msg) {
      console.error('[SafeFrame Wrapper]', msg);
      var el = document.getElementById('sharc-load-error');
      if (el) {
        el.innerHTML = '<strong>⚠ SafeFrame Wrapper — Load Error</strong>' +
          msg.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
        el.style.display = 'block';
      }
    }
  </script>
  <!-- Error overlay (hidden until a load failure occurs) -->
  <div id="sharc-load-error"></div>
</body>
</html>
