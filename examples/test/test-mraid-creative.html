<!doctype html>
<!--
  test-mraid-creative.html — Test MRAID Creative (DOM structure only)

  A realistic simulation of a MRAID 2.0/3.0 banner ad that exercises the
  SHARC MRAID bridge. Uses standard MRAID defensive patterns.

  This creative is loaded inside mraid-wrapper.html which:
    1. Injects window.mraid via sharc-mraid-bridge.js
    2. Loads this file via XHR and injects the <body> DOM
    3. Dynamically loads test-mraid-creative.js via <script src>
    4. Calls window.__mraidCreativeInit() after the script loads

  NOTE: This file contains DOM structure and styles ONLY.
  All script logic lives in test-mraid-creative.js.
  Do NOT add <script> tags here — they won't execute when injected via innerHTML.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test MRAID Creative</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Ad Banner ────────────────────────────────────────────── */
    #ad-banner {
      background: linear-gradient(135deg, #e94560 0%, #0f3460 100%);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 60px;
      flex-shrink: 0;
      cursor: pointer;
      user-select: none;
    }
    #ad-banner .brand {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #fff;
    }
    #ad-banner .cta {
      background: #fff;
      color: #e94560;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    #ad-banner .badge {
      font-size: 10px;
      color: rgba(255,255,255,0.6);
      margin-top: 2px;
    }
    .brand-wrap { display: flex; flex-direction: column; }

    /* ── Ad State Display ─────────────────────────────────────── */
    #ad-state {
      background: rgba(0,0,0,0.4);
      padding: 8px 16px;
      font-size: 11px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      flex-shrink: 0;
    }
    .state-item { display: flex; gap: 4px; align-items: center; }
    .state-label { color: rgba(255,255,255,0.5); }
    .state-value { color: #e94560; font-weight: 600; font-family: monospace; }
    .state-value.ok { color: #4ade80; }
    .state-value.warn { color: #fb923c; }

    /* ── Ad Controls ──────────────────────────────────────────── */
    #ad-controls {
      padding: 10px 16px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      flex-shrink: 0;
      background: rgba(0,0,0,0.2);
    }
    .ad-btn {
      background: #0f3460;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .ad-btn:hover { background: #16213e; }
    .ad-btn:active { background: #e94560; }
    .ad-btn.danger { border-color: #e94560; color: #e94560; }

    /* ── Protocol Log ─────────────────────────────────────────── */
    #log-header {
      padding: 6px 16px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: rgba(255,255,255,0.4);
      background: rgba(0,0,0,0.3);
      border-bottom: 1px solid rgba(255,255,255,0.07);
      flex-shrink: 0;
    }
    #protocol-log {
      flex: 1;
      overflow-y: auto;
      padding: 8px 16px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 11px;
      line-height: 1.6;
    }
    .log-entry {
      padding: 2px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .log-entry .ts { color: rgba(255,255,255,0.3); margin-right: 6px; }
    .log-entry.event .msg { color: #60a5fa; }
    .log-entry.action .msg { color: #a78bfa; }
    .log-entry.error .msg { color: #f87171; }
    .log-entry.info .msg { color: rgba(255,255,255,0.6); }
    .log-entry.ok .msg { color: #4ade80; }

    /* ── No-mraid fallback ────────────────────────────────────── */
    #no-mraid {
      display: none;
      padding: 20px;
      text-align: center;
      color: rgba(255,255,255,0.5);
      font-size: 13px;
    }
  </style>
</head>
<body>

  <!-- Ad Banner -->
  <div id="ad-banner">
    <div class="brand-wrap">
      <div class="brand">⚡ SHARC Demo</div>
      <div class="badge">MRAID 3.0 Creative</div>
    </div>
    <div class="cta" id="cta-btn">Learn More</div>
  </div>

  <!-- Live State Display -->
  <div id="ad-state">
    <div class="state-item">
      <span class="state-label">state:</span>
      <span class="state-value" id="disp-state">loading</span>
    </div>
    <div class="state-item">
      <span class="state-label">viewable:</span>
      <span class="state-value" id="disp-viewable">—</span>
    </div>
    <div class="state-item">
      <span class="state-label">placement:</span>
      <span class="state-value" id="disp-placement">—</span>
    </div>
    <div class="state-item">
      <span class="state-label">version:</span>
      <span class="state-value" id="disp-version">—</span>
    </div>
    <div class="state-item">
      <span class="state-label">muted:</span>
      <span class="state-value" id="disp-muted">—</span>
    </div>
  </div>

  <!-- Creative Controls -->
  <div id="ad-controls">
    <button class="ad-btn" onclick="testExpand()">expand()</button>
    <button class="ad-btn" onclick="testCollapse()">collapse()</button>
    <button class="ad-btn danger" onclick="testClose()">close()</button>
    <button class="ad-btn" onclick="testOpen()">open(url)</button>
    <button class="ad-btn" onclick="testSupports()">supports()</button>
    <button class="ad-btn" onclick="testStorePicture()">storePicture()</button>
    <button class="ad-btn" onclick="testResize()">resize()</button>
    <button class="ad-btn" onclick="testExpandUrl()">expand(url)</button>
    <button class="ad-btn" onclick="clearLog()">Clear Log</button>
  </div>

  <div id="log-header">MRAID Event Log</div>

  <!-- Protocol Log -->
  <div id="protocol-log">
    <div class="log-entry info">
      <span class="ts">[init]</span>
      <span class="msg">MRAID creative loaded. Waiting for window.mraid...</span>
    </div>
  </div>

  <div id="no-mraid">
    window.mraid not available.<br>
    Load this creative via mraid-wrapper.html?creative=test-mraid-creative.html
  </div>

  <!--
    NO <script> tags here. All logic is in test-mraid-creative.js.
    mraid-wrapper.html loads this file via XHR, injects the <body> DOM,
    then appends <script src="test-mraid-creative.js"> and calls
    window.__mraidCreativeInit() once the script has loaded.
  -->

</body>
</html>
