<!doctype html>
<!--
  mraid-3-compliance-runner.html — IAB MRAID 3.0 Compliance Test Runner

  Loads the IAB MRAID 3.0 compliance ads from the InteractiveAdvertisingBureau repo
  through the SHARC MRAID bridge and logs the protocol trace.

  Compliance ad locations (copied from ~/.openclaw/workspace-dev/docs/MRAID-3.0-Compliance-Ads/):
    - loadandevents/  — Load cycle, creative lifecycle, and state transitions
    - resize-negative/ — Resize operations that should fail
    - viewability/     — Viewability measurement tests

  Usage: serve this file from a local HTTP server and open in browser.
  The compliance ad HTML/JS must be co-located in a compliance-ads/ directory
  or the adUrls below must point to valid URLs.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SHARC — MRAID 3.0 Compliance Runner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a14;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      max-width: 1200px;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 { font-size: 18px; color: #fff; }
    .badge {
      background: #7c3aed;
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    /* Test list */
    .test-list {
      max-width: 1200px;
      margin: 0 auto 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .test-item {
      background: #14142a;
      border: 1px solid #2a2a3e;
      border-radius: 8px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: border-color 0.2s;
    }
    .test-item:hover { border-color: #7c3aed; }
    .test-item .test-name { flex: 1; }
    .test-item .test-name .test-title {
      font-size: 13px;
      font-weight: 600;
      color: #ddd;
    }
    .test-item .test-name .test-desc {
      font-size: 11px;
      color: #666;
      margin-top: 2px;
    }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.12s;
    }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-primary { background: #7c3aed; color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #6d28d9; }
    .btn-run-all { background: #4ade80; color: #111; }
    .btn-run-all:hover:not(:disabled) { background: #22c55e; }

    .status {
      font-size: 11px;
      font-weight: 700;
      min-width: 70px;
      text-align: center;
    }
    .status.pass     { color: #4ade80; }
    .status.fail     { color: #f87171; }
    .status.running  { color: #fbbf24; }
    .status.pending  { color: #555; }

    /* Ad display area */
    .ad-area {
      max-width: 1200px;
      margin: 0 auto 20px;
      background: #111;
      border: 2px dashed #2a2a3e;
      border-radius: 8px;
      min-height: 400px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    #adSlot {
      width: 320px;
      height: 480px;
      position: relative;
    }
    #adSlot iframe { display: block; border: none; }

    .ad-area .placeholder {
      color: #444;
      font-size: 14px;
      position: absolute;
      pointer-events: none;
    }

    /* Protocol log */
    .log-container {
      max-width: 1200px;
      margin: 0 auto;
      background: #0d0d1a;
      border: 1px solid #1a1a2e;
      border-radius: 8px;
      overflow: hidden;
    }
    .log-header {
      background: #14142a;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #2a2a3e;
    }
    .log-header h3 { font-size: 13px; color: #aaa; }
    .log-clear {
      padding: 4px 10px;
      font-size: 11px;
      border: 1px solid #333;
      border-radius: 4px;
      background: transparent;
      color: #666;
      cursor: pointer;
    }
    .log-clear:hover { background: #222; color: #ddd; }

    #protocolLog {
      height: 400px;
      overflow-y: auto;
      padding: 0;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 11px;
    }
    #protocolLog::-webkit-scrollbar { width: 5px; }
    #protocolLog::-webkit-scrollbar-thumb { background: #2a2a3e; border-radius: 3px; }

    .log-entry {
      display: flex;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }
    .log-ts {
      padding: 5px 10px;
      font-size: 10px;
      color: #333;
      border-right: 1px solid rgba(255,255,255,0.04);
      flex-shrink: 0;
      min-width: 72px;
    }
    .log-dir {
      padding: 5px 8px;
      min-width: 48px;
      font-size: 9px;
      font-weight: 700;
      text-align: center;
      border-right: 1px solid rgba(255,255,255,0.04);
      flex-shrink: 0;
    }
    .log-body { flex: 1; padding: 5px 12px; }
    .log-type { font-weight: 600; font-size: 11px; margin-bottom: 1px; }
    .log-args { color: #555; font-size: 10px; white-space: pre-wrap; word-break: break-all; }
    .log-cntr .log-type  { color: #a78bfa; }
    .log-crtv .log-type  { color: #fdba74; }
    .log-sys .log-type   { color: #777; }
    .log-ok .log-type    { color: #86efac; }
    .log-err .log-type   { color: #f87171; }
    .log-err .log-dir    { color: #f87171; }
  </style>
</head>
<body>

<header>
  <h1>🌉 SHARC MRAID 3.0 Compliance</h1>
  <span class="badge">IAB Compliance Ads</span>
  <button class="btn btn-run-all" id="btnRunAll" onclick="runAllTests()">▶ Run All</button>
  <button class="btn btn-primary" id="btnExport" onclick="exportResults()" disabled>Export JSON</button>
</header>

<div class="test-list" id="testList"></div>

<div class="ad-area">
  <div class="placeholder">Select a test to begin</div>
  <div id="adSlot"></div>
</div>

<div class="log-container">
  <div class="log-header">
    <h3>Protocol Log</h3>
    <button class="log-clear" onclick="clearLog()">Clear</button>
  </div>
  <div id="protocolLog">
    <div style="padding:40px;text-align:center;color:#444;">Select "Run All" or click a test to begin</div>
  </div>
</div>

<!--
  Parent frame loads only protocol + container. sharc-creative.js and
  sharc-mraid-bridge.js are creative-side and MUST NOT be loaded here —
  both declare `const { ContainerMessages, ... } = ...` at top level and
  collide with sharc-container.js's identical top-level const binding when
  loaded into the same realm. The creative-side scripts are loaded inside
  the iframe by mraid-wrapper.html (lines 71-73). Other harnesses
  (examples/test/index.html, mraid-test.html, safeframe-test.html) follow
  this same pattern — compare their <script> load lists.

  This mis-load was masked historically because the previous runner never
  actually called container.load(), so the constructor's symbolic path was
  never exercised. See review §"CRITICAL Finding 1".
-->
<script type="module" src="../sharc-protocol.js"></script>
<script type="module" src="../sharc-container.js"></script>

<script>
  'use strict';

  /* ── Test Definitions ──────────────────────────────────────────── */
  const TESTS = [
    {
      id: 'loadandevents',
      title: 'Load & Events',
      desc: 'Tests creative loading, lifecycle state transitions, and event dispatching (INTERACTIVE — 6 manual taps)',
      // Path relative from this file (in test/) → ../compliance-ads/loadandevents/
      adDir: 'compliance-ads/loadandevents',
      // aronmraid3.js defines a 6-step workflow gated on user taps (see
      // compliance-ads/loadandevents/aronmraid3.js:176-211). Only 3 of the 12
      // CHECK: assertions fire during bootstrap; the remaining 9 require human
      // interaction. A programmatic click driver is theoretically possible but
      // step 2 ("Tap SDK Close Button") requires cross-realm container collapse
      // coordination that pushes the driver over the 50-LOC ceiling agreed in
      // the review Decision 2. Falling back to Decision 2(b): manual runbook.
      // See docs/research/mraid-compliance-manual-runbook.md.
      interactive: true,
      manualNote: 'Interactive suite: 6 manual taps required to exercise all 12 assertion sites. See docs/research/mraid-compliance-manual-runbook.md.',
    },
    {
      id: 'resize-negative',
      title: 'Resize Negative Tests',
      desc: 'Tests resize operations that should fail (invalid dimensions, constraints)',
      adDir: 'compliance-ads/resize-negative',
      // SHARC's container-owned close-button model intentionally diverges from
      // MRAID 3.0 §4.4 here: the spec requires `setResizeProperties` to fire an
      // `error` event when offsetX/offsetY would push the close button
      // (partially) offscreen. Per ADR-PC-001 / ADR-PC-006 in
      // docs/design/architecture-placement-changes.md, SHARC accepts the resize
      // and silently overrides the hint to a visible default position rather
      // than rejecting it — the close affordance is a container responsibility,
      // not a creative one, and a hint should never block a valid resize.
      // The width-overflow variant (setCloseButtonZoneOffscreenWidth) still
      // errors via the maxSize check and is therefore NOT in this list.
      acceptedDivergences: [
        {
          slugMatch: /^setting-offset[xy].*offscreen/,
          adrRef: 'ADR-PC-001/006',
          rationale: 'Container owns close-button rendering and overrides offscreen hints to a visible default rather than rejecting the resize. See docs/design/architecture-placement-changes.md §4.4.',
        },
      ],
    },
    {
      id: 'resize-positive',
      title: 'Resize Positive Tests',
      desc: 'Tests resize operations that should succeed (basic resize, offset, close positions, close-from-resized)',
      adDir: 'compliance-ads/resize-positive',
    },
    {
      id: 'viewability',
      title: 'Viewability',
      desc: 'Visual viewability instrumentation (INTERACTIVE — chart-based review, no machine assertions)',
      adDir: 'compliance-ads/viewability',
      // viewabilityCompliance.v1.js is a Chart.js dashboard that draws
      // exposureRatio/visibility traces over time. It does NOT emit CHECK:/FAIL:
      // log lines for the harness to scrape, so a "no signal" headless run is
      // expected behavior, not harness breakage. Treat as needs-manual: the ad
      // bootstraps to active and a human verifies the chart visually.
      interactive: true,
      manualNote: 'Visual suite: viewability ad is a Chart.js dashboard, not assertion-based. Manual review required — open the iframe, scroll the placement in/out of view, and verify the chart renders the expected exposureRatio transitions.',
    },
  ];

  /* ── Ad Sources ────────────────────────────────────────────────── */
  // Map each test to its IAB compliance ad files (copied to compliance-ads/).
  // If the compliance ads aren't co-located, these should be updated to point
  // to a running local server serving the InteractiveAdvertisingBureau repo.
  function getAdUrl(test) {
    // Paths are relative to examples/ (where mraid-wrapper.html lives).
    // The compliance ad folders live at examples/compliance-ads/<name>/.
    const paths = {
      loadandevents:     'compliance-ads/loadandevents/ad.html',
      'resize-negative': 'compliance-ads/resize-negative/resize-test.html',
      'resize-positive': 'compliance-ads/resize-positive/resize-test.html',
      viewability:       'compliance-ads/viewability/ad.html',
    };
    return paths[test.id] || '';
  }

  /* ── Runner Constants ──────────────────────────────────────────── */
  // 45s (was 30s). resize-negative is measured at ~26-35s runtime; the previous
  // 30s ceiling flapped across the boundary and silently truncated the suite.
  // Named constant + documented rationale per review §9.
  const TEST_OBSERVATION_WINDOW_MS = 45000;

  // Baseline artifact schema version. Bump on any change to the shape emitted
  // by __SHARC_HARNESS_RESULTS__ / exportResults() (additive or breaking).
  // Inline-only — no separate JSON Schema file until the artifact corpus is
  // large enough to warrant validation (per review Decision 3).
  //   v1: initial three-layer artifact (compliance matrix, console stream,
  //       protocol trace), per-suite verdict, totals.{pass,fail,checks,...}.
  //   v2: adds per-suite `acceptedDivergences[]` (fails reclassified as
  //       expected spec divergence per ADR), per-suite
  //       `summary.acceptedDivergences`, and `totals.acceptedDivergences`.
  //       Adds per-test `manualNote` rendering into suite notes for
  //       `interactive: true` suites.
  const HARNESS_SCHEMA_VERSION = 2;

  /* ── State ─────────────────────────────────────────────────────── */
  let container = null;
  let currentTest = null;
  let testsRunning = false;
  let testResults = {};

  // Per-run monotonic seq counter for protocol trace / console stream ordering.
  // Wall-clock timestamps are explicitly NOT captured into the artifact —
  // they would produce false-red diffs across runs. See review §9.
  let globalSeq = 0;

  // Per-test result accumulator. Keyed by test.id. Populated during runTest(),
  // finalized at the end of observeComplianceAd(). Mirrored onto
  // window.__SHARC_HARNESS_RESULTS__ for headless capture and Export JSON.
  const suiteResults = {};

  // Global results container, exposed for headless capture (e.g. Puppeteer).
  // Shape documented inline below and in docs/reviews/mraid-compliance-harness-2026-04-11.md.
  window.__SHARC_HARNESS_RESULTS__ = {
    schemaVersion: HARNESS_SCHEMA_VERSION,
    runId: null,
    sharcVersion: (window.SHARC && window.SHARC.Protocol && window.SHARC.Protocol.SHARC_VERSION) || '0.0.0',
    capturedAt: null,
    runFinishedAt: null,
    userAgent: navigator.userAgent,
    environment: {
      maxWaitMs: TEST_OBSERVATION_WINDOW_MS,
    },
    suites: suiteResults,
    totals: null,
  };

  /* ── Build Test List UI ────────────────────────────────────────── */
  const testListEl = document.getElementById('testList');
  TESTS.forEach(test => {
    const item = document.createElement('div');
    item.className = 'test-item';
    item.id = 'test-' + test.id;
    item.innerHTML = `
      <div class="test-name">
        <div class="test-title">${test.title}</div>
        <div class="test-desc">${test.desc}</div>
      </div>
      <span class="status pending" id="status-${test.id}">Pending</span>
      <button class="btn btn-primary" onclick="runTest('${test.id}')">Run</button>
    `;
    testListEl.appendChild(item);
  });

  /* ── Logging ───────────────────────────────────────────────────── */
  const logEl = document.getElementById('protocolLog');

  function ts() {
    const d = new Date();
    return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}.${pad(d.getMilliseconds(),3)}`;
  }

  function pad(n, w = 2) { return String(n).padStart(w, '0'); }

  function logMsg(dir, type, args) {
    const empty = logEl.querySelector('div[style]');
    if (empty) empty.remove();

    const dirs = { cntr: '▼CNT', crtv: '▲CRT', sys: 'SYS', ok: '✓OK', err: '✗ERR' };
    let argsStr = '';
    if (args && typeof args === 'object' && Object.keys(args).length) {
      try { argsStr = JSON.stringify(args, null, 2).slice(0, 200); } catch(e) { argsStr = String(args); }
    } else if (args) argsStr = String(args);

    const entry = document.createElement('div');
    entry.className = `log-entry log-${dir}`;
    entry.innerHTML = `
      <div class="log-ts">${ts()}</div>
      <div class="log-dir">${dirs[dir] || dir}</div>
      <div class="log-body">
        <div class="log-type">${esc(type)}</div>
        ${argsStr ? `<div class="log-args">${esc(argsStr)}</div>` : ''}
      </div>`;
    logEl.appendChild(entry);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function logSys(text) { logMsg('sys', text); }
  function logOk(text)  { logMsg('ok',  text); }
  function logErr(text) { logMsg('err', text); }

  function clearLog() { logEl.innerHTML = '<div style="padding:40px;text-align:center;color:#444;">Log cleared</div>'; }
  function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  /* ── Console Capture Bridge ───────────────────────────────────── */
  // mraid-wrapper.html installs an in-realm console shim (gated on ?harness=1)
  // that forwards every console.log/warn/error call here via postMessage. This
  // is the only viable capture path — console objects are per-realm and the
  // parent cannot observe the child realm's console directly. See review §4.
  //
  // The shim tags each message with suite (the test.id passed in the creative URL)
  // so late-arriving messages during teardown still attach to the right accumulator.
  window.addEventListener('message', function (ev) {
    const data = ev.data;
    if (!data || data.source !== 'sharc-test-harness') return;
    if (data.kind !== 'console') return;

    const suiteId = data.suite || (currentTest && currentTest.id);
    if (!suiteId || !suiteResults[suiteId]) return;

    const acc = suiteResults[suiteId];
    const line = {
      seq: globalSeq++,
      level: data.level,
      raw: data.text,
    };

    // Parse IAB-ad self-reports. The compliance suites use two prefix conventions:
    //   loadandevents (aronmraid3.js): CHECK: ... / FAIL: ...
    //   resize-negative (EventTester): PASSED: ... / FAILED: ...
    // Slugify the message text (after the prefix) into a stable key so the same
    // check produces the same slug across runs — a prerequisite for diff-mode
    // pass criteria once an expected-results manifest exists.
    const m = /^(CHECK|FAIL|PASSED|FAILED):\s*(.+)$/.exec(data.text);
    if (m) {
      const kind = m[1];
      const body = m[2].trim();
      const slug = slugify(body);
      const status = (kind === 'CHECK' || kind === 'PASSED') ? 'pass' : 'fail';
      line.checkSlug = slug;
      line.status = status;
      acc.checks.push({ slug, status, text: body, kind });
      if (status === 'fail') acc.fails.push({ slug, text: body });
    }

    acc.consoleStream.push(line);

    // Mirror into the log pane for human debugging.
    const levelToDir = { error: 'err', warn: 'err', log: 'crtv', info: 'crtv' };
    logMsg(levelToDir[data.level] || 'sys', `[${suiteId}] ${data.level}: ${data.text.slice(0, 200)}`);
  });

  function slugify(s) {
    return String(s)
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/(^-|-$)/g, '')
      .slice(0, 80);
  }

  /* ── Run Single Test ───────────────────────────────────────────── */
  async function runTest(testId) {
    const test = TESTS.find(t => t.id === testId);
    if (!test) return;

    currentTest = test;
    setStatus(testId, 'running', 'Running...');
    logSys(`═══ Starting: ${test.title} ═══`);
    logSys(`Ad: ${test.adDir}`);

    // Fresh per-test accumulator. Shape mirrors the three-layer baseline artifact
    // from review §"Recommended Baseline Artifact Shape": compliance matrix
    // (checks), console stream (consoleStream), protocol trace (protocolTrace),
    // plus state history and container verdict.
    suiteResults[testId] = {
      testId,
      title: test.title,
      startedSeq: globalSeq,
      durationMs: null,
      containerVerdict: null,     // 'active' | 'error' | 'timeout' | 'closed'
      creativeStarted: false,
      stateReachedActive: false,
      hasFatalError: false,
      errorEvents: [],
      stateHistory: [],
      protocolTrace: [],
      consoleStream: [],
      checks: [],
      fails: [],
      // Fails reclassified as expected spec divergences per the test definition's
      // `acceptedDivergences` rules. These do NOT count toward the suite's fail
      // tally or verdict, but are preserved here for audit and so future runs
      // that newly satisfy the spec can be detected as a positive change.
      acceptedDivergences: [],
      summary: null,
      verdict: null,              // 'pass' | 'fail' | 'needs-manual' | 'harness-broken'
      notes: [],
    };

    // Tear down previous container and wait for it to actually finish closing.
    // The previous implementation called container.close() then slept 1500ms,
    // which raced teardown against the next test's handshake. See review §9.
    if (container) {
      try { await closeContainerAndAwait(container); }
      catch (e) { logErr('Error closing previous container: ' + e.message); }
      container = null;
    }

    const adUrl = getAdUrl(test);
    if (!adUrl) {
      logErr(`No ad URL configured for test: ${test.id}`);
      finalizeSuite(testId, 'fail', 'No URL', 'harness-broken');
      return;
    }

    const containerEl = document.getElementById('adSlot');
    containerEl.innerHTML = '';

    // Observation-window flags. These MUST be captured in the constructor
    // callbacks (not post-construction, which was the bug the review caught).
    // SHARCContainer stores onError / onStateChange in private fields and has
    // no public getter/setter — reassigning container.onError is a no-op.
    const acc = suiteResults[testId];
    const startedAt = performance.now();

    // Promise that resolves when either (a) the creative's self-reported lifecycle
    // ends via onClose, or (b) the observation window elapses. Replaces the
    // racey setInterval+setTimeout pair from the old implementation and cleans
    // up after itself (no interval leak — fix #11).
    let doneResolve;
    const donePromise = new Promise(r => { doneResolve = r; });
    let watchdog = null;
    function markDone(reason) {
      if (watchdog !== null) { clearTimeout(watchdog); watchdog = null; }
      if (doneResolve) { const r = doneResolve; doneResolve = null; r(reason); }
    }

    try {
      // Pass ?harness=1&suite=<id> so mraid-wrapper.html installs the console
      // shim and tags forwarded messages with the current suite id.
      const creativeUrl = `../mraid-wrapper.html?harness=1&suite=${encodeURIComponent(test.id)}&creative=${encodeURIComponent(adUrl)}`;

      container = new SHARC.Container({
        creativeUrl,
        containerEl,
        environmentData: {
          currentPlacement: {
            initialDefaultSize: { width: 320, height: 480 },
            maxExpandSize: { width: window.innerWidth, height: window.innerHeight },
            viewportSize: { width: window.innerWidth, height: window.innerHeight },
          },
          isMuted: false,
          volume: 1.0,
        },
        supportedFeatures: [
          { name: 'com.iabtechlab.sharc.mraid', version: '3.0' },
        ],
        autoStart: true,
        visible: false,
        // Callbacks close over `acc` — the per-test accumulator — so every
        // state transition, protocol message, and error is recorded into the
        // right suite. This is the fix for the review's CRITICAL Finding 2:
        // the old runner reassigned container.onError AFTER construction,
        // against a non-existent public property, so the booleans never flipped.
        onStateChange: (state, prev) => {
          acc.stateHistory.push([prev || null, state]);
          if (state === 'active') acc.stateReachedActive = true;
          logMsg('sys', `State: ${prev || '—'} → ${state}`);
        },
        onClose: () => {
          logOk('Container closed');
          acc.containerVerdict = acc.containerVerdict || 'closed';
          container = null;
          markDone('closed');
        },
        onError: (code, msg) => {
          acc.hasFatalError = true;
          acc.errorEvents.push({ seq: globalSeq++, code, msg });
          acc.containerVerdict = 'error';
          logErr(`Error ${code}: ${msg}`);
        },
        onNavigation: (args) => {
          logMsg('crtv', 'Creative:requestNavigation', args);
        },
        onInteraction: (uris) => {
          logMsg('crtv', 'Creative:reportInteraction', { uris });
        },
        onMessage: (direction, msg) => {
          if (!msg) return;
          const type = msg.type || '?';
          // Record into protocol trace — strip nothing structurally here, but
          // nonces (sessionId / messageId) and wall-clock ts() stamps are
          // excluded: they would produce false-red diffs (review §9).
          acc.protocolTrace.push({
            seq: globalSeq++,
            dir: direction,
            type,
            args: msg.args || {},
          });
          const dir = direction === 'received'
            ? (type.includes('Container') ? 'cntr' : 'crtv')
            : 'ok';
          logMsg(dir, type, msg.args || {});
          // creative:started is the signal that startCreative landed — mark it.
          if (type && /start/i.test(type)) acc.creativeStarted = true;
        },
      });

      // CRITICAL: actually load the iframe. The previous runner never called
      // this, so the handshake never ran and every test resolved 'fail' by
      // timeout. See review CRITICAL Finding 1.
      container.load();
    } catch (e) {
      logErr(`Container creation failed: ${e.message}`);
      finalizeSuite(testId, 'fail', 'Failed', 'harness-broken');
      return;
    }

    // Start the observation watchdog. Resolves on first of:
    //   - container.onClose firing (creative completed lifecycle)
    //   - TEST_OBSERVATION_WINDOW_MS elapsing
    watchdog = setTimeout(() => {
      acc.containerVerdict = acc.containerVerdict || 'timeout';
      markDone('timeout');
    }, TEST_OBSERVATION_WINDOW_MS);

    const reason = await donePromise;
    acc.durationMs = Math.round(performance.now() - startedAt);

    // Compute the verdict. This replaces the old coarse two-bit heuristic with
    // a result-backed decision (review Finding 3, §Recommended Artifact Shape):
    //   - harness-broken: zero signal captured (neither checks nor reached active)
    //                     → almost certainly the harness wiring is off, not the ad
    //   - fail:           any FAIL/FAILED seen or fatal onError fired
    //   - needs-manual:   reached active, no fails, but zero checks + known
    //                     interactive suite → downstream manual runbook required
    //   - pass:           reached active, at least one check captured, zero fails
    // Sift fails through the test definition's `acceptedDivergences` rules
    // before scoring. Matching fails are moved off acc.fails and onto
    // acc.acceptedDivergences with their ADR reference, so the verdict reflects
    // current spec-vs-implementation policy rather than a fixed compliance
    // snapshot. Any UNexpected fail (or a fail that newly fails to match) still
    // counts and produces a 'fail' verdict.
    if (test.acceptedDivergences && test.acceptedDivergences.length > 0) {
      const remaining = [];
      for (const f of acc.fails) {
        const slug = (f && f.slug) || '';
        const rule = test.acceptedDivergences.find(r => r.slugMatch.test(slug));
        if (rule) {
          acc.acceptedDivergences.push({
            slug,
            text: (f && f.text) || '',
            adrRef: rule.adrRef,
            rationale: rule.rationale,
          });
        } else {
          remaining.push(f);
        }
      }
      acc.fails = remaining;
      if (acc.acceptedDivergences.length > 0) {
        const refs = [...new Set(acc.acceptedDivergences.map(d => d.adrRef))].join(', ');
        acc.notes.push(
          `Reclassified ${acc.acceptedDivergences.length} fail(s) as accepted spec divergence per ${refs}. ` +
          `See suite.acceptedDivergences for slugs and rationales.`
        );
      }
    }

    const passCount = acc.checks.filter(c => c.status === 'pass').length;
    const failCount = acc.fails.length;
    const divergenceCount = acc.acceptedDivergences.length;
    acc.summary = {
      pass: passCount,
      fail: failCount,
      total: acc.checks.length,
      acceptedDivergences: divergenceCount,
    };

    let verdict, statusText;
    if (acc.hasFatalError || failCount > 0) {
      verdict = 'fail';
      statusText = `Failed (${failCount})`;
    } else if (!acc.stateReachedActive) {
      verdict = 'harness-broken';
      statusText = 'Harness';
    } else if (passCount === 0) {
      // Reached active, no fails, no checks captured. For an interactive
      // suite (loadandevents, viewability) this is the expected "bootstrapped
      // successfully, awaiting human verification" outcome. For others it's a
      // wiring problem.
      if (test.interactive) {
        verdict = 'needs-manual';
        statusText = 'Manual';
        acc.notes.push(
          test.manualNote ||
          'Interactive suite: manual review required. See docs/research/mraid-compliance-manual-runbook.md.'
        );
      } else {
        verdict = 'harness-broken';
        statusText = 'No signal';
      }
    } else {
      verdict = 'pass';
      statusText = divergenceCount > 0
        ? `Passed (${passCount}, +${divergenceCount} accepted divergence)`
        : `Passed (${passCount})`;
    }
    acc.verdict = verdict;

    logSys(`Verdict: ${verdict} — reason: ${reason}, pass=${passCount}, fail=${failCount}, duration=${acc.durationMs}ms`);

    // Map verdict to status badge state. 'needs-manual' shows as running-color.
    const badgeState = verdict === 'pass' ? 'pass'
                     : verdict === 'fail' ? 'fail'
                     : verdict === 'needs-manual' ? 'running'
                     : 'fail';
    finalizeSuite(testId, badgeState, statusText, verdict);

    // Ensure the container is actually torn down before returning so runAllTests
    // does not start the next test's handshake against a half-open iframe.
    if (container) {
      try { await closeContainerAndAwait(container); } catch (e) {}
      container = null;
    }
  }

  /* ── Teardown Helper ──────────────────────────────────────────── */
  // Requests close and waits for the onClose callback (or a short grace period)
  // so the next test's handshake does not race the previous iframe's teardown.
  // Replaces the old `await sleep(1500)` constant (review §9).
  function closeContainerAndAwait(c) {
    return new Promise((resolve) => {
      let settled = false;
      const settle = () => { if (!settled) { settled = true; resolve(); } };
      // If the container exposes onClose, hook it via a short-lived listener.
      // Otherwise fall back to a 500ms grace window — still bounded, no busy poll.
      try {
        // We cannot reach into the container's callback post-construction (see
        // review Finding 2 on absent public setters). Instead, rely on the
        // runTest-scoped onClose callback which flips `container = null` and
        // call markDone. Here we just poll for that nulling, bounded to 1500ms.
        c.close();
      } catch (e) { /* ignore */ }
      const start = performance.now();
      const iv = setInterval(() => {
        if (container === null || performance.now() - start > 1500) {
          clearInterval(iv);
          settle();
        }
      }, 50);
    });
  }

  /* ── Finalize Single Suite ────────────────────────────────────── */
  function finalizeSuite(testId, badgeState, text, verdict) {
    setStatus(testId, badgeState, text);
    if (suiteResults[testId]) {
      suiteResults[testId].verdict = suiteResults[testId].verdict || verdict;
    }
  }

  /* ── Run All Tests ─────────────────────────────────────────────── */
  async function runAllTests() {
    if (testsRunning) return;
    testsRunning = true;
    document.getElementById('btnRunAll').disabled = true;
    document.getElementById('btnExport').disabled = true;

    // Reset the run header. Individual test runs before a Run All are still
    // preserved as artifacts but will be overwritten as each test re-executes.
    window.__SHARC_HARNESS_RESULTS__.runId = new Date().toISOString() + '-' + Math.random().toString(16).slice(2, 6);
    window.__SHARC_HARNESS_RESULTS__.capturedAt = new Date().toISOString();
    window.__SHARC_HARNESS_RESULTS__.runFinishedAt = null;
    // Re-read sharcVersion at run time. The harness object is initialized in a
    // classic <script> that executes before the deferred sharc-protocol.js
    // module, so window.SHARC isn't populated during that initial read and the
    // fallback '0.0.0' ends up in the artifact. By the time runAllTests() is
    // clicked (or fired by the autorun hook) the module has loaded.
    window.__SHARC_HARNESS_RESULTS__.sharcVersion =
      (window.SHARC && window.SHARC.Protocol && window.SHARC.Protocol.SHARC_VERSION) ||
      window.__SHARC_HARNESS_RESULTS__.sharcVersion;

    for (const test of TESTS) {
      await runTest(test.id);
    }

    // Compute totals across all suites.
    let totalPass = 0, totalFail = 0, totalChecks = 0, totalDiv = 0, manual = 0, broken = 0;
    Object.values(suiteResults).forEach(s => {
      totalPass += (s.summary && s.summary.pass) || 0;
      totalFail += (s.summary && s.summary.fail) || 0;
      totalChecks += (s.summary && s.summary.total) || 0;
      totalDiv += (s.acceptedDivergences && s.acceptedDivergences.length) || 0;
      if (s.verdict === 'needs-manual') manual++;
      if (s.verdict === 'harness-broken') broken++;
    });
    window.__SHARC_HARNESS_RESULTS__.totals = {
      pass: totalPass,
      fail: totalFail,
      checks: totalChecks,
      acceptedDivergences: totalDiv,
      needsManual: manual,
      harnessBroken: broken,
    };
    window.__SHARC_HARNESS_RESULTS__.runFinishedAt = new Date().toISOString();

    testsRunning = false;
    document.getElementById('btnRunAll').disabled = false;
    document.getElementById('btnExport').disabled = false;

    const passedSuites = TESTS.filter(t => testResults[t.id] === 'pass').length;
    logSys(`═══ Run complete: ${passedSuites}/${TESTS.length} suites green, ${totalPass} checks passed, ${totalFail} failed, ${manual} manual, ${broken} broken ═══`);
  }

  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

  /* ── Export Results ───────────────────────────────────────────── */
  // Serializes window.__SHARC_HARNESS_RESULTS__ to a downloadable JSON file.
  // Filename encodes local timestamp for human-sortable baseline archives.
  // This is the secondary affordance — primary mechanism is the global itself,
  // which a headless capture script (Puppeteer/Playwright) can read after
  // waiting on runFinishedAt.
  function exportResults() {
    const data = window.__SHARC_HARNESS_RESULTS__;
    if (!data || !data.runFinishedAt) {
      alert('No completed run to export. Click "Run All" first.');
      return;
    }
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const now = new Date();
    const pad2 = n => String(n).padStart(2, '0');
    const ts = `${now.getFullYear()}-${pad2(now.getMonth()+1)}-${pad2(now.getDate())}-${pad2(now.getHours())}${pad2(now.getMinutes())}${pad2(now.getSeconds())}`;
    const a = document.createElement('a');
    a.href = url;
    a.download = `sharc-mraid3-baseline-${ts}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  /* ── Headless Auto-Run Hook ───────────────────────────────────── */
  // When the page is opened with ?autorun=1, kick Run All after a short delay
  // so headless smoke tests (and Puppeteer/Playwright captures) don't need to
  // click the button. The results land on window.__SHARC_HARNESS_RESULTS__ and
  // also get dumped into a <pre id="__sharc_autorun_dump"> node for
  // `chrome --dump-dom` style observability.
  if (/[?&]autorun=1\b/.test(location.search)) {
    const dump = document.createElement('pre');
    dump.id = '__sharc_autorun_dump';
    dump.style.cssText = 'position:fixed;bottom:0;left:0;right:0;max-height:30vh;overflow:auto;background:#000;color:#0f0;font-size:10px;padding:8px;z-index:99999;white-space:pre-wrap;';
    dump.textContent = 'autorun: pending';
    document.body.appendChild(dump);
    setTimeout(async () => {
      await runAllTests();
      dump.textContent = 'SHARC_AUTORUN_RESULT_BEGIN\n' +
        JSON.stringify({
          totals: window.__SHARC_HARNESS_RESULTS__.totals,
          runFinishedAt: window.__SHARC_HARNESS_RESULTS__.runFinishedAt,
          suites: Object.fromEntries(Object.entries(suiteResults).map(([k, s]) => [k, {
            verdict: s.verdict,
            checks: s.checks.length,
            fails: s.fails.length,
            passes: s.checks.filter(c => c.status === 'pass').length,
            stateHistory: s.stateHistory,
            protocolTraceLen: s.protocolTrace.length,
            consoleStreamLen: s.consoleStream.length,
            errorEvents: s.errorEvents,
            notes: s.notes,
            firstFewConsoleLines: s.consoleStream.slice(0, 10).map(l => `${l.level}: ${l.raw.slice(0, 120)}`),
          }])),
        }, null, 2) +
        '\nSHARC_AUTORUN_RESULT_END';
    }, 500);
  }

  /* ── Status Helpers ───────────────────────────────────────────── */
  function setStatus(testId, state, text) {
    const el = document.getElementById('status-' + testId);
    if (el) {
      el.className = 'status ' + state;
      el.textContent = text;
    }
    testResults[testId] = state;
  }
</script>
</body>
