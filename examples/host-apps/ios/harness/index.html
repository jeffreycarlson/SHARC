<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>SHARC G6 iOS Walking Skeleton</title>
<style>
  body { margin: 0; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; background: #101820; color: #f4f7fb; }
  #status { padding: 10px; }
  .slot { width: 300px; height: 250px; margin: 10px; border: 1px solid #586678; background: #fff; }
</style>
</head>
<body>
<div id="status">Starting SHARC G6 iOS harness...</div>
<div id="placement-host"></div>
<script type="module">
import { SHARCContainer } from '/dist/sharc-container.mjs';

const SOURCE_URL_LIFECYCLE = 'tools/creative-validator/fixtures/url-lifecycle-gates/cleaned-corpus.fixture.json';
const SOURCE_MRAID_MARKUP_PUBLIC = 'examples/host-apps/ios/harness/fixtures/g6-mraid-markup.html';
const params = new URLSearchParams(location.search);
const creativeOrigin = params.get('creativeOrigin') || 'http://localhost:18867';
const rendererOrigin = params.get('rendererOrigin') || 'http://localhost:18866';
const mraidCorpus = params.get('mraidCorpus');
const statusEl = document.getElementById('status');
const placementHost = document.getElementById('placement-host');
let activeContainer = null;
let activeObservation = null;

function post(value) {
  const handler = window.webkit
    && window.webkit.messageHandlers
    && window.webkit.messageHandlers.sharcHarness;
  if (handler && typeof handler.postMessage === 'function') {
    handler.postMessage(value);
  } else {
    console.log(JSON.stringify(value));
  }
}

function fixtureUrl(path) {
  return new URL(path, creativeOrigin + '/').href;
}

function rendererUrl(path = 'examples/renderer/') {
  return new URL(path, rendererOrigin + '/').href;
}

function rewriteFixtureUrl(url) {
  const parsed = new URL(url);
  return fixtureUrl(parsed.pathname.replace(/^\//, '') + parsed.search);
}

async function fetchText(path) {
  const response = await fetch('/' + path);
  if (!response.ok) throw new Error(`Failed to load ${path}: HTTP ${response.status}`);
  return response.text();
}

function parseJsonl(text, path) {
  return text
    .split('\n')
    .map((line) => line.trim())
    .filter(Boolean)
    .map((line, index) => {
      try {
        return JSON.parse(line);
      } catch (err) {
        throw new Error(`Failed to parse ${path} line ${index + 1}: ${err.message}`);
      }
    });
}

function caseFromAuction(row, rowIndex, auction) {
  const request = auction.bid_request || {};
  const imp = request.imp && request.imp[0] ? request.imp[0] : {};
  const bid = (((auction.bid_response || {}).seatbid || [])[0] || {}).bid || [];
  const firstBid = bid[0] || {};
  const apis = ((imp.banner || {}).api || []).slice();
  return {
    source: {
      sourceFile: SOURCE_URL_LIFECYCLE,
      rowIndex,
      bidder: auction.bidder || null,
      mtype: auction.mtype || null,
    },
    ids: {
      bidId: firstBid.id || null,
      crid: firstBid.crid || null,
    },
    creativeUrl: firstBid.curl ? rewriteFixtureUrl(firstBid.curl) : null,
    declaredApis: apis,
    requireSharcInit: apis.includes(10),
  };
}

async function loadUrlLifecycleCases() {
  const response = await fetch('/' + SOURCE_URL_LIFECYCLE);
  const rows = await response.json();
  const cases = [];
  rows.forEach((row, rowIndex) => {
    (row.auction || []).forEach((auction) => {
      cases.push(caseFromAuction(row, rowIndex, auction));
    });
  });
  return cases;
}

function g5BrowserCases() {
  return [
    {
      source: { sourceFile: 'test/browser/fixtures/g5-url-mode/g5-f1-creative.html', rowIndex: 0, bidder: 'g5-f1-sharc-url', mtype: 'banner' },
      ids: { bidId: 'g5-f1-sharc-url', crid: 'g5-f1-creative' },
      creativeUrl: fixtureUrl('test/browser/fixtures/g5-url-mode/g5-f1-creative.html'),
      requireSharcInit: true,
      expected: 'passed',
    },
    {
      source: { sourceFile: 'test/browser/fixtures/g5-url-mode/g5-f2-plain-html.html', rowIndex: 1, bidder: 'g5-f2-plain-html', mtype: 'banner' },
      ids: { bidId: 'g5-f2-plain-html', crid: 'g5-f2-creative' },
      creativeUrl: fixtureUrl('test/browser/fixtures/g5-url-mode/g5-f2-plain-html.html'),
      requireSharcInit: false,
      expected: 'passed',
    },
    {
      source: { sourceFile: 'test/browser/fixtures/g5-url-mode/g5-f5-mraid-expecting.html', rowIndex: 2, bidder: 'g5-f5-mraid-expecting', mtype: 'banner' },
      ids: { bidId: 'g5-f5-mraid-expecting', crid: 'g5-f5-creative' },
      creativeUrl: fixtureUrl('test/browser/fixtures/g5-url-mode/g5-f5-mraid-expecting.html'),
      requireSharcInit: false,
      expected: 'url-declared-api-unsupported',
    },
    {
      source: { sourceFile: 'test/browser/fixtures/g5-url-mode/g5-f9-redirect.html', rowIndex: 3, bidder: 'g5-f9-redirect', mtype: 'banner' },
      ids: { bidId: 'g5-f9-redirect', crid: 'g5-f9-creative' },
      creativeUrl: fixtureUrl('test/browser/fixtures/g5-url-mode/g5-f9-redirect.html'),
      requireSharcInit: false,
      expected: 'navigation-policy',
    },
  ];
}

function g6Phase2Cases() {
  return [
    {
      source: { sourceFile: 'examples/host-apps/ios/harness/fixtures/g6-lifecycle-roundtrip', rowIndex: 0, bidder: 'g6-ios-lifecycle-roundtrip', mtype: 'banner' },
      ids: { bidId: 'g6-ios-lifecycle-roundtrip', crid: 'g6-ios-lifecycle-roundtrip' },
      creativeUrl: fixtureUrl('test/browser/fixtures/g5-url-mode/g5-f1-creative.html'),
      requireSharcInit: true,
      phase2: 'lifecycle',
    },
    {
      source: { sourceFile: 'examples/host-apps/ios/harness/fixtures/g6-port-exfil-navigation.html', rowIndex: 1, bidder: 'g6-ios-port-exfil-navigation', mtype: 'banner' },
      ids: { bidId: 'g6-ios-port-exfil-navigation', crid: 'g6-ios-port-exfil-navigation' },
      creativeUrl: fixtureUrl('examples/host-apps/ios/harness/fixtures/g6-port-exfil-navigation.html'),
      requireSharcInit: true,
      phase2: 'port-exfil',
      expected: 'navigation-policy',
    },
    {
      source: { sourceFile: 'examples/host-apps/ios/harness/fixtures/g6-expand-collapse.html', rowIndex: 2, bidder: 'g6-ios-expand-collapse', mtype: 'banner' },
      ids: { bidId: 'g6-ios-expand-collapse', crid: 'g6-ios-expand-collapse' },
      creativeUrl: fixtureUrl('examples/host-apps/ios/harness/fixtures/g6-expand-collapse.html'),
      requireSharcInit: true,
      phase2: 'expand-collapse',
    },
  ];
}

async function g6MraidMarkupCases() {
  const creativeHtml = await fetchText(SOURCE_MRAID_MARKUP_PUBLIC);
  return [
    {
      source: { sourceFile: SOURCE_MRAID_MARKUP_PUBLIC, rowIndex: 0, bidder: 'g6-ios-mraid-markup', mtype: 'banner' },
      ids: { bidId: 'g6-ios-mraid-markup', crid: 'g6-ios-mraid-markup' },
      creativeHtml,
      creativeRendererUrl: rendererUrl(),
      width: 300,
      height: 250,
      placementType: 'inline',
      bridges: ['mraid'],
      creativeMeta: { apis: [5] },
      requireSharcInit: false,
      phase2: 'mraid-markup',
    },
  ];
}

function includesMraid(testCase) {
  const declared = testCase && testCase.expectations && Array.isArray(testCase.expectations.declared)
    ? testCase.expectations.declared
    : [];
  const sniffed = testCase && testCase.expectations && Array.isArray(testCase.expectations.sniffed)
    ? testCase.expectations.sniffed
    : [];
  const apis = testCase
    && testCase.sharcOptions
    && testCase.sharcOptions.creativeMeta
    && Array.isArray(testCase.sharcOptions.creativeMeta.apis)
    ? testCase.sharcOptions.creativeMeta.apis
    : [];
  return declared.includes('mraid') || sniffed.includes('mraid') || apis.some((api) => api === 3 || api === 5 || api === 6);
}

function corpusMraidCaseFromNormalized(testCase) {
  const creative = testCase.creative || {};
  const sharcOptions = testCase.sharcOptions || {};
  const creativeMeta = sharcOptions.creativeMeta || {};
  const width = Number.isFinite(creative.width) ? creative.width : 320;
  const height = Number.isFinite(creative.height) ? creative.height : 50;
  return {
    source: testCase.source || {},
    ids: testCase.ids || {},
    creativeHtml: creative.html || '',
    creativeRendererUrl: rendererUrl(),
    width,
    height,
    placementType: creative.placementType || sharcOptions.placementType || 'inline',
    bridges: includesMraid(testCase) ? ['mraid'] : [],
    creativeMeta,
    requireSharcInit: sharcOptions.requireSharcInit === true,
    phase2: 'mraid-corpus',
  };
}

async function loadMraidCorpusCases() {
  if (!mraidCorpus) return [];
  const text = await fetchText(mraidCorpus.replace(/^\//, ''));
  return parseJsonl(text, mraidCorpus).map(corpusMraidCaseFromNormalized);
}

function reportRow(testCase, outcome) {
  return {
    case: {
      source: testCase.source,
      ids: testCase.ids,
    },
    outcome,
  };
}

function hasLog(observation, prefix) {
  return observation.logs.some((message) => message.indexOf(prefix) === 0);
}

function hasFatalSecuritySignal(observation) {
  return observation.errors.length > 0
    || observation.securityEvents.some((event) =>
      event && (
        event.errorCode === 2118
        || event.type === 'unauthorized_navigation'
        || event.type === 'renderer_failed'
        || event.type === 'bridge_load_failed'
        || event.type === 'feature_load_failed'
      ));
}

function hasSecurityEvent(observation, type) {
  return observation.securityEvents.some((event) => event && event.type === type);
}

function hasRendererSubtype(observation, subtype) {
  return observation.securityEvents.some((event) =>
    event
      && event.type === 'renderer_protocol_error'
      && event.details
      && event.details.subtype === subtype);
}

function classifyKnownFixture(testCase, observation) {
  if (observation.errors.some((err) => err.code === 2118)) {
    return { status: 'failed', bucket: 'navigation-policy', reason: 'unauthorized navigation' };
  }
  if (observation.errors.some((err) => err.code === 2212)) {
    return { status: 'failed', bucket: 'declared-sharc-no-handshake', reason: 'createSession timeout' };
  }
  if (testCase.ids.bidId === 'bid-url-load-failed') {
    return { status: 'failed', bucket: 'url-load-failed', reason: 'creative URL load failed' };
  }
  if (testCase.expected === 'url-declared-api-unsupported') {
    return { status: 'failed', bucket: 'url-declared-api-unsupported', reason: 'declared API unsupported on URL path' };
  }
  if (testCase.expected === 'navigation-policy') {
    return { status: 'failed', bucket: 'navigation-policy', reason: 'unauthorized navigation' };
  }
  if (observation.ready || testCase.requireSharcInit === false) {
    return { status: 'passed', bucket: 'passed', reason: null };
  }
  return { status: 'failed', bucket: 'declared-sharc-no-handshake', reason: 'createSession timeout' };
}

function classifyPhase2Fixture(testCase, observation) {
  if (testCase.phase2 === 'lifecycle') {
    const states = observation.states.map((entry) => entry.next);
    const frozenIndex = states.indexOf('frozen');
    const activeAfterFrozen = frozenIndex !== -1
      && states.slice(frozenIndex + 1).includes('active');
    const sawNativeRoundTrip = observation.hostLifecycleEvents.includes('hidden')
      && observation.hostLifecycleEvents.includes('frozen')
      && observation.hostLifecycleEvents.includes('active');
    if (observation.ready && hasLog(observation, 'g5f1:ev:')
        && frozenIndex !== -1 && activeAfterFrozen && sawNativeRoundTrip) {
      return { status: 'passed', bucket: 'passed', reason: null };
    }
    return {
      status: 'failed',
      bucket: 'declared-sharc-no-handshake',
      reason: 'host lifecycle round-trip did not reassert active; states='
        + JSON.stringify(states)
        + '; host=' + JSON.stringify(observation.hostLifecycleEvents),
    };
  }

  if (testCase.phase2 === 'port-exfil') {
    const got2118 = observation.errors.some((err) => err.code === 2118)
      || observation.securityEvents.some((event) => event.type === 'unauthorized_navigation'
        || event.errorCode === 2118);
    const stolenDelivered = hasLog(observation, 'g6exfil:stolen-port-delivered:');
    if (got2118 && !stolenDelivered) {
      return { status: 'failed', bucket: 'navigation-policy', reason: 'unauthorized navigation' };
    }
    return {
      status: 'failed',
      bucket: 'declared-sharc-no-handshake',
      reason: stolenDelivered ? 'stolen port delivered after navigation' : 'unauthorized navigation was not detected',
    };
  }

  if (testCase.phase2 === 'expand-collapse') {
    const sawExpandResolve = hasLog(observation, 'g6expand:expand-resolved:');
    const sawCollapseResolve = hasLog(observation, 'g6expand:collapse-resolved:');
    const sawHostExpand = observation.placementChanges.some((change) => change.intent === 'expand');
    const sawHostCollapse = observation.placementChanges.some((change) => change.intent === null);
    if (observation.ready && sawExpandResolve && sawCollapseResolve
        && sawHostExpand && sawHostCollapse) {
      return { status: 'passed', bucket: 'passed', reason: null };
    }
    return {
      status: 'failed',
      bucket: 'declared-sharc-no-handshake',
      reason: 'expand/collapse placement round-trip did not complete',
    };
  }

  if (testCase.phase2 === 'mraid-markup' || testCase.phase2 === 'mraid-corpus') {
    if (observation.errors.some((err) => err.code === 2118)
        || observation.securityEvents.some((event) => event.errorCode === 2118 || event.type === 'unauthorized_navigation')) {
      return { status: 'failed', bucket: 'navigation-policy', reason: 'unauthorized navigation' };
    }
    if (observation.securityEvents.some((event) => event.type === 'bridge_load_failed')) {
      return { status: 'failed', bucket: 'bridge-missing', reason: 'bridge failed to load' };
    }
    if (hasRendererSubtype(observation, 'timeout') || observation.errors.some((err) => err.code === 2114)) {
      return { status: 'failed', bucket: 'renderer-timeout', reason: 'renderer timed out' };
    }
    if (hasRendererSubtype(observation, 'integrity_failed')) {
      return { status: 'failed', bucket: 'renderer-integrity', reason: 'renderer integrity failed' };
    }
    if (hasSecurityEvent(observation, 'renderer_origin_mismatch')) {
      return { status: 'failed', bucket: 'renderer-origin', reason: 'renderer origin mismatch' };
    }
    if (hasRendererSubtype(observation, 'malformed_payload')
        || hasRendererSubtype(observation, 'post_failed')
        || hasSecurityEvent(observation, 'renderer_failed')) {
      return { status: 'failed', bucket: 'renderer-protocol', reason: 'renderer protocol error' };
    }
    const reachedActive = observation.states.some((entry) => entry.next === 'active');
    const reachedReady = observation.states.some((entry) => entry.next === 'ready');
    if (!hasFatalSecuritySignal(observation) && (reachedActive || reachedReady)) {
      return { status: 'passed', bucket: 'passed', reason: 'creative rendered without fatal signals' };
    }
    return { status: 'failed', bucket: 'inconclusive', reason: 'no terminal success signal' };
  }

  return classifyKnownFixture(testCase, observation);
}

function makeEnvironmentData(testCase) {
  const width = testCase.width || 300;
  const height = testCase.height || 250;
  const viewportWidth = Math.max(width, window.innerWidth || width);
  const viewportHeight = Math.max(height, window.innerHeight || height);
  return {
    currentPlacement: {
      initialDefaultSize: { width, height },
      minDefaultSize: { width, height },
      maxDefaultSize: { width, height },
      maxExpandSize: { width: viewportWidth, height: viewportHeight },
      viewportSize: { width: viewportWidth, height: viewportHeight },
    },
    dataspec: { model: 'AdCOM', ver: '1.0' },
    data: {
      ad: { id: testCase.ids.crid || testCase.ids.bidId || 'g6-ios-mraid' },
      isMuted: false,
      volume: 1,
      placement: {
        tagid: testCase.ids.bidId || 'g6-ios-mraid-placement',
        instl: testCase.placementType === 'interstitial' ? 1 : 0,
      },
    },
    containerNavigation: { navigationPossible: true, navigationAllowed: true },
    isMuted: false,
    volume: 1,
  };
}

function timeoutsForCase(testCase) {
  const rendererTimeout = testCase.phase2 === 'mraid-corpus' ? 30_000 : 10_000;
  return {
    rendererLoad: rendererTimeout,
    rendererReply: rendererTimeout,
    createSession: 1200,
    initResolve: 1200,
    startResolve: 1200,
    closeSequence: 800,
  };
}

function runCase(testCase) {
  return new Promise((resolve) => {
    placementHost.replaceChildren();
    const placement = document.createElement('div');
    placement.className = 'slot';
    if (testCase.width) placement.style.width = `${testCase.width}px`;
    if (testCase.height) placement.style.height = `${testCase.height}px`;
    placementHost.appendChild(placement);

    const observation = {
      states: [],
      logs: [],
      errors: [],
      securityEvents: [],
      placementChanges: [],
      hostLifecycleEvents: [],
      ready: false,
      finished: false,
    };

    let container = null;
    let doneTimer = null;
    function finish() {
      if (observation.finished) return;
      observation.finished = true;
      clearTimeout(doneTimer);
      try { if (container) container.close(); } catch (_) {}
      if (activeContainer === container) activeContainer = null;
      if (activeObservation === observation) activeObservation = null;
      const classifier = testCase.phase2 ? classifyPhase2Fixture : classifyKnownFixture;
      if (testCase.phase2 === 'port-exfil') {
        setTimeout(() => resolve(reportRow(testCase, classifier(testCase, observation))), 50);
        return;
      }
      resolve(reportRow(testCase, classifier(testCase, observation)));
    }

    try {
      const containerOptions = {
        creativeUrl: testCase.creativeUrl,
        creativeHtml: testCase.creativeHtml,
        creativeRendererUrl: testCase.creativeRendererUrl,
        bridges: testCase.bridges,
        creativeMeta: testCase.creativeMeta,
        placementType: testCase.placementType,
        placementElement: placement,
        visible: true,
        hostContext: 'app',
        hostOwnsClamping: true,
        requireSharcInit: testCase.requireSharcInit,
        environmentData: testCase.creativeHtml ? makeEnvironmentData(testCase) : undefined,
        supportedFeatures: testCase.bridges && testCase.bridges.includes('mraid')
          ? [{ name: 'com.iabtechlab.sharc.mraid', version: '1.0', functions: {} }]
          : undefined,
        timeouts: timeoutsForCase(testCase),
        onStateChange: (next, prev) => observation.states.push({ next, prev }),
        onPlacementChange: (change) => observation.placementChanges.push({
          intent: change && change.intent === undefined ? 'undefined' : (change && change.intent),
          width: change && change.placementUpdate && change.placementUpdate.width,
          height: change && change.placementUpdate && change.placementUpdate.height,
        }),
        onError: (code, message) => {
          observation.errors.push({ code, message });
          setTimeout(finish, 50);
        },
        onSecurityEvent: (event) => {
          observation.securityEvents.push({
            type: event && event.type,
            errorCode: event && event.errorCode,
            details: event && event.details,
          });
        },
        onMessage: (_direction, msg) => {
          if (!msg || msg.type !== 'SHARC:Creative:log' || !msg.args) return;
          const message = msg.args.message || '';
          observation.logs.push(message);
          if (message.indexOf('g5url:ready:') === 0 || message.indexOf('g5f1:ready:') === 0) {
            observation.ready = true;
          }
          if (message.indexOf('g6expand:ready:') === 0 || message.indexOf('g6exfil:ready:') === 0) {
            observation.ready = true;
          }
          if (testCase.phase2 === 'lifecycle' && message.indexOf('g5f1:ev:') === 0) {
            post({ type: 'control', action: 'backgroundForeground', bidId: testCase.ids.bidId });
          }
          if (message.indexOf('g5url:ev:') === 0 || message.indexOf('g5f1:ev:') === 0) {
            if (!testCase.phase2) setTimeout(finish, 100);
          }
          if (testCase.phase2 === 'expand-collapse'
              && message.indexOf('g6expand:collapse-resolved:') === 0) {
            setTimeout(finish, 100);
          }
        },
      };
      container = new SHARCContainer(containerOptions);
      activeContainer = container;
      activeObservation = observation;
      container.load();
      doneTimer = setTimeout(
        finish,
        testCase.phase2 === 'mraid-corpus' ? 36_000 : testCase.phase2 ? 5200 : (testCase.requireSharcInit ? 2600 : 1600),
      );
    } catch (err) {
      observation.errors.push({ code: 'construction', message: String(err && err.message ? err.message : err) });
      finish();
    }
  });
}

window.__sharcHarnessSetHostLifecycle = function (state) {
  const container = activeContainer;
  if (!container || typeof container.setHostLifecycle !== 'function') return;
  container.setHostLifecycle(state);
  if (activeObservation) activeObservation.hostLifecycleEvents.push(state);
};

window.__sharcHarnessSetHostExposure = function (percent) {
  const container = activeContainer;
  if (!container || typeof container.setHostExposure !== 'function') return;
  container.setHostExposure(percent);
};

async function main() {
  const urlCases = await loadUrlLifecycleCases();
  const mraidMarkupCases = await g6MraidMarkupCases();
  const mraidCorpusCases = await loadMraidCorpusCases();
  const cases = mraidCorpusCases.length > 0
    ? mraidCorpusCases
    : [...urlCases, ...g5BrowserCases(), ...g6Phase2Cases(), ...mraidMarkupCases];
  let passed = 0;
  let failed = 0;

  for (let i = 0; i < cases.length; i++) {
    const testCase = cases[i];
    statusEl.textContent = `Running ${i + 1}/${cases.length}: ${testCase.ids.bidId}`;
    const row = await runCase(testCase);
    if (row.outcome.status === 'passed') passed += 1;
    else failed += 1;
    post(row);
  }

  post({ type: 'summary', total: cases.length, passed, failed });
}

main().catch((err) => {
  post({
    type: 'summary',
    status: 'failed',
    reason: String(err && err.stack ? err.stack : err),
  });
});
</script>
</body>
</html>
