<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHARC Test Creative</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      width: 100%;
      height: 100%;
      min-height: 250px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ad-card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      max-width: 280px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      transform: translateY(20px);
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .ad-card.visible {
      transform: translateY(0);
      opacity: 1;
    }
    .ad-logo {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 14px;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }
    h2 {
      font-size: 20px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 8px;
    }
    p {
      font-size: 13px;
      color: #666;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .cta-btn {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: opacity 0.2s;
    }
    .cta-btn:hover { opacity: 0.9; }
    .cta-btn:active { opacity: 0.8; transform: scale(0.98); }
    .state-badge {
      display: inline-block;
      margin-top: 12px;
      font-size: 11px;
      font-weight: 600;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .close-btn {
      position: fixed;
      top: 8px;
      right: 8px;
      background: rgba(0,0,0,0.4);
      color: white;
      border: none;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    .close-btn:hover { background: rgba(0,0,0,0.6); }
    .debug-log {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0,0,0,0.7);
      color: #0f0;
      font-size: 10px;
      font-family: monospace;
    }
    .debug-log-toggle {
      width: 100%;
      background: transparent;
      color: #888;
      border: none;
      padding: 3px 8px;
      font-size: 10px;
      font-family: monospace;
      cursor: pointer;
      text-align: left;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .debug-log-toggle:hover { background: rgba(255,255,255,0.08); color: #ccc; }
    .debug-log-body {
      max-height: 80px;
      overflow-y: auto;
      padding: 2px 8px 4px;
    }
    .debug-log-body div { margin: 1px 0; }
    .debug-log.collapsed .debug-log-body { display: none; }
    .log-recv { color: #88f; }
    .log-sent { color: #8f8; }
    .log-info { color: #ff8; }
  </style>
</head>
<body>

<div class="ad-card" id="adCard">
  <div class="ad-logo">🎯</div>
  <h2>SHARC Default Test</h2>
  <p>This is a test SHARC-enabled creative. It demonstrates the full protocol lifecycle.</p>
  <button class="cta-btn" id="ctaBtn">Learn More</button>
  <div class="state-badge" id="stateBadge">initializing...</div>
</div>

<button class="close-btn" id="closeBtn" title="Request Close">✕</button>

<div class="debug-log collapsed" id="debugLog">
  <button class="debug-log-toggle" id="debugLogToggle" aria-expanded="false" title="Toggle creative log">
    <span id="debugLogIcon">▲</span>
    <span id="debugLogCount">0 logs</span>
  </button>
  <div class="debug-log-body" id="debugLogBody"></div>
</div>

<!-- Load the SHARC library with dist support -->
<script>
(function() {
  const urlParams = new URLSearchParams(window.location.search);
  const useDist = urlParams.has('build') && urlParams.get('build') === 'dist';
  const basePath = useDist ? '../dist/' : '../../src/';
  
  window.SHARC_BUILD = useDist ? 'dist' : 'dev';
  
  const script = document.createElement('script');
  script.type = 'module';
  script.src = basePath + 'sharc-creative.js';
  script.onload = function() {
    console.log('SHARC creative module loaded from', useDist ? 'dist' : 'dev');
  };
  script.onerror = function() {
    console.error('Failed to load SHARC creative module');
  };
  document.head.appendChild(script);
})();
</script>

<script type="module">
  // Import SHARC modules
  import { SHARC } from '../../src/sharc-creative.js';

  // -------------------------------------------------------------------------
  // Creative debug logger (collapsible overlay at bottom of iframe)
  // -------------------------------------------------------------------------
  const logEl       = document.getElementById('debugLog');
  const logBodyEl   = document.getElementById('debugLogBody');
  const logToggleEl = document.getElementById('debugLogToggle');
  const logCountEl  = document.getElementById('debugLogCount');
  const logIconEl   = document.getElementById('debugLogIcon');
  let   logCount    = 0;

  function addLog(text, cls) {
    const d = document.createElement('div');
    d.className = cls || 'log-info';
    d.textContent = `[${new Date().toISOString().substr(11,8)}] ${text}`;
    logBodyEl.appendChild(d);
    logBodyEl.scrollTop = logBodyEl.scrollHeight;
    logCount++;
    logCountEl.textContent = logCount + (logCount === 1 ? ' log' : ' logs');
  }

  logToggleEl.addEventListener('click', () => {
    const nowCollapsed = logEl.classList.toggle('collapsed');
    logIconEl.textContent = nowCollapsed ? '▲' : '▼';
    logToggleEl.setAttribute('aria-expanded', String(!nowCollapsed));
  });

  // -------------------------------------------------------------------------
  // SHARC Creative Implementation
  // -------------------------------------------------------------------------

  // onReady: called when Container:init received
  // Configure the creative based on environment data
  SHARC.onReady(async (env, features) => {
    addLog('onReady called', 'log-recv');
    addLog(`env: muted=${env.isMuted}, version=${env.version}`, 'log-info');

    // Check feature support
    if (features && features.length > 0) {
      addLog(`features: ${features.map(f => f.name || f).join(', ')}`, 'log-info');
    }

    // Update state badge
    document.getElementById('stateBadge').textContent = 'ready — waiting to start';

    // Simulate asset loading (quick in this test)
    await new Promise(resolve => setTimeout(resolve, 100));

    addLog('onReady resolved — assets loaded', 'log-sent');
    // Promise resolved → container will send startCreative
  });

  // onStart: called when Container:startCreative received
  SHARC.onStart(async () => {
    addLog('onStart called', 'log-recv');

    // Animate the ad card in
    const card = document.getElementById('adCard');
    card.classList.add('visible');
    document.getElementById('stateBadge').textContent = 'active';

    addLog('onStart resolved — creative is visible', 'log-sent');
  });

  // State change listener
  SHARC.on('stateChange', (state) => {
    addLog(`stateChange → ${state}`, 'log-recv');
    const badge = document.getElementById('stateBadge');
    badge.textContent = state;

    // React to lifecycle states
    if (state === 'hidden' || state === 'frozen') {
      // Pause any animations/media
      document.getElementById('adCard').style.animationPlayState = 'paused';
    } else if (state === 'active') {
      document.getElementById('adCard').style.animationPlayState = 'running';
    }
  });

  // Placement change listener
  SHARC.on('placementChange', (placement) => {
    addLog(`placementChange: ${JSON.stringify(placement)}`, 'log-recv');
  });

  // Close handler: runs when Container:close received
  // Gets up to ~1.8 seconds (watchdog enforces the limit)
  SHARC.on('close', () => {
    addLog('Container:close received — running close sequence', 'log-recv');
    const card = document.getElementById('adCard');
    card.style.transition = 'all 0.3s ease';
    card.style.transform = 'scale(0.8)';
    card.style.opacity = '0';
    addLog('Close animation started', 'log-info');
    // Return a promise — library waits for it (up to watchdog limit)
    return new Promise(resolve => setTimeout(resolve, 400));
  });

  // -------------------------------------------------------------------------
  // UI Interactions
  // -------------------------------------------------------------------------

  // CTA button → click through
  document.getElementById('ctaBtn').addEventListener('click', () => {
    addLog('CTA clicked — requesting navigation', 'log-sent');
    SHARC.requestNavigation({
      url: 'https://www.iabtechlab.com',
      target: 'clickthrough',
    });
    // Fake trackers — the kinds of URLs a real DSP / verification vendor
    // would attach to a click. Cache-busted with the current timestamp.
    const ts = Date.now();
    SHARC.reportInteraction([
      `https://pixel.adsafeprotected.com/rjss/st/click?ts=${ts}&cb=${ts}`,
      `https://ad.doubleclick.net/activity;src=12345;cat=sharc;type=click;ord=${ts}`,
      `https://tracker.example-dsp.com/click?campaign=sharc-spring-2026&creative=test-001&ts=${ts}`,
      `https://t.moatads.com/iabtechlab/click?i=SHARC_DEMO&ts=${ts}`,
    ]);
    addLog('reportInteraction sent', 'log-sent');
  });

  // Creative-provided close button → request close
  document.getElementById('closeBtn').addEventListener('click', () => {
    addLog('Creative close btn clicked — requesting close', 'log-sent');
    SHARC.requestClose().then(() => {
      addLog('requestClose resolved', 'log-info');
    }).catch((err) => {
      addLog(`requestClose rejected: ${JSON.stringify(err)}`, 'log-info');
    });
  });
</script>
</body>
</html>
