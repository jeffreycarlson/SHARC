<!DOCTYPE html>
<!--
  markup-host.html — committed lifecycle-ordering fixture (Slice A, Markup path).

  Promotes test/browser/spike-lifecycle-markup-host.html into a committed
  fixture. Constructs `new SHARC.Container({ creativeHtml, creativeRendererUrl,
  bridges:['mraid'] })` — the Creative Markup / renderer-protocol path. On this
  path Container:init is gated on the renderer's `SHARC:Renderer:rendered` reply.
  TODAY the reference renderer posts `:rendered` at the inner document's
  DOMContentLoaded (the anchor Slice A re-points to inner `window 'load'`).

  Query parameters (drive the heavy-creative edge, L-4):
    ?asset=<n>   — creative appends <n> slow subresources (default 0).
    ?delay=<ms>  — each slow subresource delayed <ms> ms (default 400).

  The creative ships NO SHARC SDK, so `bridges:['mraid']` makes the renderer
  PREPEND the MRAID wrapper prelude before the creative scripts — window.mraid
  is live before the [LIFELOG] instrumentation runs.
-->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>SHARC Lifecycle — Markup path fixture</title>
    <style>
      html, body { margin: 0; padding: 0; }
      #adSlot { width: 300px; height: 250px; }
    </style>
    <script type="module" src="/dist/sharc-container.mjs"></script>
  </head>
  <body>
    <div id="adSlot"></div>
    <script type="module">
      const u = new URL(window.location.href);
      const rendererPort = (Number(u.port) || 8765) + 1;
      const RENDERER_BASE = u.protocol + '//' + u.hostname + ':' + rendererPort;
      const rendererUrl = RENDERER_BASE + '/examples/renderer/';

      const q = new URLSearchParams(u.search || '');
      const assets = Math.max(0, Number(q.get('asset')) || 0);
      const delay = Math.max(1, Number(q.get('delay')) || 400);

      // Build the instrumented creative markup. The slow-asset loop points at
      // the renderer origin's `?__slow=<ms>` route so `window 'load'` lags DCL
      // inside the renderer iframe (the heavy-creative edge, L-4).
      const heavyScript = assets > 0
        ? [
            '<script>',
            '  (function () {',
            '    for (var i = 0; i < ' + assets + '; i++) {',
            '      var img = document.createElement("img");',
            '      img.style.cssText = "position:absolute;width:1px;height:1px;opacity:0;";',
            '      img.src = "/test/browser/fixtures/lifecycle/?__slow=' + delay + '&n=" + i + "_" + Date.now();',
            '      (document.head || document.documentElement).appendChild(img);',
            '    }',
            '    LOG("heavy: appended ' + assets + ' slow asset(s) @ ' + delay + 'ms each");',
            '  })();',
            '<\/script>',
          ].join('\n')
        : '';

      const creativeHtml = [
        '<!DOCTYPE html>',
        '<html lang="en">',
        '<head>',
        '<meta charset="utf-8">',
        '<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">',
        '<style> body { margin:0; padding:0; overflow:hidden; background:transparent; } </style>',
        '<script>',
        '  window.__LIFELOG_T0 = performance.now();',
        '  window.LOG = function (tag) {',
        '    var perf = performance.now();',
        '    var st = "n/a";',
        '    try {',
        '      if (window.mraid && typeof window.mraid.getState === "function") {',
        '        st = window.mraid.getState();',
        '      }',
        '    } catch (e) { st = "err:" + e.message; }',
        '    console.log("[LIFELOG] " + perf.toFixed(2) + " " + Date.now() + " " + tag + " | getState=" + st);',
        '  };',
        '  LOG("head script run (first inline creative script)");',
        '<\/script>',
        '<script>',
        '  document.addEventListener("readystatechange", function () { LOG("readyState=" + document.readyState); }, true);',
        '  document.addEventListener("DOMContentLoaded", function () { LOG("DOMContentLoaded"); }, true);',
        '  window.addEventListener("load", function () { LOG("window load"); }, true);',
        '<\/script>',
        heavyScript,
        '<script>',
        '  try {',
        '    window.mraid.addEventListener("ready", function () { LOG("mraid event: ready (Container:init handshake complete)"); });',
        '    window.mraid.addEventListener("stateChange", function (state) { LOG("mraid event: stateChange(" + state + ")"); });',
        '    window.mraid.addEventListener("sizeChange", function (w, h) { LOG("mraid event: sizeChange(" + w + "," + h + ")"); });',
        '    window.mraid.addEventListener("viewableChange", function (v) { LOG("mraid event: viewableChange(" + v + ")"); });',
        '    window.mraid.addEventListener("error", function (msg, action) { LOG("mraid event: error(msg=" + msg + ", action=" + action + ")"); });',
        '    LOG("mraid event listeners registered");',
        '  } catch (e) { LOG("FAILED to register mraid listeners: " + e.message); }',
        '<\/script>',
        '</head>',
        '<body>',
        '<script>LOG("body script run (first inline body script)");<\/script>',
        '</body>',
        '</html>',
      ].join('\n');

      function whenReady(cb) {
        if (window.SHARC && typeof window.SHARC.Container === 'function') { cb(); return; }
        var iv = setInterval(function () {
          if (window.SHARC && typeof window.SHARC.Container === 'function') { clearInterval(iv); cb(); }
        }, 10);
      }

      whenReady(function () {
        var adWidth = 300, adHeight = 250;
        var containerEl = document.getElementById('adSlot');
        var environmentData = {
          currentPlacement: {
            initialDefaultSize: { width: adWidth, height: adHeight },
            minDefaultSize:     { width: adWidth, height: adHeight },
            maxDefaultSize:     { width: adWidth, height: adHeight },
            maxExpandSize:      { width: window.innerWidth, height: window.innerHeight },
            viewportSize:       { width: window.innerWidth, height: window.innerHeight },
          },
          dataspec: { model: 'AdCOM', ver: '1.0' },
          data: {
            ad:        { id: 'lifecycle-markup-001' },
            isMuted:   false, volume: 1,
            placement: { tagid: 'lifecycle-markup-slot', instl: 0 },
          },
          containerNavigation: { navigationPossible: true, navigationAllowed: true },
          isMuted: false, volume: 1,
        };

        window.__CONTAINER = new SHARC.Container({
          creativeHtml: creativeHtml,
          creativeRendererUrl: rendererUrl,
          bridges: ['mraid'],
          placementElement: containerEl,
          environmentData: environmentData,
          supportedFeatures: [
            { name: 'com.iabtechlab.sharc.mraid', version: '1.0', functions: {} },
          ],
          timeouts: { rendererLoad: 8000, rendererReply: 6000 },
          autoStart: true,
          visible: false,
          onStateChange: function (newState, prevState) {
            console.log('[HOSTLOG] SHARC container state: ' + (prevState || '-') + ' -> ' + newState);
          },
          onError: function (code, message) {
            console.log('[HOSTLOG] container onError ' + code + ': ' + message);
          },
          onMessage: function (direction, msg) {
            if (!msg) return;
            console.log('[HOSTLOG] msg ' + direction + ': ' + (msg.type || '?'));
          },
        });

        console.log('[HOSTLOG] SHARC.Container constructed; path=markup; rendererUrl=' + rendererUrl);
        console.log('[HOSTLOG] creativeSource=' + window.__CONTAINER.creativeSource);
        if (typeof window.__CONTAINER.load === 'function') {
          window.__CONTAINER.load();
          console.log('[HOSTLOG] container.load() called');
        }
      });
    </script>
  </body>
</html>
