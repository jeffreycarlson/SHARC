<!DOCTYPE html>
<!--
  docopen-omid-harvest-forge-host.html — SE security matrix (C1, OMID variant).

  Same harvest-then-forge chain, but against the OMID shim prelude
  (examples/renderer/index.html installOmidShimPrelude). That prelude bakes the
  OMID `protocolNonce` AND the renderer-protocol `rendererNonce` as closure
  literals and self-removes its own <script> with the same
  document.querySelector + removeChild pattern — so it is the SAME harvest
  surface as the load-probe prelude.

  This fixture runs with `omid: true` (an OmidCompatBridge extension is attached
  and a mock OM SDK is provided on the publisher page, mirroring
  bfcache-relink-fixture.html). The hostile creative:
    gen=1  install Document.prototype.querySelector + Node.prototype.removeChild
           traps; self-rewrite → gen=2.
    gen=2  trap fires during BOTH preludes' self-removal → harvest the renderer
           nonce (forge loadAck) AND the OMID protocolNonce (logged for the
           rotation assertion); stash into window.name; REAL navigation to the
           renderer-origin forge payload.
    nav    forge a :loadAck with the harvested renderer nonce.

  ASSERTIONS (test):
    - 2118 STILL fires (renderer-nonce forge rejected — rotation covers the
      OMID prelude's rendererNonce too).
    - the OMID protocolNonce was harvested (positive control: the OMID prelude
      IS a harvest surface) — its rotation is asserted container-side.
  RED against session-stable nonces.

  Markers:
    [LIFELOG] gen=2 omid harvest result: rendererNonce=present|ABSENT omidNonce=present|ABSENT ...
    [HOSTLOG] onError 2118: ...   ← REQUIRED for GREEN
-->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>SHARC — document.open OMID harvest-then-forge</title>
    <style>html,body{margin:0;padding:0}#adSlot{width:300px;height:250px}</style>
  </head>
  <body>
    <div id="adSlot"></div>
    <script type="module">
      import { SHARCContainer } from '/dist/sharc-container.mjs';
      import { OmidCompatBridge } from '/dist/sharc-omid-bridge.mjs';

      const u = new URL(window.location.href);
      const rendererPort = (Number(u.port) || 8765) + 1;
      const RENDERER_BASE = u.protocol + '//' + u.hostname + ':' + rendererPort;
      const rendererUrl = RENDERER_BASE + '/examples/renderer/';
      const FORGE_URL = RENDERER_BASE + '/test/browser/fixtures/lifecycle/docopen-forge-payload.html';

      // ── Mock OM SDK (mirrors bfcache-relink-fixture.html) so the OMID bridge's
      //    _ensureSdkLoaded short-circuits and the render envelope carries
      //    omid:true + omidProtocolNonce → the renderer installs the OMID shim
      //    prelude (the harvest surface under test). ──────────────────────────
      function Partner() {}
      function VerificationScriptResource() {}
      function Context() {}
      Context.prototype.setContentUrl = function () {};
      Context.prototype.setServiceScriptUrl = function () {};
      Context.prototype.setVideoElement = function () {};
      Context.prototype.setSlotElement = function () {};
      function AdSession() { this._observers = []; }
      AdSession.prototype.setCreativeType = function () {};
      AdSession.prototype.setImpressionType = function () {};
      AdSession.prototype.registerAdView = function () {};
      AdSession.prototype.registerSessionObserver = function (fn) { this._observers.push(fn); };
      AdSession.prototype.start = function () {};
      AdSession.prototype.finish = function () { this._observers.forEach((fn) => fn({ type: 'sessionFinish' })); };
      AdSession.prototype.addFriendlyObstruction = function () {};
      AdSession.prototype.removeFriendlyObstruction = function () {};
      function AdEvents(s) { this.session = s; }
      AdEvents.prototype.loaded = function () {};
      AdEvents.prototype.impressionOccurred = function () {};
      AdEvents.prototype.stateChange = function () {};
      function MediaEvents(s) { this.session = s; }
      MediaEvents.prototype.playerStateChange = function () {};
      function VastProperties() {}
      window.OmidSessionClient = {
        Partner, VerificationScriptResource, Context, AdSession,
        AdEvents, MediaEvents, VastProperties,
      };

      // gen=3: navigate + forge with the (now generation-stale) harvested nonce.
      const gen3Body = [
        '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">',
        '<style>body{margin:0;padding:0}</style>',
        '<script>',
        '  window.LOG = window.LOG || function(){};',
        '  window.addEventListener("load", function () {',
        '    LOG("gen=3 window load");',
        '    try {',
        '      var h = window.__HARVEST || {};',
        '      window.name = JSON.stringify({ harvestedNonce: h.nonce || "",',
        '        placementSessionId: h.psid || "", containerOrigin: h.origin || "", omidNonce: h.omidNonce || "" });',
        '      setTimeout(function () {',
        '        LOG("gen=3 performing REAL navigation to renderer-origin forge payload");',
        '        try { window.location.href = ' + JSON.stringify(FORGE_URL) + '; }',
        '        catch (e) { LOG("gen=3 nav threw: " + e.message); }',
        '      }, 0);',
        '    } catch (e) { LOG("gen=3 nav error: " + e.message); }',
        '  }, true);',
        '<\/script></head><body><h1>navigate</h1></body></html>',
      ].join('\n');
      const gen3BodyB64 = btoa(unescape(encodeURIComponent(gen3Body)));

      const gen2Body = [
        '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">',
        '<style>body{margin:0;padding:0}</style>',
        '<script>',
        '  window.LOG = window.LOG || function(){};',
        '  window.addEventListener("load", function () {',
        '    LOG("gen=2 window load");',
        '    try {',
        '      var h = window.__HARVEST || {};',
        '      var nonce = h.nonce || "";',
        '      var omidNonce = h.omidNonce || "";',
        '      var psid = h.psid || "";',
        '      var origin = h.origin || "";',
        '      LOG("gen=2 omid harvest result: rendererNonce=" + (nonce ? "present" : "ABSENT")',
        '        + " omidNonce=" + (omidNonce ? "present" : "ABSENT")',
        '        + " psid=" + (psid ? "present" : "ABSENT")',
        '        + " origin=" + (origin ? "present" : "ABSENT"));',
        // One more legit reopen → gen=3 advances BOTH chains (renderer + OMID)
        // past the harvested generation, so the forge with the harvested gen-1
        // renderer nonce is stale at gen=3's gate.
        '      setTimeout(function () {',
        '        LOG("gen=2 reopening to gen=3 (advances the chains past the harvested nonces)");',
        '        var html = decodeURIComponent(escape(atob("' + gen3BodyB64 + '")));',
        '        document.open(); document.write(html); document.close();',
        '      }, 0);',
        '    } catch (e) { LOG("gen=2 harvest error: " + e.message); }',
        '  }, true);',
        '<\/script></head><body><h1>omid harvest</h1></body></html>',
      ].join('\n');
      const gen2BodyB64 = btoa(unescape(encodeURIComponent(gen2Body)));

      const creativeHtml = [
        '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">',
        '<script>',
        '  window.__LIFELOG_T0 = performance.now();',
        '  window.LOG = function (tag) {',
        '    console.log("[LIFELOG] " + performance.now().toFixed(2) + " " + Date.now() + " " + tag);',
        '  };',
        '  LOG("gen=1 head script run — installing prototype harvest traps (omid)");',
        '  (function () {',
        '    window.__HARVEST = window.__HARVEST || {};',
        '    function scrape(text) {',
        '      if (!text) return;',
        '      var s = String(text);',
        // The OMID prelude bakes: var protocolNonce="<omid>"; ... var rendererNonce="<renderer>";
        // and the load-probe prelude bakes: var ackNonce="<renderer>";
        // The renderer nonce (ackNonce / rendererNonce) is what authenticates loadAck.
        '      var rn = s.match(/(?:ackNonce|rendererNonce|sharcNonce)\\s*=\\s*"([A-Za-z0-9_-]{16,})"/);',
        '      if (rn && rn[1] && !window.__HARVEST.nonce) {',
        '        window.__HARVEST.nonce = rn[1];',
        '        window.LOG && window.LOG("gen=2 harvest trap fired renderer nonce captured");',
        '      }',
        '      var on = s.match(/protocolNonce\\s*=\\s*"([A-Za-z0-9_-]{16,})"/);',
        '      if (on && on[1] && !window.__HARVEST.omidNonce) {',
        '        window.__HARVEST.omidNonce = on[1];',
        '        window.LOG && window.LOG("gen=2 harvest trap fired OMID protocolNonce captured");',
        '      }',
        '      var p = s.match(/placementSessionId\\s*=\\s*"([0-9a-f-]{36})"/i);',
        '      if (p && p[1] && !window.__HARVEST.psid) window.__HARVEST.psid = p[1];',
        '      var o = s.match(/containerOrigin\\s*=\\s*"(https?:\\/\\/[^"]+)"/);',
        '      if (o && o[1] && !window.__HARVEST.origin) window.__HARVEST.origin = o[1];',
        '    }',
        '    var nativeQS = Document.prototype.querySelector;',
        '    Document.prototype.querySelector = function (sel) {',
        '      var el = nativeQS.apply(this, arguments);',
        '      try { if (el && el.tagName === "SCRIPT") { scrape(el.textContent); scrape(el.text); } } catch (_) {}',
        '      return el;',
        '    };',
        '    var nativeRC = Node.prototype.removeChild;',
        '    Node.prototype.removeChild = function (child) {',
        '      try { if (child && child.tagName === "SCRIPT") { scrape(child.textContent); scrape(child.text); } } catch (_) {}',
        '      return nativeRC.apply(this, arguments);',
        '    };',
        '  }());',
        '<\/script>',
        '<script>',
        '  window.addEventListener("load", function () {',
        '    LOG("gen=1 window load — self-rewriting to harvest stage (omid)");',
        '    setTimeout(function () {',
        '      var html = decodeURIComponent(escape(atob("' + gen2BodyB64 + '")));',
        '      document.open(); document.write(html); document.close();',
        '    }, 0);',
        '  }, true);',
        '<\/script></head><body></body></html>',
      ].join('\n');

      function whenReady(cb) {
        if (window.SHARC && typeof window.SHARC.Container === 'function') { cb(); return; }
        var iv = setInterval(function () {
          if (window.SHARC && typeof window.SHARC.Container === 'function') { clearInterval(iv); cb(); }
        }, 10);
      }
      whenReady(function () {
        const omid = new OmidCompatBridge({ creativeType: 'display', mediaType: 'display' });
        var c = new SHARCContainer({
          creativeHtml: creativeHtml,
          creativeRendererUrl: rendererUrl,
          bridges: ['mraid'],
          extensions: [omid],
          placementElement: document.getElementById('adSlot'),
          environmentData: {
            currentPlacement: {
              initialDefaultSize: { width: 300, height: 250 },
              minDefaultSize: { width: 300, height: 250 },
              maxDefaultSize: { width: 300, height: 250 },
              maxExpandSize: { width: window.innerWidth, height: window.innerHeight },
              viewportSize: { width: window.innerWidth, height: window.innerHeight },
            },
            dataspec: { model: 'AdCOM', ver: '1.0' },
            data: { ad: { id: 'docopen-omid-harvest-forge' }, isMuted: false, volume: 1,
              placement: { tagid: 'omid-harvest-slot', instl: 0 } },
            containerNavigation: { navigationPossible: true, navigationAllowed: true },
            isMuted: false, volume: 1,
          },
          supportedFeatures: [{ name: 'com.iabtechlab.sharc.mraid', version: '1.0', functions: {} }],
          timeouts: { rendererLoad: 8000, rendererReply: 6000 },
          autoStart: true, visible: false,
          onStateChange: function (n, p) { console.log('[HOSTLOG] state: ' + (p || '-') + ' -> ' + n); },
          onError: function (code, msg) { console.log('[HOSTLOG] onError ' + code + ': ' + msg); },
        });
        if (typeof c.load === 'function') c.load();
      });
    </script>
  </body>
</html>
