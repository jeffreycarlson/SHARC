<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>SHARC Slice C — effective-visibility render anchor (L-13)</title>
</head>
<body>
  <!--
    L-13 fixture (validator/puppeteer tier). Exercises EV-6: the render anchor.

    Before P3 (creative-rendered), effective-visibility MUST be notAttached / 0%
    even if the real IntersectionObserver reports ratio 1.0 early. No
    viewableChange(true) may fire before the creative is rendered — mirroring
    OMID AdSession (no measurement before the ad view exists).

    Unlike the node tier (pure composer logic), this fixture drives the REAL
    IntersectionObserver + real page-visibility plumbing through an actual
    container + reference renderer (Creative Markup variant — the variant whose
    `:rendered` reply flips the render anchor). Two observation points:

      timeline — every effectiveVisibilityChange payload the CONTAINER pushes
                 on the wire, tagged with whether the creative-rendered anchor
                 had fired at push time (EV-6's constraint is on pushes);
      received — every payload the real creative SDK actually RECEIVED inside
                 the sandboxed (opaque-origin) creative, reported UP via
                 postMessage — the end-to-end wire proof.

    The positive assertion this fixture exists to pin (review F2): after render
    on a fully-visible page, a payload with effectivePercent > 0 and
    reason === null must be pushed — a fully-visible rendered ad must never
    compose to 0/backgrounded just because no visibilitychange event ever fired
    (review F1: axis-2 must be SEEDED from document.visibilityState, not
    defaulted falsy).
  -->
  <div id="sharc-slot" style="position:absolute;top:0;left:0;width:320px;height:50px;"></div>
  <div id="sharc-slot-url" style="position:absolute;top:60px;left:0;width:320px;height:50px;"></div>

  <!--
    STATIC imports (not `await import(...)`). A module script with only static
    imports and no top-level await executes during the document's deferred phase,
    so `window.__sharcEvHarness.supported` is set BEFORE the `load` event fires
    and the puppeteer runner's post-load `page.evaluate` observes it. A dynamic
    `await import` makes the module async — its top-level await does NOT delay
    `load`, so the runner would race the import and read the pre-import `false`.
  -->
  <script type="module">
    import { SHARCContainer } from '/dist/sharc-container.mjs';
    import * as proto from '/dist/sharc-protocol.mjs';

    // Container-side pushes on the EV channel (tagged with the render anchor).
    const timeline = [];
    // Payloads the creative SDK actually received (posted up from the iframe).
    const received = [];
    // URL-variant leg (Codex-review blocker): same two observation points for
    // a Creative URL container, whose render anchor is the iframe `load` event
    // (no renderer protocol, no `:rendered` envelope).
    const urlTimeline = [];
    const urlReceived = [];

    window.__sharcEvHarness = {
      timeline,
      received,
      urlTimeline,
      urlReceived,
      // True only once the composer/channel surface actually exists on the
      // container — the runner asserts this first so an absent surface reports
      // as a clear failure rather than an infra flake.
      supported: false,
      error: null,
    };

    // The creative iframes are sandboxed WITHOUT allow-same-origin, so the
    // parent cannot read their state directly — each creative messages
    // payloads UP (the one direction an opaque-origin sandbox is allowed).
    window.addEventListener('message', (e) => {
      if (e.data && e.data.kind === 'SHARC_EV_PAYLOAD') {
        received.push(e.data.payload);
      } else if (e.data && e.data.kind === 'SHARC_EV_ERROR') {
        window.__sharcEvHarness.error = 'creative: ' + e.data.error;
      } else if (e.data && e.data.kind === 'SHARC_EV_URL_PAYLOAD') {
        urlReceived.push(e.data.payload);
      } else if (e.data && e.data.kind === 'SHARC_EV_URL_ERROR') {
        window.__sharcEvHarness.error = 'url creative: ' + e.data.error;
      }
    }, false);

    try {
      const hasChannel = Boolean(
        proto.ContainerMessages
          && proto.ContainerMessages.EFFECTIVE_VISIBILITY_CHANGE,
      );
      const hasComposer = typeof SHARCContainer.prototype._composeEffectiveVisibility === 'function';
      window.__sharcEvHarness.supported = hasChannel && hasComposer;

      if (window.__sharcEvHarness.supported) {
        // Reference renderer runs on the adjacent port (server.cjs boots both;
        // rule 7 requires the renderer be cross-origin to this page). Mirrors
        // test/browser/fixtures/lifecycle/docopen-host.html.
        const u = new URL(window.location.href);
        const rendererPort = (Number(u.port) || 8765) + 1;
        const rendererUrl = u.protocol + '//' + u.hostname + ':' + rendererPort + '/examples/renderer/';

        // Markup creative. `bridges: ['mraid']` below makes the reference
        // renderer prepend the sharc-protocol → sharc-creative SDK prelude
        // (synchronous classic scripts) before this markup, so window.SHARC
        // exists — and its handshake establishes the session — before any
        // creative code runs (mirrors fixtures/lifecycle/docopen-host.html; a
        // creative-side async module import would race the port bootstrap).
        const creativeHtml = [
          '<!DOCTYPE html>',
          '<html lang="en"><head><meta charset="utf-8">',
          '<style>body{margin:0;padding:0;overflow:hidden;background:transparent;}</style>',
          '</head><body>ev creative<script>',
          '  try {',
          "    window.SHARC.on('effectiveVisibilityChange', function (p) {",
          "      try { window.parent.postMessage({ kind: 'SHARC_EV_PAYLOAD', payload: p }, '*'); } catch (_) {}",
          '    });',
          '  } catch (e) {',
          "    try { window.parent.postMessage({ kind: 'SHARC_EV_ERROR', error: String(e && e.message || e) }, '*'); } catch (_) {}",
          '  }',
          '<\/script></body></html>',
        ].join('\n');

        const container = new SHARCContainer({
          creativeHtml: creativeHtml,
          creativeRendererUrl: rendererUrl,
          bridges: ['mraid'],
          supportedFeatures: [
            { name: 'com.iabtechlab.sharc.mraid', version: '1.0', functions: {} },
          ],
          placementElement: document.getElementById('sharc-slot'),
          environmentData: {
            currentPlacement: {
              initialDefaultSize: { width: 320, height: 50 },
              minDefaultSize:     { width: 320, height: 50 },
              maxDefaultSize:     { width: 320, height: 50 },
              maxExpandSize:      { width: window.innerWidth, height: window.innerHeight },
              viewportSize:       { width: window.innerWidth, height: window.innerHeight },
            },
            dataspec: { model: 'AdCOM', ver: '1.0' },
            data: {
              ad: { id: 'ev-render-anchor-001' },
              placement: { tagid: 'ev-render-anchor-slot', instl: 0 },
            },
          },
          timeouts: { rendererLoad: 8000, rendererReply: 6000 },
          visible: true,
        });

        // Record every container-side EV push at the wire chokepoint, tagged
        // with the render anchor AT PUSH TIME. EV-6 constrains pushes: no >0
        // value may leave the container before creative-rendered.
        const realSend = container._protocol._sendMessage.bind(container._protocol);
        container._protocol._sendMessage = function (type, args, ...rest) {
          if (type === proto.ContainerMessages.EFFECTIVE_VISIBILITY_CHANGE) {
            timeline.push({ ...args, afterRender: container.creativeRendered === true });
          }
          return realSend(type, args, ...rest);
        };

        container.load();
        window.__sharcContainer = container;

        // ── URL-variant leg ──
        // Creative URL container pointed at a committed creative that imports
        // the SHARC SDK (auto-boots + establishes the session) and relays
        // effectiveVisibilityChange up. Its render anchor is the iframe `load`
        // event itself — this leg pins that a loaded, fully-visible URL
        // creative receives a positive push, not 0/'notAttached' forever.
        const containerUrl = new SHARCContainer({
          creativeUrl: '/test/browser/fixtures/effective-visibility/url-creative.html',
          placementElement: document.getElementById('sharc-slot-url'),
          environmentData: {
            currentPlacement: {
              initialDefaultSize: { width: 320, height: 50 },
              minDefaultSize:     { width: 320, height: 50 },
              maxDefaultSize:     { width: 320, height: 50 },
              maxExpandSize:      { width: window.innerWidth, height: window.innerHeight },
              viewportSize:       { width: window.innerWidth, height: window.innerHeight },
            },
            dataspec: { model: 'AdCOM', ver: '1.0' },
            data: {
              ad: { id: 'ev-render-anchor-url-001' },
              placement: { tagid: 'ev-render-anchor-url-slot', instl: 0 },
            },
          },
          visible: true,
        });

        const realSendUrl = containerUrl._protocol._sendMessage.bind(containerUrl._protocol);
        containerUrl._protocol._sendMessage = function (type, args, ...rest) {
          if (type === proto.ContainerMessages.EFFECTIVE_VISIBILITY_CHANGE) {
            urlTimeline.push({ ...args, afterRender: containerUrl.creativeRendered === true });
          }
          return realSendUrl(type, args, ...rest);
        };

        containerUrl.load();
        window.__sharcContainerUrl = containerUrl;
      }
    } catch (err) {
      window.__sharcEvHarness.error = String(err && err.message || err);
    }
  </script>
</body>
</html>
