<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>G5 URL SHARC passing fixture</title>
<script>
window.__g5UrlDocumentLoadAt = null;
window.addEventListener('load', function () {
  window.__g5UrlDocumentLoadAt = Math.round(performance.now());
});
</script>
<script src="/dist/sharc-creative.js"></script>
<script>
(function () {
  function report(kind, data) {
    try {
      window.SHARC.log('g5url:' + kind + ':' + JSON.stringify(data || {}));
    } catch (_) {
      // Reporting must never break the conformance creative.
    }
  }

  window.SHARC.onReady(function (env) {
    report('ready', {
      readyAt: Math.round(performance.now()),
      documentLoadAt: window.__g5UrlDocumentLoadAt,
      readyState: document.readyState,
      currentState: env && env.currentState,
    });
  });

  window.SHARC.onStart(function () {
    report('start', { at: Math.round(performance.now()) });
    window.SHARC.on('effectiveVisibilityChange', function (payload) {
      report('ev', payload || {});
    });
  });
})();
</script>
</head>
<body style="margin:0;background:#14324a;color:#fff;font:14px/1.4 system-ui;padding:8px;">
G5 URL SHARC passing fixture
</body>
</html>
