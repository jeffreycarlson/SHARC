<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- script-src allows https: because the REAL OM SDK pair loads on THIS window
     (vendored binaries served via request interception at
     https://omid.validator.example/*) and the service injects vendor
     verification copies into srcdoc/about:blank child frames that inherit this
     CSP (#244). The renderer iframe keeps its own stricter CSP. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https:; style-src 'unsafe-inline'; frame-src http://localhost:* http://127.0.0.1:*; connect-src *; img-src * data:;">
<title>SHARC Creative Validator Markup Runner</title>
<style>
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; }
  #placement { width: 320px; height: 250px; border: 0; }
</style>
</head>
<body>
<div id="placement"></div>

<script type="module">
import { SHARCContainer } from '/dist/sharc-container.mjs';

const placement = document.getElementById('placement');

function cloneForReport(value) {
  try {
    return JSON.parse(JSON.stringify(value));
  } catch (_) {
    return String(value);
  }
}

function sleep(ms) {
  return new Promise((resolve) => setTimeout(resolve, ms));
}

function waitUntil(predicate, timeoutMs) {
  const started = performance.now();
  return new Promise((resolve) => {
    function poll() {
      if (predicate()) {
        resolve({ timedOut: false });
        return;
      }
      if (performance.now() - started >= timeoutMs) {
        resolve({ timedOut: true });
        return;
      }
      setTimeout(poll, 50);
    }
    poll();
  });
}

function resetPlacement() {
  placement.innerHTML = '';
  placement.removeAttribute('class');
  placement.removeAttribute('style');
  placement.style.width = '320px';
  placement.style.height = '250px';
}

function escapeInlineScriptSource(source) {
  return String(source)
    .replace(/<\/script/gi, '<\\/script')
    .replace(/<!--/g, '<\\!--');
}

function expectedBridgeSet(testCase) {
  const values = new Set([
    ...((testCase.expectations && testCase.expectations.declared) || []),
    ...((testCase.expectations && testCase.expectations.sniffed) || []),
  ]);
  return values;
}

function shouldInlineCreativeSdk(testCase) {
  const expected = expectedBridgeSet(testCase);
  return expected.has('safeframe');
}

function expectedOmid(testCase) {
  const omid = testCase
    && testCase.bidSignals
    && testCase.bidSignals.measurement
    && testCase.bidSignals.measurement.omid;
  return expectedBridgeSet(testCase).has('omid')
    || !!(omid && (
      omid.declaredByApi === true
      || omid.sidecarPresent === true
      || omid.inlineVendorScriptPresent === true
    ));
}

function omidSidecarPresent(testCase) {
  return !!(testCase
    && testCase.bidSignals
    && testCase.bidSignals.measurement
    && testCase.bidSignals.measurement.omid
    && testCase.bidSignals.measurement.omid.sidecarPresent === true);
}

// Keep aligned with the normalizer's doubleverify omidProductPaths: only
// DV's verification tags (dvtp_src.js, dvbm.js) carry an OMID client;
// dvbs_src* is the non-OMID RTB blocking/monitoring loader (2026-06-12 G2
// holdout discover). Re-checked here so case files normalized before
// product-scoped detection neither synthesize a VerificationScriptResource
// nor owe an OMID subscription. Validator fixture probes stay
// expectation-bearing.
function isOmidProductVendorScript(script) {
  if (!script) return false;
  if (script.vendor !== 'doubleverify' && script.vendor !== 'pixalate') return true;
  let path = script.url && typeof script.url.path === 'string' ? script.url.path : null;
  if (path === null && typeof script.value === 'string') {
    try {
      path = new URL(script.value).pathname;
    } catch (_) {
      path = '';
    }
  }
  if (script.vendor === 'pixalate') {
    // Keep aligned with the normalizer's pixalate omidProductPaths: only the
    // analytics tag family (aa.js / aaom.js) bootstraps the OMID-bearing
    // cdnf.js|cdno.js payload.
    return /(?:^|\/)aa(?:om)?\.js$/i.test(path || '');
  }
  return /(?:^|\/)dvtp_src\.js$/i.test(path || '')
    || /(?:^|\/)dvbm\.js$/i.test(path || '')
    || /^\/__sharc-validator-fixtures\//.test(path || '');
}

function omidInlineVendorScripts(testCase) {
  const omid = testCase
    && testCase.bidSignals
    && testCase.bidSignals.measurement
    && testCase.bidSignals.measurement.omid;
  const scripts = omid && Array.isArray(omid.inlineVendorScripts)
    ? omid.inlineVendorScripts
    : [];
  return scripts.filter(isOmidProductVendorScript);
}

function omidInlineVendorVendors(testCase) {
  const omid = testCase
    && testCase.bidSignals
    && testCase.bidSignals.measurement
    && testCase.bidSignals.measurement.omid;
  if (omid && Array.isArray(omid.inlineVendorVendors)) {
    return omid.inlineVendorVendors.slice();
  }
  const vendors = [];
  for (const script of omidInlineVendorScripts(testCase)) {
    if (script && script.vendor && vendors.indexOf(script.vendor) === -1) {
      vendors.push(script.vendor);
    }
  }
  return vendors;
}

function shouldProbeOmidVendors(testCase) {
  return omidInlineVendorScripts(testCase).length > 0;
}

function shouldEnableOmidForRun(testCase) {
  return omidSidecarPresent(testCase) || shouldProbeOmidVendors(testCase);
}

function omidInlineVendorAccessMode(options) {
  return options && options.omidInlineVendorAccessMode === 'full'
    ? 'full'
    : 'limited';
}

function synthesizeOmidSidecarFromInlineVendors(testCase, accessMode) {
  if (!shouldProbeOmidVendors(testCase) || omidSidecarPresent(testCase)) {
    return testCase;
  }
  const cloned = cloneForReport(testCase);
  // The normalizer enforces explicit HTTPS + known vendor hosts upstream; keep
  // this HTTPS check as defense-in-depth before synthesized sidecar execution.
  // The validator shim exposes the same OMID JS surface for limited/full; this
  // label lets real vendor scripts self-route on the declared access mode.
  const scripts = omidInlineVendorScripts(cloned)
    .filter((script) => script && typeof script.value === 'string' && /^https:\/\//i.test(script.value))
    .slice(0, 16)
    .map((script) => ({
      resourceUrl: script.value,
      vendor: script.vendor || 'inline-omid-vendor',
      verificationParameters: 'sharc-validator-inline-vendor',
      accessMode,
    }));
  if (scripts.length === 0) return testCase;

  cloned.sharcOptions = cloned.sharcOptions || {};
  cloned.sharcOptions.creativeMeta = cloned.sharcOptions.creativeMeta || {};
  const apis = Array.isArray(cloned.sharcOptions.creativeMeta.apis)
    ? cloned.sharcOptions.creativeMeta.apis.slice()
    : [];
  if (apis.indexOf(7) === -1) apis.push(7);
  cloned.sharcOptions.creativeMeta.apis = apis;
  cloned.sharcOptions.creativeMeta.measurement = cloned.sharcOptions.creativeMeta.measurement || {};
  cloned.sharcOptions.creativeMeta.measurement.omid = {
    verificationScripts: scripts,
    creativeType: 'display',
    impressionType: 'beginToRender',
    mediaType: 'display',
  };
  return cloned;
}

var OMID_CANARY_VENDOR = 'sharc-validator-canary';
var OMID_SERVICE_FRAME_ID_PREFIX = 'omid-verification-script-frame-';

function isOmidCanaryScript(script) {
  if (!script) return false;
  if (script.vendor === OMID_CANARY_VENDOR) return true;
  var url = typeof script.resourceUrl === 'string' ? script.resourceUrl : script.url;
  return typeof url === 'string' && url.indexOf('omid-canary-verification-client.js') !== -1;
}

/**
 * Registers the validator-owned canary verification client (#244 design §6.2)
 * as one extra `VerificationScriptResource` so the REAL service injects it
 * next to the vendor copies. Only called in `sdkMode === 'service'` runs.
 */
function appendOmidServiceCanary(testCase, canaryUrl, probeNonce) {
  if (!canaryUrl) return testCase;
  var sidecar = testCase
    && testCase.sharcOptions
    && testCase.sharcOptions.creativeMeta
    && testCase.sharcOptions.creativeMeta.measurement
    && testCase.sharcOptions.creativeMeta.measurement.omid;
  if (!sidecar || !Array.isArray(sidecar.verificationScripts)
      || sidecar.verificationScripts.length === 0) {
    return testCase;
  }
  var cloned = cloneForReport(testCase);
  cloned.sharcOptions.creativeMeta.measurement.omid.verificationScripts.push({
    resourceUrl: canaryUrl + '?probeNonce=' + encodeURIComponent(probeNonce),
    vendor: OMID_CANARY_VENDOR,
    verificationParameters: OMID_CANARY_VENDOR,
    accessMode: 'limited',
  });
  return cloned;
}

function emptyOmidServiceDiagnostics(sdkMode) {
  return {
    sdkMode: sdkMode,
    // Service-injected verification iframes observed in the harness document
    // (the canary is counted separately under `canary.injected`).
    injectedResourceCount: 0,
    injectedVendors: [],
    // Verification-service protocol traffic observed on the harness top
    // window (client → service postMessages).
    subscriptionMessages: 0,
    subscriptionsByMethod: {},
    subscriptionsByVendor: {},
    subscriptionEventTypes: {},
    expectedVendorServiceSubscriptionObserved: false,
    canary: {
      injected: false,
      loaded: false,
      hasInjectionId: false,
      sessionStart: false,
      sessionFinish: false,
      impression: false,
      loadedEvent: false,
      geometryChangeCount: 0,
      deliveryComplete: false,
    },
    samples: [],
  };
}

/**
 * Tracks the hidden verification iframes the REAL service injects into the
 * harness document, mapping each frame's contentWindow to the resource it
 * carries so verification-service protocol traffic can be attributed.
 */
function createOmidServiceFrameRegistry() {
  var records = [];

  function resourceUrlForFrame(frame) {
    var srcdoc = '';
    try {
      srcdoc = frame.getAttribute('srcdoc') || '';
    } catch (_) {
      srcdoc = '';
    }
    if (srcdoc) {
      // `limited` access mode: the service writes the resource into a
      // sandboxed srcdoc document as a script tag whose src is the
      // resourceUrl. (No literal script-tag text here — this comment lives
      // inside an inline script element.)
      var match = /src="([^"]+)"/.exec(srcdoc);
      if (match) return match[1];
    }
    try {
      // `full` access mode: same-origin about:blank frame; the service
      // appends the resource script into the frame head.
      var scripts = frame.contentDocument
        ? frame.contentDocument.getElementsByTagName('script')
        : [];
      for (var i = 0; i < scripts.length; i += 1) {
        if (scripts[i].src) return scripts[i].src;
      }
    } catch (_) {
      // Cross-origin/opaque frame without srcdoc: leave unattributed.
    }
    return '';
  }

  function scan() {
    var frames = document.querySelectorAll('iframe[id^="' + OMID_SERVICE_FRAME_ID_PREFIX + '"]');
    for (var i = 0; i < frames.length; i += 1) {
      var frame = frames[i];
      var known = false;
      for (var j = 0; j < records.length; j += 1) {
        if (records[j].frame === frame) { known = true; break; }
      }
      if (known) continue;
      var resourceUrl = resourceUrlForFrame(frame);
      records.push({
        frame: frame,
        injectionId: frame.id.slice(OMID_SERVICE_FRAME_ID_PREFIX.length),
        resourceUrl: resourceUrl,
        vendor: classifyOmidVendorSourceUrl(resourceUrl),
        isCanary: isOmidCanaryScript({ resourceUrl: resourceUrl }),
      });
    }
  }

  return {
    scan: scan,
    recordForSource: function (sourceWindow) {
      if (!sourceWindow) return null;
      scan();
      for (var i = 0; i < records.length; i += 1) {
        var frame = records[i].frame;
        try {
          if (frame.contentWindow === sourceWindow) return records[i];
        } catch (_) {
          // Detached frame; skip.
        }
      }
      return null;
    },
    summarize: function (summary) {
      scan();
      var count = 0;
      var vendors = [];
      for (var i = 0; i < records.length; i += 1) {
        if (records[i].isCanary) {
          summary.canary.injected = true;
          continue;
        }
        count += 1;
        var vendor = records[i].vendor || 'unknown';
        if (vendors.indexOf(vendor) === -1) vendors.push(vendor);
      }
      summary.injectedResourceCount = count;
      summary.injectedVendors = vendors.sort();
    },
  };
}

function addOmidServiceCanaryDiagnostic(summary, payload) {
  if (!summary || !payload || !payload.kind) return;
  var canary = summary.canary;
  if (payload.kind === 'canary-loaded') {
    canary.loaded = true;
    canary.hasInjectionId = payload.hasInjectionId === true;
    return;
  }
  if (payload.kind === 'sessionEvent') {
    var type = payload.event && payload.event.type;
    if (type === 'sessionStart') canary.sessionStart = true;
    if (type === 'sessionFinish') canary.sessionFinish = true;
    return;
  }
  if (payload.kind === 'event') {
    if (payload.eventType === 'impression') canary.impression = true;
    if (payload.eventType === 'loaded') canary.loadedEvent = true;
    if (payload.eventType === 'geometryChange') canary.geometryChangeCount += 1;
  }
}

function omidServiceProtocolArgs(data) {
  var args = data.omid_message_args;
  if (typeof args === 'string') {
    try { args = JSON.parse(args); } catch (_) { args = []; }
  }
  return Array.isArray(args) ? args : [];
}

function addOmidServiceProtocolMessage(summary, vendorSummary, record, data) {
  var method = String(data.omid_message_method || '');
  if (method.indexOf('VerificationService.') !== 0) return;
  var shortMethod = method.slice('VerificationService.'.length);
  if (shortMethod !== 'addEventListener' && shortMethod !== 'addSessionListener') return;
  if (record && record.isCanary) return;
  // The canary stamps its protocol guids; skip them even when frame
  // attribution races so harness traffic never pollutes vendor counts.
  if (String(data.omid_message_guid).indexOf('sharc-canary-') === 0) return;

  summary.subscriptionMessages += 1;
  incrementMap(summary.subscriptionsByMethod, shortMethod);
  var vendor = record && record.vendor ? record.vendor : 'unknown';
  incrementMap(summary.subscriptionsByVendor, vendor);
  var args = omidServiceProtocolArgs(data);
  if (shortMethod === 'addEventListener' && typeof args[0] === 'string') {
    incrementMap(summary.subscriptionEventTypes, args[0]);
  }
  var expected = Array.isArray(vendorSummary && vendorSummary.vendorsExpected)
    ? vendorSummary.vendorsExpected
    : [];
  if (vendor !== 'unknown' && expected.indexOf(vendor) !== -1) {
    summary.expectedVendorServiceSubscriptionObserved = true;
  }
  if (summary.samples.length < 20) {
    summary.samples.push({
      method: shortMethod,
      vendor: vendor,
      eventType: shortMethod === 'addEventListener' && typeof args[0] === 'string' ? args[0] : '',
      attributed: !!record,
    });
  }
}

function finalizeOmidServiceDiagnostics(summary) {
  if (!summary) return summary;
  summary.canary.deliveryComplete = summary.canary.sessionStart === true
    && summary.canary.impression === true;
  return summary;
}

function emptyOmidVendorDiagnostics(testCase, accessMode) {
  const vendorsExpected = omidInlineVendorVendors(testCase).sort();
  return {
    expected: shouldProbeOmidVendors(testCase),
    accessMode,
    scriptsExpected: omidInlineVendorScripts(testCase).length,
    vendorsExpected,
    omid3pFound: false,
    subscriptionObserved: false,
    expectedVendorSubscriptionObserved: false,
    unattributedSubscriptionObserved: false,
    registerSessionObserverCalls: 0,
    addEventListenerCalls: 0,
    expectedVendorRegisterSessionObserverCalls: 0,
    expectedVendorAddEventListenerCalls: 0,
    callbackEvents: 0,
    callbackEventsByType: {},
    callsByVendorKey: {},
    callsByExpectedVendor: {},
    callsBySourceVendor: {},
    callsBySourceOrigin: {},
    unattributedSubscriptionCalls: 0,
    unattributedCallsBySourceVendor: {},
    unattributedCallsBySourceOrigin: {},
    lifecycle: {
      sessionStart: false,
      loaded: false,
      impression: false,
      sessionFinish: false,
    },
    passed: false,
    diagnosticOutcome: 'not-run',
    lifecycleObserved: false,
    lifecycleComplete: false,
    lifecycleNotObserved: false,
    samples: [],
  };
}

function hostMatchesSuffix(hostname, suffix) {
  return hostname === suffix || hostname.endsWith(`.${suffix}`);
}

function classifyOmidVendorSourceUrl(value) {
  let url;
  try {
    url = new URL(String(value || ''));
  } catch (_) {
    return '';
  }
  const hostname = url.hostname.toLowerCase();
  // Keep this allowlist aligned with the normalizer's inline OMID vendor host classifier.
  if (['doubleverify.com'].some((host) => hostMatchesSuffix(hostname, host))) {
    return 'doubleverify';
  }
  if (['adsafeprotected.com', 'integralads.com', 'iasds01.com']
    .some((host) => hostMatchesSuffix(hostname, host))) {
    return 'ias';
  }
  if (['moatads.com', 'moat.com'].some((host) => hostMatchesSuffix(hostname, host))) {
    return 'moat';
  }
  if (['oracle.com', 'oraclecloud.com', 'grapeshot.co.uk']
    .some((host) => hostMatchesSuffix(hostname, host))) {
    return 'oracle';
  }
  if (['adrta.com'].some((host) => hostMatchesSuffix(hostname, host))) {
    return 'pixalate';
  }
  return '';
}

function sourceOriginForUrl(value) {
  try {
    return new URL(String(value || '')).origin || 'unknown';
  } catch (_) {
    return 'unknown';
  }
}

function uniqueNonEmpty(values) {
  const out = [];
  for (const value of values) {
    if (!value || out.indexOf(value) !== -1) continue;
    out.push(value);
  }
  return out;
}

function sourceUrlsForPayload(payload) {
  return Array.isArray(payload.sourceUrls) ? payload.sourceUrls : [];
}

function sourceVendorsForPayload(payload) {
  const vendors = uniqueNonEmpty(sourceUrlsForPayload(payload).map(classifyOmidVendorSourceUrl));
  return vendors.length > 0 ? vendors : ['unknown'];
}

function sourceOriginsForPayload(payload) {
  const origins = uniqueNonEmpty(sourceUrlsForPayload(payload).map(sourceOriginForUrl));
  return origins.length > 0 ? origins : ['unknown'];
}

function incrementMap(map, key) {
  map[key || 'unknown'] = (map[key || 'unknown'] || 0) + 1;
}

function expectedOmidVendorForCall(summary, payload) {
  const expected = Array.isArray(summary.vendorsExpected)
    ? summary.vendorsExpected
    : [];
  if (expected.length === 0) return '';
  const candidates = Array.isArray(payload.sourceUrls)
    ? payload.sourceUrls.map(classifyOmidVendorSourceUrl).filter(Boolean)
    : [];
  for (const candidate of candidates) {
    if (expected.indexOf(candidate) !== -1) return candidate;
  }
  return '';
}

function recordOmidVendorSubscriptionSources(summary, payload, expectedVendor) {
  const sourceVendors = sourceVendorsForPayload(payload);
  const sourceOrigins = sourceOriginsForPayload(payload);
  for (const vendor of sourceVendors) incrementMap(summary.callsBySourceVendor, vendor);
  for (const origin of sourceOrigins) incrementMap(summary.callsBySourceOrigin, origin);
  if (!expectedVendor) {
    for (const vendor of sourceVendors) incrementMap(summary.unattributedCallsBySourceVendor, vendor);
    for (const origin of sourceOrigins) incrementMap(summary.unattributedCallsBySourceOrigin, origin);
  }
}

function recordOmidVendorSubscription(summary, payload, method) {
  const expectedVendor = expectedOmidVendorForCall(summary, payload);
  recordOmidVendorSubscriptionSources(summary, payload, expectedVendor);
  if (expectedVendor) {
    summary.callsByExpectedVendor[expectedVendor] =
      (summary.callsByExpectedVendor[expectedVendor] || 0) + 1;
    if (method === 'registerSessionObserver') {
      summary.expectedVendorRegisterSessionObserverCalls += 1;
    } else {
      summary.expectedVendorAddEventListenerCalls += 1;
    }
    return expectedVendor;
  }

  summary.unattributedSubscriptionCalls += 1;
  return '';
}

function addOmidVendorDiagnostic(summary, payload) {
  if (!summary || !payload || !payload.kind) return;
  if (payload.kind === 'omid3p-found') {
    summary.omid3pFound = payload.present === true;
    return;
  }
  if (payload.kind === 'registerSessionObserver') {
    summary.registerSessionObserverCalls += 1;
    const vendorKey = payload.vendorKey || 'unknown';
    summary.callsByVendorKey[vendorKey] = (summary.callsByVendorKey[vendorKey] || 0) + 1;
    const expectedVendor = recordOmidVendorSubscription(summary, payload, 'registerSessionObserver');
    if (summary.samples.length < 20) {
      summary.samples.push({
        kind: payload.kind,
        vendorKey,
        injectionId: payload.injectionId || '',
        sourceUrls: Array.isArray(payload.sourceUrls) ? payload.sourceUrls.slice(0, 3) : [],
        expectedVendor,
      });
    }
    return;
  }
  if (payload.kind === 'addEventListener') {
    summary.addEventListenerCalls += 1;
    const expectedVendor = recordOmidVendorSubscription(summary, payload, 'addEventListener');
    if (summary.samples.length < 20) {
      summary.samples.push({
        kind: payload.kind,
        eventType: payload.eventType || '',
        injectionId: payload.injectionId || '',
        sourceUrls: Array.isArray(payload.sourceUrls) ? payload.sourceUrls.slice(0, 3) : [],
        expectedVendor,
      });
    }
    return;
  }
  if (payload.kind === 'callback') {
    const eventType = payload.eventType || 'unknown';
    summary.callbackEvents += 1;
    summary.callbackEventsByType[eventType] = (summary.callbackEventsByType[eventType] || 0) + 1;
    if (Object.prototype.hasOwnProperty.call(summary.lifecycle, eventType)) {
      summary.lifecycle[eventType] = true;
    }
    if (summary.samples.length < 20) {
      summary.samples.push({
        kind: payload.kind,
        method: payload.method || '',
        eventType,
      });
    }
  }
}

function finalizeOmidVendorDiagnostics(summary, serviceDiagnostics) {
  if (!summary || summary.expected !== true) return summary;
  summary.subscriptionObserved = summary.registerSessionObserverCalls > 0
    || summary.addEventListenerCalls > 0;
  summary.expectedVendorSubscriptionObserved =
    summary.expectedVendorRegisterSessionObserverCalls > 0
    || summary.expectedVendorAddEventListenerCalls > 0;
  summary.unattributedSubscriptionObserved = summary.unattributedSubscriptionCalls > 0;
  summary.lifecycleObserved = summary.callbackEvents > 0;
  summary.lifecycleComplete = summary.lifecycle.sessionStart === true
    && summary.lifecycle.loaded === true
    && summary.lifecycle.impression === true;
  summary.lifecycleNotObserved = summary.subscriptionObserved === true
    && summary.lifecycleObserved !== true;
  // omid3p channel (the 0.7.8 shim): attributed runtime-observation gate;
  // lifecycleComplete preserves the stricter sessionStart/loaded/impression
  // shape for publication.
  summary.omid3pPassed = summary.omid3pFound === true
    && summary.expectedVendorSubscriptionObserved === true
    && summary.lifecycleObserved === true;
  // Service channel (#244): the REAL `omweb-v1.js` injected a copy of the
  // expected vendor's resource which subscribed through the
  // verification-service protocol, and the validator canary observed the
  // service deliver sessionStart + impression to verification-service
  // subscribers in this session.
  summary.servicePassed = !!(serviceDiagnostics
    && serviceDiagnostics.sdkMode === 'service'
    && serviceDiagnostics.expectedVendorServiceSubscriptionObserved === true
    && serviceDiagnostics.canary
    && serviceDiagnostics.canary.deliveryComplete === true);
  summary.passed = summary.omid3pPassed === true || summary.servicePassed === true;
  summary.deliveryChannel = summary.omid3pPassed && summary.servicePassed
    ? 'both'
    : summary.omid3pPassed
      ? 'omid3p'
      : summary.servicePassed
        ? 'service'
        : 'none';
  if (summary.servicePassed === true && summary.omid3pPassed !== true) {
    summary.diagnosticOutcome = 'expected-vendor-service-delivery';
  } else if (summary.omid3pFound !== true) {
    summary.diagnosticOutcome = 'omid3p-missing';
  } else if (summary.subscriptionObserved !== true) {
    summary.diagnosticOutcome = 'no-subscription';
  } else if (summary.expectedVendorSubscriptionObserved === true) {
    summary.diagnosticOutcome = summary.lifecycleObserved === true
      ? 'expected-vendor-lifecycle'
      : 'expected-vendor-no-lifecycle';
  } else {
    summary.diagnosticOutcome = summary.lifecycleObserved === true
      ? 'unattributed-lifecycle'
      : 'unattributed-no-lifecycle';
  }
  return summary;
}

function collectOmidDiagnostics(container, testCase, vendorDiagnostics, accessMode, serviceDiagnostics) {
  const expected = expectedOmid(testCase);
  const sidecarPresent = omidSidecarPresent(testCase);
  const finalizedService = finalizeOmidServiceDiagnostics(serviceDiagnostics);
  const out = {

    function captureSubscriptionSourceUrls() {
      var urls = [];
      try {
        if (document.currentScript && document.currentScript.src) {
          pushUnique(urls, document.currentScript.src);
        }
      } catch (_) {
        // Non-critical: stack parsing below is the fallback.
      }
      try {
        var stack = String((new Error()).stack || '');
        var pattern = /https?:\/\/[^\s)]+/g;
        var match;
        while ((match = pattern.exec(stack)) && urls.length < 8) {
          var candidate = match[0].replace(/:\d+:\d+$/, '').replace(/[>,]+$/, '');
          pushUnique(urls, candidate);
        }
      } catch (_) {
        // Non-critical: source-bound attribution is simply unavailable.
      }
      return urls;
    }

    function install() {
      var api = window.omid3p;
      if (!api || typeof api !== 'object') {
        return false;
      }
      if (installed) return true;
      installed = true;
      emit({
        kind: 'omid3p-found',
        present: true,
        registerSessionObserver: typeof api.registerSessionObserver === 'function',
        addEventListener: typeof api.addEventListener === 'function',
      });

      if (typeof api.registerSessionObserver === 'function') {
        var originalRegister = api.registerSessionObserver;
        api.registerSessionObserver = mirrorFunctionShape(function (observer, vendorKey, injectionId) {
          emit({
            kind: 'registerSessionObserver',
            vendorKey: vendorKey || '',
            injectionId: injectionId || '',
            sourceUrls: captureSubscriptionSourceUrls(),
          });
          return originalRegister.call(
            this,
            wrapCallback('registerSessionObserver', observer),
            vendorKey,
            injectionId
          );
        }, originalRegister);
      }

      if (typeof api.addEventListener === 'function') {
        var originalAddEventListener = api.addEventListener;
        api.addEventListener = mirrorFunctionShape(function (type, listener, injectionId) {
          emit({
            kind: 'addEventListener',
            eventType: type || '',
            injectionId: injectionId || '',
            sourceUrls: captureSubscriptionSourceUrls(),
          });
          return originalAddEventListener.call(
            this,
            type,
            wrapCallback('addEventListener', listener),
            injectionId
          );
        }, originalAddEventListener);
      }
      return true;
    }

    function poll() {
      if (install()) return;
      if (Date.now() - startedAt >= POLL_TIMEOUT_MS) {
        emit({ kind: 'omid3p-found', present: false });
        return;
      }
      setTimeout(poll, POLL_INTERVAL_MS);
    }

    installFunctionToStringPatch();
    poll();
  }.toString().replace('__SHARC_VALIDATOR_PROBE_NONCE__', probeNonce)})();`;
}

function randomProbeNonce() {
  if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') {
    return crypto.randomUUID();
  }
  return String(Date.now()) + '-' + Math.random();
}

function insertAtDocumentStart(html, script) {
  if (!script) return html;
  const headMatch = /<head(?:\s[^>]*)?>/i.exec(html);
  if (headMatch) {
    const index = headMatch.index + headMatch[0].length;
    return html.slice(0, index) + script + html.slice(index);
  }
  const htmlMatch = /<html(?:\s[^>]*)?>/i.exec(html);
  if (htmlMatch) {
    const index = htmlMatch.index + htmlMatch[0].length;
    return html.slice(0, index) + script + html.slice(index);
  }
  const doctypeMatch = /<!doctype[^>]*>/i.exec(html);
  if (doctypeMatch) {
    const index = doctypeMatch.index + doctypeMatch[0].length;
    return html.slice(0, index) + script + html.slice(index);
  }
  return script + html;
}

function addValidatorInstrumentation(html, creativeSdkSource, bridgeProbeSource, probeNonce, testCase) {
  const probeSource = bridgeProbeSource.replace('__SHARC_VALIDATOR_PROBE_NONCE__', probeNonce);
  const navigationPrelude = validatorNavigationPreludeSource(probeNonce);
  const navigationScript = '<scr' + 'ipt>' + escapeInlineScriptSource(navigationPrelude) + '\n</scr' + 'ipt>';
  const omidVendorScript = shouldProbeOmidVendors(testCase)
    ? '<scr' + 'ipt>' + escapeInlineScriptSource(validatorOmidVendorPreludeSource(probeNonce)) + '\n</scr' + 'ipt>'
    : '';
  const probeScript = '<scr' + 'ipt>' + escapeInlineScriptSource(probeSource) + '\n</scr' + 'ipt>';
  const sdkScript = creativeSdkSource
    ? '<scr' + 'ipt>' + escapeInlineScriptSource(creativeSdkSource) + '\n</scr' + 'ipt>'
    : '';
  const bridgeWrapScript = creativeSdkSource
    ? '<scr' + 'ipt>window.__sharcValidatorWrapBridgeCalls && window.__sharcValidatorWrapBridgeCalls();\n</scr' + 'ipt>'
    : '';
  const instrumentation = navigationScript + omidVendorScript + sdkScript + bridgeWrapScript + probeScript;
  const scriptLoadTail = '<scr' + 'ipt>'
    + 'window.__sharcValidatorReconcileScriptLoads && window.__sharcValidatorReconcileScriptLoads();\n'
    + '</scr' + 'ipt>';
  if (typeof html !== 'string') return instrumentation;
  return insertAtDocumentStart(html, instrumentation) + scriptLoadTail;
}

function emptyNavigationDiagnostics() {
  return {
    documentWrite: {
      count: 0,
      writelnCount: 0,
      totalChars: 0,
      maxChars: 0,
      patterns: {
        baseTag: 0,
        form: 0,
        iframe: 0,
        location: 0,
        metaRefresh: 0,
        scriptSrc: 0,
        windowOpen: 0,
      },
      calls: [],
    },
    windowOpen: {
      count: 0,
      calls: [],
    },
    bridgeCalls: {
      count: 0,
      byMethod: {},
      byProtocol: {},
      calls: [],
    },
    probeBridgeCalls: {
      count: 0,
      byMethod: {},
      byProtocol: {},
      calls: [],
    },
    scriptLoads: {
      count: 0,
      loadedCount: 0,
      errorCount: 0,
      byProtocol: {},
      byOrigin: {},
      byStatus: {},
      calls: [],
    },
    documentSources: {
      count: 0,
      byKind: {},
      byProtocol: {},
      byOrigin: {},
      byTag: {},
      calls: [],
    },
  };
}

function addNavigationDiagnostic(summary, payload) {
  if (!payload || !payload.kind) return;
  if (payload.kind === 'write' || payload.kind === 'writeln') {
    const docWrite = summary.documentWrite;
    docWrite.count += 1;
    if (payload.kind === 'writeln') docWrite.writelnCount += 1;
    const charLength = Number.isFinite(payload.charLength) ? payload.charLength : 0;
    docWrite.totalChars += charLength;
    docWrite.maxChars = Math.max(docWrite.maxChars, charLength);
    const patterns = payload.patterns || {};
    for (const key of Object.keys(docWrite.patterns)) {
      if (patterns[key] === true) docWrite.patterns[key] += 1;
    }
    if (docWrite.calls.length < 20) {
      docWrite.calls.push({
        kind: payload.kind,
        lifecycle: cloneForReport(payload.lifecycle || {}),
        argCount: payload.argCount || 0,
        charLength,
        patterns: cloneForReport(patterns),
      });
    }
    return;
  }
  if (payload.kind === 'window.open') {
    const open = summary.windowOpen;
    open.count += 1;
    if (open.calls.length < 20) {
      open.calls.push({
        lifecycle: cloneForReport(payload.lifecycle || {}),
        url: cloneForReport(payload.url || {}),
        target: payload.target || null,
        hasFeatures: payload.hasFeatures === true,
      });
    }
    return;
  }
  if (payload.kind === 'script-load') {
    const scriptLoads = summary.scriptLoads;
    const status = payload.status || 'unknown';
    scriptLoads.byStatus[status] = (scriptLoads.byStatus[status] || 0) + 1;
    if (status === 'discovered') {
      scriptLoads.count += 1;
      const protocol = payload.url && payload.url.protocol ? payload.url.protocol : 'unknown';
      const origin = payload.url && payload.url.origin ? payload.url.origin : 'unknown';
      scriptLoads.byProtocol[protocol] = (scriptLoads.byProtocol[protocol] || 0) + 1;
      scriptLoads.byOrigin[origin] = (scriptLoads.byOrigin[origin] || 0) + 1;
    } else if (status === 'loaded') {
      scriptLoads.loadedCount += 1;
    } else if (status === 'error') {
      scriptLoads.errorCount += 1;
    }
    if (scriptLoads.calls.length < 20) {
      scriptLoads.calls.push({
        status,
        lifecycle: cloneForReport(payload.lifecycle || {}),
        urlHash: payload.urlHash || null,
        url: cloneForReport(payload.url || {}),
        async: payload.async === true,
        defer: payload.defer === true,
        type: payload.type || '',
      });
    }
    return;
  }
  if (payload.kind === 'frame'
      || payload.kind === 'frame-src'
      || payload.kind === 'form'
      || payload.kind === 'form-submit') {
    const sources = summary.documentSources;
    sources.count += 1;
    sources.byKind[payload.kind] = (sources.byKind[payload.kind] || 0) + 1;
    const sourceUrl = payload.kind === 'frame-src' && payload.assignedUrl
      ? payload.assignedUrl
      : payload.url;
    const protocol = sourceUrl && sourceUrl.protocol ? sourceUrl.protocol : 'unknown';
    const origin = sourceUrl && sourceUrl.origin ? sourceUrl.origin : 'unknown';
    const tag = payload.tagName || 'unknown';
    sources.byProtocol[protocol] = (sources.byProtocol[protocol] || 0) + 1;
    sources.byOrigin[origin] = (sources.byOrigin[origin] || 0) + 1;
    sources.byTag[tag] = (sources.byTag[tag] || 0) + 1;
    if (sources.calls.length < 20) {
      sources.calls.push({
        kind: payload.kind,
        lifecycle: cloneForReport(payload.lifecycle || {}),
        tagName: tag,
        url: cloneForReport(payload.url || {}),
        assignedUrl: cloneForReport(payload.assignedUrl || null),
        assignment: payload.assignment || '',
        reason: payload.reason || null,
        srcdoc: payload.srcdoc === true,
        name: payload.name || '',
        sandbox: payload.sandbox || '',
        method: payload.method || '',
        target: payload.target || '',
      });
    }
    return;
  }
  if (payload.kind === 'bridge-call') {
    const method = payload.bridge && payload.method
      ? payload.bridge + '.' + payload.method
      : 'unknown';
    const bridgeCalls = payload.probe === true
      ? summary.probeBridgeCalls
      : summary.bridgeCalls;
    bridgeCalls.count += 1;
    bridgeCalls.byMethod[method] = (bridgeCalls.byMethod[method] || 0) + 1;
    if (payload.url && payload.url.present === true) {
      const protocol = payload.url.protocol || 'unknown';
      bridgeCalls.byProtocol[protocol] = (bridgeCalls.byProtocol[protocol] || 0) + 1;
    }
    if (bridgeCalls.calls.length < 20) {
      bridgeCalls.calls.push({
        bridge: payload.bridge || 'unknown',
        method: payload.method || 'unknown',
        lifecycle: cloneForReport(payload.lifecycle || {}),
        url: cloneForReport(payload.url || {}),
      });
    }
  }
}

window.__sharcCreativeValidatorHarness = {
  async runCase(testCase, options) {
    resetPlacement();
    const started = performance.now();
    const inlineVendorAccessMode = omidInlineVendorAccessMode(options);
    const omidSdkMode = options.omidSdkMode === 'service' ? 'service' : 'mock';
    const probeNonce = randomProbeNonce();
    let runTestCase = synthesizeOmidSidecarFromInlineVendors(testCase, inlineVendorAccessMode);
    if (omidSdkMode === 'service' && shouldEnableOmidForRun(runTestCase)) {
      runTestCase = appendOmidServiceCanary(runTestCase, options.omidCanaryUrl, probeNonce);
    }
    const stateHistory = [];
    const securityEvents = [];
    const errors = [];
    const navigationEvents = [];
    const interactionEvents = [];
    const messages = [];
    const bridgeProbes = [];
    const navigationDiagnostics = emptyNavigationDiagnostics();
    const omidVendorDiagnostics = emptyOmidVendorDiagnostics(runTestCase, inlineVendorAccessMode);
    const omidServiceDiagnostics = emptyOmidServiceDiagnostics(omidSdkMode);
    const omidServiceFrames = createOmidServiceFrameRegistry();
    // Verification-service traffic listener (#244): observes the omid_v1
    // protocol BESIDE the harness — never gates or answers it (the REAL
    // service owns the responder). Records client→service subscription
    // messages attributed via the service's own injected-iframe registry, and
    // the canary's delivery reports (nonce + injected-frame source checked).
    const onOmidServiceMessage = (event) => {
      const data = event && event.data;
      if (!data || typeof data !== 'object') return;
      if (data.type === 'SHARC:Validator:omidServiceCanary') {
        if (data.probeNonce !== probeNonce) return;
        const record = omidServiceFrames.recordForSource(event.source);
        if (!record || record.isCanary !== true) return;
        addOmidServiceCanaryDiagnostic(omidServiceDiagnostics, data.payload || {});
        return;
      }
      if (typeof data.omid_message_method === 'string'
          && typeof data.omid_message_guid === 'string') {
        addOmidServiceProtocolMessage(
          omidServiceDiagnostics,
          omidVendorDiagnostics,
          omidServiceFrames.recordForSource(event.source),
          data,
        );
      }
    };
    if (omidSdkMode === 'service') {
      window.addEventListener('message', onOmidServiceMessage);
    }
    let constructionError = null;
    let loadError = null;
    let container = null;
    // #351: epoch ms (Date.now clock) at which the container observed its
    // Container:init resolve. Anchors the post-render navigation-verdict wait
    // below. Same clock as `securityEvents[].timestamp`, so the two are
    // directly comparable.
    let initResolvedAt = 0;
    const rendererOrigin = new URL(options.rendererUrl).origin;
    const onMessageEvent = (event) => {
      // SECURITY: the probe uses postMessage(..., '*') from inside a sandboxed
      // renderer frame. This private harness listener is the trust boundary:
      // accept only the current renderer iframe, expected renderer origin,
      // current per-case nonce, and first valid probe.
      if (event && event.origin === rendererOrigin && container && container._iframe
          && event.source === container._iframe.contentWindow
          && event.data && event.data.type === 'SHARC:Validator:bridgeProbe'
          && event.data.probeNonce === probeNonce
          && bridgeProbes.length < 6) {
        bridgeProbes.push(cloneForReport(event.data.payload || {}));
      } else if (event && event.origin === rendererOrigin && container && container._iframe
          && event.source === container._iframe.contentWindow
          && event.data && event.data.type === 'SHARC:Validator:navigationDiagnostics'
          && event.data.probeNonce === probeNonce) {
        addNavigationDiagnostic(navigationDiagnostics, event.data.payload || {});
      } else if (event && event.origin === rendererOrigin && container && container._iframe
          && event.source === container._iframe.contentWindow
          && event.data && event.data.type === 'SHARC:Validator:omidVendorDiagnostics'
          && event.data.probeNonce === probeNonce) {
        addOmidVendorDiagnostic(omidVendorDiagnostics, event.data.payload || {});
      }
    };
    window.addEventListener('message', onMessageEvent);

    try {
      // #244 / #211A: with the pinned REAL OM SDK available (`sdkMode:
      // 'service'`) the mock stays out and `_ensureSdkLoaded()` performs the
      // real network load. Under failure injection the mock also stays out so
      // the aborted SDK request drives the real `feature_load_failed` path.
      if (shouldEnableOmidForRun(runTestCase)
          && omidSdkMode !== 'service'
          && options.omidSdkLoadFailure !== true) {
        installMockOmidSessionClient();
      }
      const creativeSdkSource = shouldInlineCreativeSdk(runTestCase)
        ? await loadCreativeSdkSource(options.creativeSdkUrl)
        : '';
      const bridgeProbeSource = await loadBridgeProbeSource();
      container = new SHARCContainer({
        creativeHtml: addValidatorInstrumentation(
          runTestCase.creative.html,
          creativeSdkSource,
          bridgeProbeSource,
          probeNonce,
          runTestCase,
        ),
        creativeRendererUrl: options.rendererUrl,
        placementElement: placement,
        creativeMeta: runTestCase.sharcOptions.creativeMeta || {},
        omidAutoInstall: options.omidAutoInstall || null,
        requireSharcInit: runTestCase.sharcOptions.requireSharcInit === true,
        placementType: runTestCase.sharcOptions.placementType || 'inline',
        timeouts: {
          rendererLoad: options.renderTimeoutMs,
          rendererReply: options.renderTimeoutMs,
          createSession: options.renderTimeoutMs,
        },
        onStateChange: (state, previousState) => {
          stateHistory.push({
            t: Math.round(performance.now() - started),
            from: previousState || null,
            to: state,
          });
        },
        onSecurityEvent: (event) => {
          securityEvents.push(cloneForReport(event));
        },
        onError: (code, message) => {
          errors.push({
            t: Math.round(performance.now() - started),
            code,
            message: message || '',
          });
        },
        onNavigation: (args) => {
          navigationEvents.push({
            t: Math.round(performance.now() - started),
            args: cloneForReport(args),
          });
        },
        onInteraction: (uris) => {
          interactionEvents.push({
            t: Math.round(performance.now() - started),
            uris: cloneForReport(uris),
          });
        },
        onMessage: (direction, message) => {
          const type = message && message.type ? message.type : null;
          const entry = {
            t: Math.round(performance.now() - started),
            direction,
            type,
          };
          // #351: stamp the Container:init resolve with an epoch timestamp so
          // the post-render navigation-verdict wait below can anchor to it on
          // the same clock as the security events. The fixture's onReady-driven
          // navigation fires off this resolve, so init-resolve is the causal
          // origin of the whole nav-adjudication window.
          if (direction === 'sent-resolved' && type === 'SHARC:Container:init') {
            entry.epochTs = Date.now();
            initResolvedAt = entry.epochTs;
          }
          messages.push(entry);
        },
      });
    } catch (err) {
      constructionError = err && err.message ? err.message : String(err);
    }

    if (container) {
      try {
        container.load();
      } catch (err) {
        loadError = err && err.message ? err.message : String(err);
      }
    }

    const isTerminated = () => container && container.getState() === 'terminated';
    const terminal = container
      ? await waitUntil(
          () => container.creativeRendered === true || isTerminated(),
          options.renderTimeoutMs,
        )
      : { timedOut: false };

    if (container && container.creativeRendered && !isTerminated()) {
      if (shouldEnableOmidForRun(runTestCase)
          && typeof container.setState === 'function'
          && container.getState() === 'loading') {
        // Headless corpus runs do not reliably trigger viewport-driven state
        // transitions. For OMID sidecar cases, advance only the private
        // harness lifecycle far enough to validate container-owned measurement.
        container.setState('ready');
        container.setState('active');
      }
      await sleep(options.settleMs);
      // #351: causal wait for the post-render navigation verdict. The settle
      // sleep is a floor that keeps clean cases fast, but the container
      // adjudicates a post-render top-frame navigation asynchronously, and the
      // verdict can land AFTER a short settle floor — misclassifying a failed
      // nav case as `passed`. How the mechanism actually works (verified by
      // measurement, sharc-container.js `_armRendererBackstop` -> the `onAck`
      // path at ~4660 and `_emitRendererLoadObserved` at ~5027):
      //
      //   (a) The FIRST post-render renderer-frame load runs a 100ms
      //       controlled-context probe. That probe is ANSWERED (the renderer is
      //       still ours), so the container emits a non-terminating
      //       `renderer_load_observed` — this is the marker of the first
      //       *verified* load, and it is the ONLY load that emits it.
      //   (b) The fixture's onReady (fired off Container:init) then drives a
      //       cross-origin navigation. That SUBSEQUENT load is UNANSWERED, so
      //       it emits NO `renderer_load_observed` — only an
      //       `unauthorized_navigation` (2118) ~100ms later, once its probe
      //       deadline lapses. The outcome classifier (diagnose.js) buckets
      //       `navigation-policy` on the PRESENCE of that 2118 event.
      //   (c) There is no harness-visible per-subsequent-load marker (the
      //       outbound :loadProbe is not routed through onMessage). So we anchor
      //       the wait to the Container:init RESOLVE instead: the navigation is
      //       dispatched from init's onReady, so init-resolve is the causal
      //       origin of the entire nav-adjudication window. The window need only
      //       span onReady dispatch + the navigation load + the 100ms probe
      //       deadline + margin (measured ~100-130ms; 250ms is ample).
      //
      // WHY anchor at init rather than the first load: the navigation's verdict
      // trails Container:init, which the container itself defers ~200ms after
      // :rendered via a setTimeout. That deferral can DRIFT LATER under CI load.
      // The first-load timestamp does NOT move with that drift, so a load-anchored
      // deadline has only ~78ms of headroom that the drift can eat. The
      // init-resolve timestamp already reflects whatever drift occurred, so an
      // init-anchored deadline absorbs it entirely — fixed headroom regardless of
      // deferral jitter. Benign cases pay ~0: init resolves ~200ms post-render,
      // so the deadline (~200+250=450ms) falls before the 500ms settle floor has
      // elapsed, and waitUntil returns immediately. We also stop early the
      // instant the 2118 verdict (or terminate) lands.
      const VERDICT_WINDOW_MS = 250;
      const hasNavVerdict = () =>
        securityEvents.some((event) => event.type === 'unauthorized_navigation');
      if (!isTerminated() && !hasNavVerdict() && initResolvedAt > 0) {
        const verdictDeadline = initResolvedAt + VERDICT_WINDOW_MS;
        await waitUntil(
          () => isTerminated() || hasNavVerdict() || Date.now() >= verdictDeadline,
          VERDICT_WINDOW_MS,
        );
      }
      // #244: with the REAL service, vendor verification copies are injected
      // and fetched over the network AFTER the session starts, so service-path
      // delivery can land past the settle floor. Bounded extra wait, early-exit
      // the moment the expected signals are in: canary delivery complete
      // (sessionStart + impression dispatched on the verification-service
      // path) and — when inline vendors are expected — an attributed expected-
      // vendor subscription on either channel.
      if (omidSdkMode === 'service' && shouldEnableOmidForRun(runTestCase) && !isTerminated()) {
        const OMID_SERVICE_DELIVERY_EXTRA_MS = 6000;
        const expectedVendorSettled = () => {
          if (omidVendorDiagnostics.expected !== true) return true;
          return omidServiceDiagnostics.expectedVendorServiceSubscriptionObserved === true
            || omidVendorDiagnostics.expectedVendorRegisterSessionObserverCalls > 0
            || omidVendorDiagnostics.expectedVendorAddEventListenerCalls > 0;
        };
        await waitUntil(
          () => isTerminated()
            || (omidServiceDiagnostics.canary.sessionStart === true
              && omidServiceDiagnostics.canary.impression === true
              && expectedVendorSettled()),
          OMID_SERVICE_DELIVERY_EXTRA_MS,
        );
      }
    }

    const result = {
      durationMs: Math.round(performance.now() - started),
      constructionError,
      loadError,
      timedOut: terminal.timedOut,
      creativeRendered: container ? container.creativeRendered === true : false,
      creativeInjected: container ? container.creativeInjected === true : false,
      terminated: isTerminated(),
      finalState: container ? container.getState() : null,
      placementSessionId: container ? container.placementSessionId : null,
      stateHistory,
      securityEvents,
      errors,
      navigationEvents,
      interactionEvents,
      messages,
      bridgeProbes,
      navigationDiagnostics,
      measurement: {
        omid: (() => {
          omidServiceFrames.summarize(omidServiceDiagnostics);
          return collectOmidDiagnostics(
            container,
            runTestCase,
            omidVendorDiagnostics,
            inlineVendorAccessMode,
            omidServiceDiagnostics,
          );
        })(),
      },
    };

    if (container) {
      try { container.close(); } catch (_) { /* ignore cleanup */ }
    }
    window.removeEventListener('message', onMessageEvent);
    if (omidSdkMode === 'service') {
      window.removeEventListener('message', onOmidServiceMessage);
    }
    resetPlacement();
    return result;
  },
};
</script>
</body>
</html>
