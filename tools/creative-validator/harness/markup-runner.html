<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; frame-src http://localhost:* http://127.0.0.1:*; connect-src *; img-src * data:;">
<title>SHARC Creative Validator Markup Runner</title>
<style>
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; }
  #placement { width: 320px; height: 250px; border: 0; }
</style>
</head>
<body>
<div id="placement"></div>

<script type="module">
import { SHARCContainer } from '/dist/sharc-container.mjs';

const placement = document.getElementById('placement');

function cloneForReport(value) {
  try {
    return JSON.parse(JSON.stringify(value));
  } catch (_) {
    return String(value);
  }
}

function sleep(ms) {
  return new Promise((resolve) => setTimeout(resolve, ms));
}

function waitUntil(predicate, timeoutMs) {
  const started = performance.now();
  return new Promise((resolve) => {
    function poll() {
      if (predicate()) {
        resolve({ timedOut: false });
        return;
      }
      if (performance.now() - started >= timeoutMs) {
        resolve({ timedOut: true });
        return;
      }
      setTimeout(poll, 50);
    }
    poll();
  });
}

function resetPlacement() {
  placement.innerHTML = '';
  placement.removeAttribute('class');
  placement.removeAttribute('style');
  placement.style.width = '320px';
  placement.style.height = '250px';
}

function escapeInlineScriptSource(source) {
  return String(source)
    .replace(/<\/script/gi, '<\\/script')
    .replace(/<!--/g, '<\\!--');
}

function expectedBridgeSet(testCase) {
  const values = new Set([
    ...((testCase.expectations && testCase.expectations.declared) || []),
    ...((testCase.expectations && testCase.expectations.sniffed) || []),
  ]);
  return values;
}

function shouldInlineCreativeSdk(testCase) {
  const expected = expectedBridgeSet(testCase);
  return expected.has('mraid') || expected.has('safeframe');
}

function expectedOmid(testCase) {
  return expectedBridgeSet(testCase).has('omid');
}

function omidSidecarPresent(testCase) {
  return !!(testCase
    && testCase.bidSignals
    && testCase.bidSignals.measurement
    && testCase.bidSignals.measurement.omid
    && testCase.bidSignals.measurement.omid.sidecarPresent === true);
}

function collectOmidDiagnostics(container, testCase) {
  const expected = expectedOmid(testCase);
  const sidecarPresent = omidSidecarPresent(testCase);
  const out = {
    expected,
    sidecarPresent,
    extensionPresent: false,
    featureAdvertised: false,
    sessionStarted: false,
    sessionFinished: false,
    loadedFired: false,
    impressionFired: false,
    verificationScriptCount: 0,
  };
  if (!container || !Array.isArray(container._extensions)) return out;

  const extension = container._extensions.find((ext) => {
    if (!ext) return false;
    if (ext.name === 'com.iabtechlab.sharc.omid') return true;
    if (typeof ext.getFeatureName === 'function') {
      try { return ext.getFeatureName() === 'com.iabtechlab.sharc.omid'; } catch (_) { return false; }
    }
    return false;
  });
  if (!extension) return out;

  out.extensionPresent = true;
  try {
    out.featureAdvertised = typeof extension.getFeatureName === 'function'
      && extension.getFeatureName() === 'com.iabtechlab.sharc.omid';
  } catch (_) {
    out.featureAdvertised = false;
  }
  if (extension.options && Array.isArray(extension.options.verificationScripts)) {
    out.verificationScriptCount = extension.options.verificationScripts.length;
  }
  if (extension._omid) {
    out.sessionStarted = extension._omid.sessionStarted === true;
    out.sessionFinished = extension._omid.sessionFinished === true;
    out.loadedFired = extension._omid.loadedFired === true;
    out.impressionFired = extension._omid.impressionFired === true;
  }
  return out;
}

function installMockOmidSessionClient() {
  if (window.OmidSessionClient
      && window.OmidSessionClient.AdSession
      && window.OmidSessionClient.Partner
      && window.OmidSessionClient.Context) {
    return;
  }

  function Partner(name, version) {
    this.name = name;
    this.version = version;
  }

  function VerificationScriptResource(url, vendor, verificationParameters, accessMode) {
    this.url = url;
    this.vendor = vendor;
    this.verificationParameters = verificationParameters;
    this.accessMode = accessMode;
  }

  function Context(partner, verificationScripts) {
    this.partner = partner;
    this.verificationScripts = verificationScripts || [];
  }
  Context.prototype.setContentUrl = function (url) {
    this.contentUrl = url;
  };
  Context.prototype.setServiceScriptUrl = function (url) {
    this.serviceScriptUrl = url;
  };

  function AdSession(context) {
    this.context = context;
  }
  AdSession.prototype.setCreativeType = function (creativeType) {
    this.creativeType = creativeType;
  };
  AdSession.prototype.setImpressionType = function (impressionType) {
    this.impressionType = impressionType;
  };
  AdSession.prototype.registerAdView = function (adView) {
    this.adView = adView;
  };
  AdSession.prototype.registerSessionObserver = function (observer) {
    this.observer = observer;
  };
  AdSession.prototype.start = function () {
    this.started = true;
  };
  AdSession.prototype.finish = function () {
    this.finished = true;
    if (typeof this.observer === 'function') {
      this.observer({ type: 'sessionFinish' });
    }
  };

  function AdEvents(session) {
    this.session = session;
  }
  AdEvents.prototype.loaded = function () {
    this.loadedCalled = true;
  };
  AdEvents.prototype.impressionOccurred = function () {
    this.impressionCalled = true;
  };
  AdEvents.prototype.stateChange = function (state) {
    this.lastState = state;
  };

  window.OmidSessionClient = {
    Partner,
    VerificationScriptResource,
    Context,
    AdSession,
    AdEvents,
  };
}

let creativeSdkSourcePromise = null;
function loadCreativeSdkSource(url) {
  // Batch-runner cache: every case in one harness page uses the same local
  // dist SDK. If the fetch fails, later bridge cases fail the same way.
  if (!creativeSdkSourcePromise) {
    creativeSdkSourcePromise = fetch(url).then((response) => {
      if (!response.ok) throw new Error('Failed to load validator SDK: HTTP ' + response.status);
      return response.text();
    });
  }
  return creativeSdkSourcePromise;
}

let bridgeProbeSourcePromise = null;
function loadBridgeProbeSource() {
  if (!bridgeProbeSourcePromise) {
    bridgeProbeSourcePromise = fetch('/tools/creative-validator/harness/bridge-probe.js')
      .then((response) => {
        if (!response.ok) throw new Error('Failed to load validator bridge probe: HTTP ' + response.status);
        return response.text();
      });
  }
  return bridgeProbeSourcePromise;
}

function randomProbeNonce() {
  if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') {
    return crypto.randomUUID();
  }
  return String(Date.now()) + '-' + Math.random();
}

function insertAtDocumentStart(html, script) {
  if (!script) return html;
  const headMatch = /<head(?:\s[^>]*)?>/i.exec(html);
  if (headMatch) {
    const index = headMatch.index + headMatch[0].length;
    return html.slice(0, index) + script + html.slice(index);
  }
  const htmlMatch = /<html(?:\s[^>]*)?>/i.exec(html);
  if (htmlMatch) {
    const index = htmlMatch.index + htmlMatch[0].length;
    return html.slice(0, index) + script + html.slice(index);
  }
  const doctypeMatch = /<!doctype[^>]*>/i.exec(html);
  if (doctypeMatch) {
    const index = doctypeMatch.index + doctypeMatch[0].length;
    return html.slice(0, index) + script + html.slice(index);
  }
  return script + html;
}

function addValidatorInstrumentation(html, creativeSdkSource, bridgeProbeSource, probeNonce) {
  const probeSource = bridgeProbeSource.replace('__SHARC_VALIDATOR_PROBE_NONCE__', probeNonce);
  const probeScript = '<scr' + 'ipt>' + escapeInlineScriptSource(probeSource) + '\n</scr' + 'ipt>';
  const sdkScript = creativeSdkSource
    ? '<scr' + 'ipt>' + escapeInlineScriptSource(creativeSdkSource) + '\n</scr' + 'ipt>'
    : '';
  const instrumentation = sdkScript + probeScript;
  if (typeof html !== 'string') return instrumentation;
  return insertAtDocumentStart(html, instrumentation);
}

window.__sharcCreativeValidatorHarness = {
  async runCase(testCase, options) {
    resetPlacement();
    const started = performance.now();
    const stateHistory = [];
    const securityEvents = [];
    const errors = [];
    const navigationEvents = [];
    const interactionEvents = [];
    const messages = [];
    const bridgeProbes = [];
    let constructionError = null;
    let loadError = null;
    let container = null;
    const rendererOrigin = new URL(options.rendererUrl).origin;
    const probeNonce = randomProbeNonce();
    const onMessageEvent = (event) => {
      if (bridgeProbes.length > 0) return;
      // SECURITY: the probe uses postMessage(..., '*') from inside a sandboxed
      // renderer frame. This private harness listener is the trust boundary:
      // accept only the current renderer iframe, expected renderer origin,
      // current per-case nonce, and first valid probe.
      if (event && event.origin === rendererOrigin && container && container._iframe
          && event.source === container._iframe.contentWindow
          && event.data && event.data.type === 'SHARC:Validator:bridgeProbe'
          && event.data.probeNonce === probeNonce) {
        bridgeProbes.push(cloneForReport(event.data.payload || {}));
      }
    };
    window.addEventListener('message', onMessageEvent);

    try {
      if (omidSidecarPresent(testCase)) {
        installMockOmidSessionClient();
      }
      const creativeSdkSource = shouldInlineCreativeSdk(testCase)
        ? await loadCreativeSdkSource(options.creativeSdkUrl)
        : '';
      const bridgeProbeSource = await loadBridgeProbeSource();
      container = new SHARCContainer({
        creativeHtml: addValidatorInstrumentation(
          testCase.creative.html,
          creativeSdkSource,
          bridgeProbeSource,
          probeNonce,
        ),
        creativeRendererUrl: options.rendererUrl,
        placementElement: placement,
        creativeMeta: testCase.sharcOptions.creativeMeta || {},
        omidAutoInstall: options.omidAutoInstall || null,
        requireSharcInit: testCase.sharcOptions.requireSharcInit === true,
        placementType: testCase.sharcOptions.placementType || 'inline',
        timeouts: {
          rendererLoad: options.renderTimeoutMs,
          rendererReply: options.renderTimeoutMs,
          createSession: options.renderTimeoutMs,
        },
        onStateChange: (state, previousState) => {
          stateHistory.push({
            t: Math.round(performance.now() - started),
            from: previousState || null,
            to: state,
          });
        },
        onSecurityEvent: (event) => {
          securityEvents.push(cloneForReport(event));
        },
        onError: (code, message) => {
          errors.push({
            t: Math.round(performance.now() - started),
            code,
            message: message || '',
          });
        },
        onNavigation: (args) => {
          navigationEvents.push({
            t: Math.round(performance.now() - started),
            args: cloneForReport(args),
          });
        },
        onInteraction: (uris) => {
          interactionEvents.push({
            t: Math.round(performance.now() - started),
            uris: cloneForReport(uris),
          });
        },
        onMessage: (direction, message) => {
          messages.push({
            t: Math.round(performance.now() - started),
            direction,
            type: message && message.type ? message.type : null,
          });
        },
      });
    } catch (err) {
      constructionError = err && err.message ? err.message : String(err);
    }

    if (container) {
      try {
        container.load();
      } catch (err) {
        loadError = err && err.message ? err.message : String(err);
      }
    }

    const isTerminated = () => container && container.getState() === 'terminated';
    const terminal = container
      ? await waitUntil(
          () => container.creativeRendered === true || isTerminated(),
          options.renderTimeoutMs,
        )
      : { timedOut: false };

    if (container && container.creativeRendered && !isTerminated()) {
      if (omidSidecarPresent(testCase)
          && typeof container.setState === 'function'
          && container.getState() === 'loading') {
        // Headless corpus runs do not reliably trigger viewport-driven state
        // transitions. For OMID sidecar cases, advance only the private
        // harness lifecycle far enough to validate container-owned measurement.
        container.setState('ready');
        container.setState('active');
      }
      await sleep(options.settleMs);
    }

    const result = {
      durationMs: Math.round(performance.now() - started),
      constructionError,
      loadError,
      timedOut: terminal.timedOut,
      creativeRendered: container ? container.creativeRendered === true : false,
      creativeInjected: container ? container.creativeInjected === true : false,
      terminated: isTerminated(),
      finalState: container ? container.getState() : null,
      placementSessionId: container ? container.placementSessionId : null,
      stateHistory,
      securityEvents,
      errors,
      navigationEvents,
      interactionEvents,
      messages,
      bridgeProbes,
      measurement: {
        omid: collectOmidDiagnostics(container, testCase),
      },
    };

    if (container) {
      try { container.close(); } catch (_) { /* ignore cleanup */ }
    }
    window.removeEventListener('message', onMessageEvent);
    resetPlacement();
    return result;
  },
};
</script>
</body>
</html>
